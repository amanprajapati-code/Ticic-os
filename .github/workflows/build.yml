          package com.ticic.daily;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.widget.RemoteViews;

          public class TicicWidget extends AppWidgetProvider {
            @Override
            public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
              for (int i = 0; i < ids.length; i++) {
                m.updateAppWidget(ids[i], build(c));
              }
            }

            static int rid(Context c, String type, String name) {
              return c.getResources().getIdentifier(name, type, c.getPackageName());
            }

            static RemoteViews build(Context c) {
              SharedPreferences p = c.getSharedPreferences("ticic_widget", Context.MODE_PRIVATE);
              RemoteViews v = new RemoteViews(c.getPackageName(), rid(c, "layout", "ticic_widget"));
              String title = p.getString("title", "");
              String sub = p.getString("sub", "");
              if (title.length() == 0) {
                title = "Nothing planned";
                sub = "Tap to add a task";
              }
              v.setTextViewText(rid(c, "id", "tw_title"), title);
              v.setTextViewText(rid(c, "id", "tw_sub"), sub);
              v.setTextViewText(rid(c, "id", "tw_left"), p.getString("left", ""));
              Intent launch = c.getPackageManager().getLaunchIntentForPackage(c.getPackageName());
              if (launch != null) {
                PendingIntent pi = PendingIntent.getActivity(c, 7, launch, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                v.setOnClickPendingIntent(rid(c, "id", "tw_root"), pi);
              }
              return v;
            }

            static void refresh(Context c) {
              AppWidgetManager m = AppWidgetManager.getInstance(c);
              int[] ids = m.getAppWidgetIds(new ComponentName(c, TicicWidget.class));
              for (int i = 0; i < ids.length; i++) {
                m.updateAppWidget(ids[i], build(c));
              }
            }
          }
