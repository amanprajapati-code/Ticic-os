          import re, io, base64, os
          from PIL import Image, ImageDraw
          html = open('index.html', encoding='utf-8').read()
          m = re.search(r'rel="icon"[^>]*href="data:image/png;base64,([^"]+)"', html)
          logo = Image.open(io.BytesIO(base64.b64decode(m.group(1)))).convert('RGBA')
          res = 'android/app/src/main/res'
          def canvas(size, scale, bg=None):
              c = Image.new('RGBA', (size, size), bg or (0, 0, 0, 0))
              w = int(size * scale)
              c.alpha_composite(logo.resize((w, w), Image.LANCZOS), ((size - w) // 2, (size - w) // 2))
              return c
          legacy = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          fg = {'mdpi': 108, 'hdpi': 162, 'xhdpi': 216, 'xxhdpi': 324, 'xxxhdpi': 432}
          for k in legacy:
              d = os.path.join(res, 'mipmap-' + k)
              os.makedirs(d, exist_ok=True)
              canvas(legacy[k], .66, (255, 255, 255, 255)).save(d + '/ic_launcher.png')
              r = canvas(legacy[k], .6, (255, 255, 255, 255))
              mk = Image.new('L', r.size, 0)
              ImageDraw.Draw(mk).ellipse((0, 0) + r.size, fill=255)
              r.putalpha(mk)
              r.save(d + '/ic_launcher_round.png')
              canvas(fg[k], .48).save(d + '/ic_launcher_fg2.png')
          os.makedirs(res + '/mipmap-anydpi-v26', exist_ok=True)
          os.makedirs(res + '/values', exist_ok=True)
          open(res + '/values/ticic_colors.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_bg2">#FFFFFF</color></resources>')
          xml = '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_bg2"/><foreground android:drawable="@mipmap/ic_launcher_fg2"/></adaptive-icon>'
          for n in ('ic_launcher', 'ic_launcher_round'):
              open(res + '/mipmap-anydpi-v26/' + n + '.xml', 'w').write(xml)
          print('icons ok')
