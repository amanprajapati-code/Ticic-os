      - name: Use the same signing key every time
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore
      - name: Build APK
        id: full
        continue-on-error: true
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug 2>&1 | tee /tmp/build_full.log
      - name: Build again without voice and shortcuts (only runs if the first build failed)
        id: novoice
        if: steps.full.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          D=android/app/src/main/java/com/ticic/daily
          if [ -f /tmp/safe_widget/MainActivity.java ]; then cp /tmp/safe_widget/MainActivity.java $D/MainActivity.java; cp /tmp/safe_widget/AndroidManifest.xml android/app/src/main/AndroidManifest.xml; fi
          rm -f $D/TicicVoicePlugin.java
          cd android
          ./gradlew assembleDebug 2>&1 | tee /tmp/build_novoice.log
      - name: Build again without the widget (only runs if the first build failed)
        id: nowidget
        if: steps.novoice.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          D=android/app/src/main/java/com/ticic/daily
          if [ -f /tmp/safe_steps/MainActivity.java ]; then cp /tmp/safe_steps/MainActivity.java $D/MainActivity.java; cp /tmp/safe_steps/AndroidManifest.xml android/app/src/main/AndroidManifest.xml; fi
          rm -f $D/TicicVoicePlugin.java $D/TicicWidget.java $D/TicicWidgetPlugin.java
          cd android
          ./gradlew assembleDebug 2>&1 | tee /tmp/build_nowidget.log
      - name: Build again without the step counter (only runs if the last build failed)
        id: nosteps
        if: steps.nowidget.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          D=android/app/src/main/java/com/ticic/daily
          if [ -f /tmp/safe_call/MainActivity.java ]; then cp /tmp/safe_call/MainActivity.java $D/MainActivity.java; cp /tmp/safe_call/AndroidManifest.xml android/app/src/main/AndroidManifest.xml; fi
          rm -f $D/TicicVoicePlugin.java $D/TicicStepsPlugin.java $D/StepsReceiver.java $D/TicicWidget.java $D/TicicWidgetPlugin.java
          cd android
          ./gradlew assembleDebug 2>&1 | tee /tmp/build_nosteps.log
      - name: Build again without the call screen (only runs if the last build failed)
        id: nocall
        if: steps.nosteps.outcome == 'failure'
        shell: bash
        run: |
          D=android/app/src/main/java/com/ticic/daily
          if [ -f /tmp/safe/MainActivity.java ]; then cp /tmp/safe/MainActivity.java $D/MainActivity.java; cp /tmp/safe/AndroidManifest.xml android/app/src/main/AndroidManifest.xml; fi
          rm -f $D/TicicVoicePlugin.java $D/TicicStepsPlugin.java $D/StepsReceiver.java $D/TicicAlarmPlugin.java $D/AlarmReceiver.java $D/TicicWidget.java $D/TicicWidgetPlugin.java
          cd android
          ./gradlew assembleDebug 2>&1 | tee /tmp/build_nocall.log
      - name: Release notes
        if: always()
        shell: bash
        run: |
          {
            if [ "${{ steps.full.outcome }}" = "success" ]; then
              echo "Build: complete. Includes voice input, shortcuts, home screen widget, step counter and call screen."
            else
              if [ "${{ steps.novoice.outcome }}" = "success" ]; then echo "Build: no voice input or shortcuts in this version."
              elif [ "${{ steps.nowidget.outcome }}" = "success" ]; then echo "Build: no voice, shortcuts or home screen widget in this version."
              elif [ "${{ steps.nosteps.outcome }}" = "success" ]; then echo "Build: no widget and no step counter in this version."
              else echo "Build: basic version (no widget, step counter or call screen)."; fi
              echo
              echo "First errors found:"
              grep -h "error:" /tmp/build_full.log 2>/dev/null | sed 's#.*/com/ticic/daily/##' | sort -u | head -8
              grep -h "error:" /tmp/build_novoice.log 2>/dev/null | sed 's#.*/com/ticic/daily/##' | sort -u | head -4
              grep -h "error:" /tmp/build_nowidget.log 2>/dev/null | sed 's#.*/com/ticic/daily/##' | sort -u | head -4
            fi
          } > /tmp/notes.md
          cat /tmp/notes.md
      - name: Rename APK
