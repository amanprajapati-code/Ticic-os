name: Build Ticic APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Android project
        run: |
          mkdir -p www && cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6 @capacitor/app@6 @capacitor/status-bar@6
          echo '{"appId":"com.ticic.daily","appName":"Ticic","webDir":"www","backgroundColor":"#07050F","android":{"backgroundColor":"#07050F"}}' > capacitor.config.json
          npx cap add android
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = ''.join('<uses-permission android:name="android.permission.%s"%s/>\n' % (n, x) for n, x in [('POST_NOTIFICATIONS', ''), ('USE_EXACT_ALARM', ''), ('SCHEDULE_EXACT_ALARM', ' android:maxSdkVersion="32"'), ('VIBRATE', ''), ('RECEIVE_BOOT_COMPLETED', '')])
          s = s.replace('</manifest>', perms + '</manifest>')
          open(p, 'w').write(s)
          PY
          npx cap sync android
      - name: App icon
        continue-on-error: true
        run: |
          pip install pillow
          python3 - android/app/src/main/res <<'PY'
          import sys,os
          from PIL import Image, ImageDraw, ImageFilter
          S=1024
          def make(size, round_=False, fg_only=False):
              im=Image.new('RGBA',(S,S),(0,0,0,0))
              if not fg_only:
                  bg=Image.new('RGBA',(S,S),(7,5,15,255))
                  for cx,cy,r,c in [(220,200,520,(139,124,255)),(860,300,460,(255,95,168)),(420,950,480,(61,217,255))]:
                      g=Image.new('RGBA',(S,S),(0,0,0,0)); d=ImageDraw.Draw(g); d.ellipse((cx-r//2,cy-r//2,cx+r//2,cy+r//2),fill=c+(170,)); g=g.filter(ImageFilter.GaussianBlur(120)); bg=Image.alpha_composite(bg,g)
                  im=bg
              d=ImageDraw.Draw(im)
              w=70
              d.line([(330,530),(460,660),(710,380)],fill=(255,255,255,255),width=w,joint='curve')
              for p in [(330,530),(460,660),(710,380)]: d.ellipse((p[0]-w//2,p[1]-w//2,p[0]+w//2,p[1]+w//2),fill=(255,255,255,255))
              if round_:
                  m=Image.new('L',(S,S),0); ImageDraw.Draw(m).ellipse((0,0,S,S),fill=255); im.putalpha(m)
              return im.resize((size,size),Image.LANCZOS)
          res=sys.argv[1]
          for k,sz in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              d=os.path.join(res,'mipmap-'+k)
              if not os.path.isdir(d): continue
              make(sz).save(d+'/ic_launcher.png'); make(sz,True).save(d+'/ic_launcher_round.png')
          import shutil
          shutil.rmtree(os.path.join(res,'mipmap-anydpi-v26'),ignore_errors=True)
          print('icons ok')
          PY
      - name: Use the same signing key every time
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TicicOS.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Ticic APK ${{ github.run_number }}
          files: TicicOS.apk
