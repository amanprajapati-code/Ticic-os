name: Build Ticic APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Android project
        run: |
          mkdir -p www && cp index.html www/index.html
          if [ -f config.js ]; then cp config.js www/config.js; fi
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6 @capacitor/app@6 @capacitor/share@6 @capgo/capacitor-native-biometric@6
          echo '{"appId":"com.ticic.daily","appName":"Ticic","webDir":"www","backgroundColor":"#1F6FEB","android":{"backgroundColor":"#1F6FEB","allowMixedContent":false,"webContentsDebuggingEnabled":false}}' > capacitor.config.json
          npx cap add android
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = ''.join('<uses-permission android:name="android.permission.%s"%s/>\n' % (n, x) for n, x in [('POST_NOTIFICATIONS', ''), ('USE_EXACT_ALARM', ''), ('SCHEDULE_EXACT_ALARM', ' android:maxSdkVersion="32"'), ('VIBRATE', ''), ('RECEIVE_BOOT_COMPLETED', ''), ('USE_BIOMETRIC', ''), ('USE_FINGERPRINT', ''), ('ACCESS_COARSE_LOCATION', ''), ('ACCESS_FINE_LOCATION', '')])
          s = s.replace('</manifest>', perms + '</manifest>')
          import re
          for k, v in (('allowBackup', 'false'), ('usesCleartextTraffic', 'false')):
              if re.search(r'android:' + k + '="[^"]*"', s):
                  s = re.sub(r'android:' + k + '="[^"]*"', 'android:' + k + '="' + v + '"', s, 1)
              else:
                  s = s.replace('<application', '<application android:' + k + '="' + v + '"', 1)
          open(p, 'w').write(s)
          PY
          npx cap sync android
      - name: Notification sounds
        run: |
          python3 - <<'PY'
          import wave, struct, math, os, json
          T = json.loads('''[{"id":"chime","name":"Chime","d":4,"p":[[1,1],[2,0.25],[3,0.1]],"n":[[1047,0,0.7],[1319,0.2,0.7],[1568,0.4,1.2]]},{"id":"bell","name":"Bell","d":2.2,"p":[[1,1],[2.76,0.5],[5.4,0.25]],"n":[[880,0,1.8]]},{"id":"marimba","name":"Marimba","d":9,"p":[[1,1],[4,0.2]],"n":[[523,0,0.4],[659,0.18,0.4],[784,0.36,0.4],[1047,0.54,0.6]]},{"id":"pulse","name":"Pulse","d":14,"p":[[1,1],[3,0.2]],"n":[[1000,0,0.14],[1000,0.22,0.14],[1000,0.44,0.14]]},{"id":"rise","name":"Rise","d":6,"p":[[1,1],[2,0.2]],"n":[[440,0,0.25],[554,0.14,0.25],[659,0.28,0.25],[880,0.42,0.8]]},{"id":"soft","name":"Soft","d":2.5,"p":[[1,1],[2,0.15]],"n":[[392,0,0.9],[523,0.35,1.2]]},{"id":"alarm","name":"Alarm","d":3,"p":[[1,1],[2,0.5],[3,0.3]],"n":[[880,0,0.28],[660,0.32,0.28],[880,0.64,0.28],[660,0.96,0.28],[880,1.28,0.28],[660,1.6,0.28]]}]''')
          os.makedirs('android/app/src/main/res/raw', exist_ok=True)
          R = 22050
          for t in T:
              L = max(n[1] + n[2] for n in t['n']) + 0.25
              N = int(L * R)
              buf = []
              for i in range(N):
                  x = i / R
                  v = 0.0
                  for f, st, du in t['n']:
                      u = x - st
                      if u < 0 or u > du + 0.15:
                          continue
                      env = (1 - math.exp(-u * 600)) * math.exp(-u * t['d'])
                      if u > du:
                          env *= max(0.0, 1 - (u - du) / 0.15)
                      for mult, amp in t['p']:
                          v += amp * env * math.sin(6.2831853 * f * mult * x)
                  buf.append(v)
              pk = max(1e-9, max(abs(b) for b in buf))
              w = wave.open('android/app/src/main/res/raw/tone_' + t['id'] + '.wav', 'wb')
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(R)
              w.writeframes(b''.join(struct.pack('<h', int(b / pk * 26000)) for b in buf))
              w.close()
          print('tones ok')
          PY
      - name: Full screen (edge to edge)
        run: |
          cat > android/app/src/main/java/com/ticic/daily/MainActivity.java <<'JAVA'
          package com.ticic.daily;

          import android.graphics.Color;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            int top = 0, bottom = 0, kb = 0;

            class Ins {
              @JavascriptInterface
              public String get() { return top + "," + bottom + "," + kb; }
            }

            void push() {
              final String js = "window.__setInsets&&window.__setInsets(" + top + "," + bottom + "," + kb + ")";
              final WebView w = getBridge().getWebView();
              w.post(() -> w.evaluateJavascript(js, null));
            }

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              getWindow().setStatusBarColor(Color.TRANSPARENT);
              getWindow().setNavigationBarColor(Color.TRANSPARENT);
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              c.setAppearanceLightStatusBars(true);
              c.setAppearanceLightNavigationBars(true);
              getBridge().getWebView().addJavascriptInterface(new Ins(), "TicicInsets");
              ViewCompat.setOnApplyWindowInsetsListener(getWindow().getDecorView(), (v, insets) -> {
                Insets bars = insets.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());
                Insets ime = insets.getInsets(WindowInsetsCompat.Type.ime());
                float d = getResources().getDisplayMetrics().density;
                top = Math.round(bars.top / d);
                bottom = Math.round(bars.bottom / d);
                kb = Math.round(Math.max(0, ime.bottom - bars.bottom) / d);
                push();
                return insets;
              });
            }
          }
          JAVA
      - name: Call-style full screen alerts
        continue-on-error: true
        run: |
          D=android/app/src/main/java/com/ticic/daily
          mkdir -p /tmp/safe
          cp $D/MainActivity.java /tmp/safe/MainActivity.java
          cp android/app/src/main/AndroidManifest.xml /tmp/safe/AndroidManifest.xml
          cat > $D/TicicAlarmPlugin.java <<'JAVA'
          package com.ticic.daily;

          import android.app.Activity;
          import android.app.AlarmManager;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Build;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import org.json.JSONArray;
          import org.json.JSONObject;

          @CapacitorPlugin(name = "TicicAlarm")
          public class TicicAlarmPlugin extends Plugin {
            public static String launch = null;

            static PendingIntent alarmPi(Context c, int id, JSONObject o) {
              Intent i = new Intent(c, AlarmReceiver.class);
              i.setAction("com.ticic.daily.ALARM");
              i.putExtra("ticic_json", o.toString());
              return PendingIntent.getBroadcast(c, id, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
            }

            static void cancelAll(Context c) {
              SharedPreferences sp = c.getSharedPreferences("ticic_alarm", Context.MODE_PRIVATE);
              AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
              try {
                JSONArray old = new JSONArray(sp.getString("items", "[]"));
                for (int k = 0; k < old.length(); k++) {
                  JSONObject o = old.getJSONObject(k);
                  am.cancel(alarmPi(c, o.getInt("id"), o));
                }
              } catch (Exception e) { }
            }

            static void setOne(Context c, JSONObject o) {
              AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
              long at = o.optLong("at", 0);
              if (at <= System.currentTimeMillis()) return;
              PendingIntent pi = alarmPi(c, o.optInt("id"), o);
              boolean exact = true;
              if (Build.VERSION.SDK_INT >= 31) exact = am.canScheduleExactAlarms();
              if (exact) am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, pi);
              else am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, pi);
            }

            static void scheduleAll(Context c, JSONArray items) {
              cancelAll(c);
              JSONArray keep = new JSONArray();
              for (int k = 0; k < items.length() && k < 60; k++) {
                try {
                  JSONObject o = items.getJSONObject(k);
                  setOne(c, o);
                  keep.put(o);
                } catch (Exception e) { }
              }
              c.getSharedPreferences("ticic_alarm", Context.MODE_PRIVATE).edit().putString("items", keep.toString()).apply();
            }

            @PluginMethod
            public void schedule(PluginCall call) {
              JSONArray items = call.getArray("items");
              if (items == null) items = new JSONArray();
              scheduleAll(getContext(), items);
              call.resolve();
            }

            @PluginMethod
            public void test(PluginCall call) {
              try {
                JSONObject o = new JSONObject();
                o.put("id", 7777);
                o.put("at", System.currentTimeMillis() + 6000);
                o.put("title", call.getString("title", "Ticic"));
                o.put("body", call.getString("body", ""));
                o.put("tone", call.getString("tone", "system"));
                o.put("taskId", "");
                o.put("routineId", "");
                setOne(getContext(), o);
              } catch (Exception e) { }
              call.resolve();
            }

            @PluginMethod
            public void stop(PluginCall call) {
              NotificationManager nm = (NotificationManager) getContext().getSystemService(Context.NOTIFICATION_SERVICE);
              Integer id = call.getInt("id");
              if (id != null) nm.cancel(id.intValue()); else nm.cancelAll();
              release(getActivity());
              call.resolve();
            }

            static void release(final Activity a) {
              if (a == null) return;
              a.runOnUiThread(new Runnable() {
                public void run() {
                  if (Build.VERSION.SDK_INT >= 27) a.setShowWhenLocked(false);
                }
              });
            }

            @PluginMethod
            public void pending(PluginCall call) {
              JSObject r = new JSObject();
              if (launch != null) { r.put("launch", launch); launch = null; }
              call.resolve(r);
            }

            @PluginMethod
            public void status(PluginCall call) {
              JSObject r = new JSObject();
              boolean full = true;
              if (Build.VERSION.SDK_INT >= 34) {
                NotificationManager nm = (NotificationManager) getContext().getSystemService(Context.NOTIFICATION_SERVICE);
                full = nm.canUseFullScreenIntent();
              }
              r.put("full", full);
              call.resolve(r);
            }

            @PluginMethod
            public void openFullScreenSettings(PluginCall call) {
              try {
                Intent i = new Intent("android.settings.MANAGE_APP_USE_FULL_SCREEN_INTENT", Uri.parse("package:" + getContext().getPackageName()));
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                getContext().startActivity(i);
              } catch (Exception e) { }
              call.resolve();
            }
          }
          JAVA
          cat > $D/AlarmReceiver.java <<'JAVA'
          package com.ticic.daily;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class AlarmReceiver extends BroadcastReceiver {
            @Override
            public void onReceive(Context c, Intent in) {
              String a = in.getAction();
              if (a == null) return;
              if (a.equals("com.ticic.daily.ALARM")) {
                try { ring(c, new JSONObject(in.getStringExtra("ticic_json"))); } catch (Exception e) { }
              } else if (a.equals(Intent.ACTION_BOOT_COMPLETED) || a.equals(Intent.ACTION_MY_PACKAGE_REPLACED)) {
                try {
                  String s = c.getSharedPreferences("ticic_alarm", Context.MODE_PRIVATE).getString("items", "[]");
                  JSONArray arr = new JSONArray(s);
                  for (int k = 0; k < arr.length(); k++) TicicAlarmPlugin.setOne(c, arr.getJSONObject(k));
                } catch (Exception e) { }
              }
            }

            static PendingIntent open(Context c, int code, JSONObject o, String act) throws Exception {
              JSONObject x = new JSONObject(o.toString());
              if (act != null) x.put("act", act);
              Intent i = new Intent(c, MainActivity.class);
              i.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
              i.putExtra("ticic_alarm", x.toString());
              return PendingIntent.getActivity(c, code, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
            }

            static void ring(Context c, JSONObject o) throws Exception {
              NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
              int id = o.optInt("id");
              String tone = o.optString("tone", "system");
              int res = c.getResources().getIdentifier("tone_" + tone, "raw", c.getPackageName());
              Uri sound = res != 0 ? Uri.parse("android.resource://" + c.getPackageName() + "/" + res) : RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE);
              String ch = "call_" + (res != 0 ? tone : "system");
              if (Build.VERSION.SDK_INT >= 26 && nm.getNotificationChannel(ch) == null) {
                NotificationChannel nc = new NotificationChannel(ch, "Call-style reminders", NotificationManager.IMPORTANCE_HIGH);
                AudioAttributes at = new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE).setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build();
                nc.setSound(sound, at);
                nc.enableVibration(true);
                nc.setVibrationPattern(new long[] { 0, 500, 300, 500, 300, 500 });
                nc.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                nm.createNotificationChannel(nc);
              }
              PendingIntent main = open(c, id, o, null);
              Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(c, ch) : new Notification.Builder(c);
              b.setSmallIcon(android.R.drawable.ic_popup_reminder);
              b.setContentTitle(o.optString("title"));
              b.setContentText(o.optString("body"));
              b.setCategory(Notification.CATEGORY_ALARM);
              b.setVisibility(Notification.VISIBILITY_PUBLIC);
              b.setOngoing(true);
              b.setAutoCancel(false);
              b.setContentIntent(main);
              b.setFullScreenIntent(main, true);
              if (Build.VERSION.SDK_INT >= 26) b.setTimeoutAfter(90000);
              if (Build.VERSION.SDK_INT < 26) {
                b.setPriority(Notification.PRIORITY_MAX);
                b.setSound(sound);
                b.setVibrate(new long[] { 0, 500, 300, 500, 300, 500 });
              }
              if (o.optString("taskId").length() > 0) {
                b.addAction(0, "Done", open(c, id ^ 0x20000000, o, "done"));
                b.addAction(0, "Snooze", open(c, id ^ 0x10000000, o, "snooze"));
              }
              Notification n = b.build();
              n.flags |= Notification.FLAG_INSISTENT;
              nm.notify(id, n);
            }
          }
          JAVA
          cat > $D/MainActivity.java <<'JAVA'
          package com.ticic.daily;

          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
