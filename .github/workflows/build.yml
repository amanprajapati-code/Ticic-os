          package com.ticic.daily;

          import android.app.Activity;
          import android.content.Intent;
          import android.speech.RecognizerIntent;
          import androidx.activity.result.ActivityResult;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.util.ArrayList;

          @CapacitorPlugin(name = "TicicVoice")
          public class TicicVoicePlugin extends Plugin {
            @PluginMethod
            public void listen(PluginCall call) {
              Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
              i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
              i.putExtra(RecognizerIntent.EXTRA_PROMPT, "Say your task");
              try {
                startActivityForResult(call, i, "voiceDone");
              } catch (Exception e) {
                call.reject("Voice is not available");
              }
            }

            @ActivityCallback
            private void voiceDone(PluginCall call, ActivityResult result) {
              if (call == null) return;
              JSObject o = new JSObject();
              if (result.getResultCode() == Activity.RESULT_OK && result.getData() != null) {
                ArrayList<String> a = result.getData().getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS);
                if (a != null && a.size() > 0) o.put("text", a.get(0));
              }
              call.resolve(o);
            }
          }
