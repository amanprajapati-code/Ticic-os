              final WebView w = getBridge().getWebView();
              w.postDelayed(() -> {
                String q = j.replace("\\", "\\\\").replace("'", "\\'");
                w.evaluateJavascript("window.__ticicAlarm&&window.__ticicAlarm('" + q + "')", null);
              }, 400);
            }

            @Override
            protected void onNewIntent(Intent intent) {
              super.onNewIntent(intent);
              alarmIntent(intent);
            }

            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(TicicAlarmPlugin.class);
              super.onCreate(savedInstanceState);
              WindowCompat.setDecorFitsSystemWindows(getWindow(), f
