          package com.ticic.daily;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class StepsReceiver extends BroadcastReceiver {
            @Override
            public void onReceive(Context c, Intent in) {
              String a = in.getAction();
              if (a == null) return;
              if (a.equals(Intent.ACTION_BOOT_COMPLETED) || a.equals(Intent.ACTION_MY_PACKAGE_REPLACED)) {
                if (TicicStepsPlugin.granted(c)) TicicStepsPlugin.schedule(c);
              }
              final PendingResult pr = goAsync();
              TicicStepsPlugin.snap(c, new Runnable() {
                public void run() { pr.finish(); }
              });
            }
          }
