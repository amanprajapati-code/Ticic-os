<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Ticic OS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Ticic OS design system. Layout: sidebar + glass cards on a warm glow backdrop; rail on tablet, bottom nav on phone. */
:root{
  --bg:#F6F1E9;
  --glow-a:rgba(255,170,60,.42);--glow-b:rgba(255,110,120,.2);--glow-c:rgba(130,140,255,.22);
  --ink:#17150F;--ink-2:#4A463E;--muted:#6B665C;
  --line:rgba(23,21,15,.1);--line-soft:rgba(23,21,15,.06);
  --glass:rgba(255,255,255,.62);--glass-2:rgba(255,255,255,.86);--edge:rgba(255,255,255,.85);--input:rgba(255,255,255,.72);
  --fill:rgba(23,21,15,.055);--fill-2:rgba(23,21,15,.1);
  --accent:#F29A1F;--accent-ink:#17150F;--accent-tint:rgba(255,226,170,.6);--accent-text:#8A4B00;--accent-glow:rgba(232,137,12,.42);
  --danger:#B42318;--danger-tint:rgba(253,236,234,.9);--ok:#1F7A4D;--ok-tint:rgba(228,245,236,.9);
  --shadow:0 10px 34px rgba(150,95,20,.09),0 1px 2px rgba(23,21,15,.04);
  --hl:inset 0 1px 0 rgba(255,255,255,.9);
  --overlay:rgba(40,28,10,.3);
  --chart:#3D3A33;--chart-soft:rgba(23,21,15,.12);
  --sc-blue-bg:#E7ECF5;--sc-blue-fg:#243B66;--sc-blue-dot:#5B7BC2;
  --sc-green-bg:#E4EFE7;--sc-green-fg:#1F5A3A;--sc-green-dot:#3E9B6A;
  --sc-amber-bg:#FFF0D6;--sc-amber-fg:#6E3B00;--sc-amber-dot:#E8890C;
  --sc-rose-bg:#F6E7E4;--sc-rose-fg:#7A3228;--sc-rose-dot:#D2655A;
  --sc-stone-bg:#EFEBE3;--sc-stone-fg:#4A4233;--sc-stone-dot:#8C8576;
  --sc-violet-bg:#ECE8F7;--sc-violet-fg:#43357A;--sc-violet-dot:#7C69C9;
  --sc-teal-bg:#DFF1F0;--sc-teal-fg:#14585A;--sc-teal-dot:#2E9E9F;
  --font:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14110C;--glow-a:rgba(255,150,40,.17);--glow-b:rgba(255,90,110,.1);--glow-c:rgba(110,120,255,.15);
    --ink:#F6F2EA;--ink-2:#D4CDBF;--muted:#A9A193;
    --line:rgba(255,255,255,.12);--line-soft:rgba(255,255,255,.07);
    --glass:rgba(255,255,255,.065);--glass-2:rgba(38,32,24,.9);--edge:rgba(255,255,255,.12);--input:rgba(255,255,255,.07);
    --fill:rgba(255,255,255,.07);--fill-2:rgba(255,255,255,.12);
    --accent-tint:rgba(242,154,31,.17);--accent-text:#FFC46B;--accent-glow:rgba(242,154,31,.4);
    --danger:#FF9082;--danger-tint:rgba(255,120,100,.14);--ok:#63D69A;--ok-tint:rgba(80,200,140,.14);
    --shadow:0 10px 34px rgba(0,0,0,.35);--hl:inset 0 1px 0 rgba(255,255,255,.08);--overlay:rgba(0,0,0,.55);
    --chart:#E8E2D6;--chart-soft:rgba(255,255,255,.14);
    --sc-blue-bg:rgba(91,123,194,.22);--sc-blue-fg:#B9CBF2;
    --sc-green-bg:rgba(62,155,106,.22);--sc-green-fg:#A5E0BF;
    --sc-amber-bg:rgba(232,137,12,.22);--sc-amber-fg:#FFD08A;
    --sc-rose-bg:rgba(210,101,90,.22);--sc-rose-fg:#F6BDB6;
    --sc-stone-bg:rgba(140,133,118,.24);--sc-stone-fg:#DDD6C8;
    --sc-violet-bg:rgba(124,105,201,.24);--sc-violet-fg:#CFC5F5;
    --sc-teal-bg:rgba(46,158,159,.22);--sc-teal-fg:#A6E3E3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14110C;--glow-a:rgba(255,150,40,.17);--glow-b:rgba(255,90,110,.1);--glow-c:rgba(110,120,255,.15);
  --ink:#F6F2EA;--ink-2:#D4CDBF;--muted:#A9A193;
  --line:rgba(255,255,255,.12);--line-soft:rgba(255,255,255,.07);
  --glass:rgba(255,255,255,.065);--glass-2:rgba(38,32,24,.9);--edge:rgba(255,255,255,.12);--input:rgba(255,255,255,.07);
  --fill:rgba(255,255,255,.07);--fill-2:rgba(255,255,255,.12);
  --accent-tint:rgba(242,154,31,.17);--accent-text:#FFC46B;--accent-glow:rgba(242,154,31,.4);
  --danger:#FF9082;--danger-tint:rgba(255,120,100,.14);--ok:#63D69A;--ok-tint:rgba(80,200,140,.14);
  --shadow:0 10px 34px rgba(0,0,0,.35);--hl:inset 0 1px 0 rgba(255,255,255,.08);--overlay:rgba(0,0,0,.55);
  --chart:#E8E2D6;--chart-soft:rgba(255,255,255,.14);
  --sc-blue-bg:rgba(91,123,194,.22);--sc-blue-fg:#B9CBF2;
  --sc-green-bg:rgba(62,155,106,.22);--sc-green-fg:#A5E0BF;
  --sc-amber-bg:rgba(232,137,12,.22);--sc-amber-fg:#FFD08A;
  --sc-rose-bg:rgba(210,101,90,.22);--sc-rose-fg:#F6BDB6;
  --sc-stone-bg:rgba(140,133,118,.24);--sc-stone-fg:#DDD6C8;
  --sc-violet-bg:rgba(124,105,201,.24);--sc-violet-fg:#CFC5F5;
  --sc-teal-bg:rgba(46,158,159,.22);--sc-teal-fg:#A6E3E3;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:14px;line-height:1.45;color:var(--ink);background-color:var(--bg);
  background-image:radial-gradient(900px 520px at 6% -6%,var(--glow-a),transparent 62%),radial-gradient(800px 560px at 100% 6%,var(--glow-b),transparent 62%),radial-gradient(900px 700px at 55% 105%,var(--glow-c),transparent 62%);
  background-attachment:fixed;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}.danger-t{color:var(--danger)}.accent-t{color:var(--accent-text)}.ok-t{color:var(--ok)}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sc-blue{--sc-bg:var(--sc-blue-bg);--sc-fg:var(--sc-blue-fg);--sc-dot:var(--sc-blue-dot)}
.sc-green{--sc-bg:var(--sc-green-bg);--sc-fg:var(--sc-green-fg);--sc-dot:var(--sc-green-dot)}
.sc-amber{--sc-bg:var(--sc-amber-bg);--sc-fg:var(--sc-amber-fg);--sc-dot:var(--sc-amber-dot)}
.sc-rose{--sc-bg:var(--sc-rose-bg);--sc-fg:var(--sc-rose-fg);--sc-dot:var(--sc-rose-dot)}
.sc-stone{--sc-bg:var(--sc-stone-bg);--sc-fg:var(--sc-stone-fg);--sc-dot:var(--sc-stone-dot)}
.sc-violet{--sc-bg:var(--sc-violet-bg);--sc-fg:var(--sc-violet-fg);--sc-dot:var(--sc-violet-dot)}
.sc-teal{--sc-bg:var(--sc-teal-bg);--sc-fg:var(--sc-teal-fg);--sc-dot:var(--sc-teal-dot)}

/* shell */
.app{display:flex;min-height:100vh}
.side{flex:0 0 248px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:flex-start;display:flex;flex-direction:column;gap:2px;padding:22px 14px 16px;
  background:var(--glass);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-right:1px solid var(--edge);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--accent-ink);box-shadow:0 6px 18px var(--accent-glow);flex:none}
.nav{display:flex;align-items:center;gap:12px;padding:0 12px;min-height:40px;border-radius:12px;color:var(--ink-2);text-decoration:none;font-size:14px;font-weight:500;border:0;background:none;width:100%;text-align:left}
.nav:hover{background:var(--fill)}
.nav.on{background:var(--glass-2);color:var(--ink);font-weight:600;box-shadow:var(--hl),0 0 0 1px var(--edge),0 6px 18px rgba(232,137,12,.18)}
.nav.on .ic{color:var(--accent)}
.nav .badge{margin-left:auto}
.nav-sec{padding:18px 12px 6px}
.side-foot{margin-top:auto;padding-top:10px;display:flex;flex-direction:column;gap:2px}
.me{display:flex;align-items:center;gap:10px;padding:12px 10px 0;margin-top:8px;border-top:1px solid var(--line-soft)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:none}
.main{flex:1 1 0;min-width:0;padding:30px 36px 56px;max-width:1280px;margin-inline:auto;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 20px;margin-bottom:22px}
.head h1{font-size:32px;line-height:1.15;font-weight:600;letter-spacing:-.025em;text-wrap:balance}
.head .sub{margin-top:6px;font-size:15px;color:var(--muted)}
.head-acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.view{animation:fadein .18s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.bottomnav{display:none}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;margin-bottom:16px;border-radius:14px;background:var(--accent-tint);border:1px solid var(--edge);font-size:13px;color:var(--accent-text);font-weight:500}

/* components */
.card{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--edge);border-radius:20px;box-shadow:var(--hl),var(--shadow)}
.card.pad{--pad:22px;padding:var(--pad)}
.card.hot{background:var(--accent-tint);box-shadow:var(--hl),0 16px 48px var(--accent-glow)}
.card.warn{border-color:var(--danger)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-h h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
.link{border:0;background:none;padding:4px 0;font-size:13px;font-weight:600;color:var(--accent-text);text-decoration:none}
.link:hover{text-decoration:underline}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:12px;font-size:14px;font-weight:600;text-decoration:none;border:1px solid var(--edge);background:var(--glass);color:var(--ink);box-shadow:var(--hl),0 4px 14px rgba(150,95,20,.08);white-space:nowrap;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.btn:hover{background:var(--glass-2)}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:rgba(255,255,255,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 8px 24px var(--accent-glow)}
.btn.accent:hover{filter:brightness(.96)}
.btn.ink{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:none}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:32px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.icon{width:40px;padding:0}.btn.icon.sm{width:32px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;background:var(--fill);color:var(--ink-2);font-size:12px;font-weight:500;white-space:nowrap}
.chip.sc{background:var(--sc-bg);color:var(--sc-fg)}
.chip.accent{background:var(--accent-tint);color:var(--accent-text)}
.chip.ok{background:var(--ok-tint);color:var(--ok)}
.chip.bad{background:var(--danger-tint);color:var(--danger)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sc-dot,var(--muted));flex:none;display:inline-block}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent-tint);color:var(--accent-text);font-size:11px;font-weight:700}
.badge.bad{background:var(--danger-tint);color:var(--danger)}
.pri{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;white-space:nowrap}
.pri i{width:7px;height:7px;border-radius:50%;display:block}
.pri.urgent{color:var(--danger)}.pri.urgent i{background:var(--danger)}
.pri.high{color:var(--accent-text)}.pri.high i{background:var(--accent)}
.pri.medium{color:var(--ink-2)}.pri.medium i{background:var(--ink-2)}
.pri.low{color:var(--muted)}.pri.low i{background:var(--muted);opacity:.6}
.chk{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--muted);background:var(--input);flex:none;display:inline-flex;align-items:center;justify-content:center;padding:0;color:transparent}
.chk:hover{border-color:var(--accent)}
.chk.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chk .ic{width:14px;height:14px;stroke-width:3}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.tab{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border-radius:12px;font-size:14px;font-weight:500;color:var(--ink-2);border:0;background:none;text-decoration:none}
.tab:hover{background:var(--fill)}
.tab.on{background:var(--ink);color:var(--bg);font-weight:600}
.tab .n{font-family:var(--mono);font-size:12px;opacity:.7}
.tab .n.bad{color:var(--danger);opacity:1}
.tab.on .n.bad{color:inherit}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--fill);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;min-height:32px;border-radius:9px;font-size:13px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--glass-2);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(23,21,15,.12)}
.bar{height:6px;border-radius:99px;background:var(--fill-2);position:relative}
.bar>i{display:block;height:6px;border-radius:99px;background:var(--chart)}
.bar>i.accent{background:var(--accent)}.bar>i.bad{background:var(--danger)}.bar>i.ok{background:var(--ok)}
.bar>b{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink);border-radius:2px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:36px 20px;color:var(--muted)}
.empty h3{font-size:16px;font-weight:600;color:var(--ink)}
.empty p{font-size:14px;max-width:340px}
.empty .btn{margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:12px;margin-bottom:22px}
.stat{padding:16px 18px;border-radius:20px;text-align:left;border:1px solid var(--edge);background:var(--glass);box-shadow:var(--hl),var(--shadow);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:block;color:inherit;text-decoration:none}
button.stat{width:100%}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-family:var(--mono);font-size:30px;font-weight:500;letter-spacing:-.02em;margin-top:6px;line-height:1.1}
.stat .v.t{font-family:var(--font);font-size:18px;font-weight:600;letter-spacing:-.01em;margin-top:10px;line-height:1.25}
.stat .s{font-size:12px;color:var(--muted);margin-top:3px}
.stat.hot{background:var(--accent-tint);box-shadow:var(--hl),0 10px 30px var(--accent-glow)}
.stat.hot .k,.stat.hot .s{color:var(--accent-text)}
.cols{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.cols>.cm{flex:1.6 1 520px;min-width:0;display:flex;flex-direction:column;gap:24px}
.cols>.cs{flex:1 1 330px;min-width:0;display:flex;flex-direction:column;gap:24px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.hscroll{overflow-x:auto}

/* lists */
.grp{display:flex;align-items:center;gap:8px;padding:12px 20px 8px;border-top:1px solid var(--line-soft)}
.grp:first-child{border-top:0}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;padding:12px 20px;border-top:1px solid var(--line-soft);position:relative}
.row:hover{background:var(--fill)}
.row.done .tt{text-decoration:line-through;color:var(--muted)}
.tt{flex:1 1 200px;min-width:0;font-size:14.5px;font-weight:500;background:none;border:0;padding:0;text-align:left;color:inherit;overflow-wrap:anywhere}
.tt:hover{text-decoration:underline}
.rowmeta{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-left:auto}
.when{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:76px;text-align:right}
.when.bad{color:var(--danger)}.when.accent{color:var(--accent-text)}
.addbar{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border-radius:14px;background:var(--input);border:1px solid var(--edge);box-shadow:inset 0 1px 2px rgba(150,95,20,.08)}
.addbar input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:14px;min-height:44px}
.addbar:focus-within{box-shadow:0 0 0 3px var(--accent-tint),inset 0 1px 2px rgba(150,95,20,.08);border-color:var(--accent)}
.parsed{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-height:24px}
.rowline{display:flex;gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--line-soft)}
.rowline:first-child{border-top:0}
.ico{width:36px;height:36px;border-radius:11px;background:var(--fill);color:var(--ink-2);display:flex;align-items:center;justify-content:center;flex:none}
.ico.accent{background:var(--accent-tint);color:var(--accent-text)}
.ico.sc{background:var(--sc-bg);color:var(--sc-fg)}

/* schedule timeline */
.tl{display:flex;flex-direction:column}
.tl-r{display:flex;gap:14px;min-height:48px}
.tl-t{width:66px;white-space:nowrap;flex:none;font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:4px}
.tl-b{flex:1;min-width:0;padding:2px 0 10px}
.tl-c{padding:9px 12px;border-radius:13px;background:var(--sc-bg,var(--fill));color:var(--sc-fg,var(--ink))}
.tl-c b{display:block;font-size:14px;font-weight:600}.tl-c span{font-size:12px;opacity:.85}
.tl-c.now{box-shadow:0 0 0 2px var(--accent)}
.tl-c.past{opacity:.55}
.tl-free{padding:8px 12px;border:1px dashed var(--line);border-radius:12px;font-size:13px;color:var(--muted)}
.nowline{display:flex;align-items:center;gap:8px;margin:2px 0 8px}
.nowline i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.nowline u{flex:1;height:1px;background:var(--accent)}

/* timetable grid */
.ttw{overflow-x:auto}
.tt-grid{display:grid;grid-template-columns:56px repeat(var(--days),minmax(104px,1fr));min-width:700px}
.tt-dh{padding:12px 0 12px 10px;font-size:13px;font-weight:600;color:var(--ink-2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.tt-dh.today{color:var(--ink)}
.tt-col{position:relative;border-left:1px solid var(--line-soft);height:var(--h);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hh) - 1px),var(--line-soft) calc(var(--hh) - 1px),var(--line-soft) var(--hh))}
.tt-col.today{background-color:var(--accent-tint)}
.tt-hrs{position:relative;height:var(--h)}
.tt-hrs span{position:absolute;right:10px;font-family:var(--mono);font-size:11px;color:var(--muted);transform:translateY(-50%)}

/* ---------- natural-language quick add ---------- */
const WD = {sun:0,mon:1,tue:2,tues:2,wed:3,thu:4,thur:4,thurs:4,fri:5,sat:6};
const MO = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};
T.CATS = ['College','Study','Personal','Project','Coding','Health','Other'];
T.PRIS = [['low','Low'],['medium','Medium'],['high','High'],['urgent','Urgent']];

T.parseQuick = function(text){
  let s = ' ' + (text||'').replace(/\s+/g,' ').trim() + ' ';
  const out = {title:'',due:null,time:'',priority:null,category:null,tags:[],recur:'none'};
  const today = D.today(), tdow = D.dow(today);
  s = s.replace(/\s#([\w-]+)/g, (m,t)=>{ out.tags.push(t.toLowerCase()); return ' '; });
  s = s.replace(/\s!(urgent|high|medium|med|low)\b/ig, (m,p)=>{ p = p.toLowerCase(); out.priority = p==='med'?'medium':p; return ' '; });
  s = s.replace(/\s(urgent|high|medium|low)\s+priority\b/ig, (m,p)=>{ out.priority = p.toLowerCase(); return ' '; });
  s = s.replace(/\sp([1-4])\b/ig, (m,n)=>{ out.priority = ['urgent','high','medium','low'][n-1]; return ' '; });
  // recurrence
  s = s.replace(/\s(?:every\s+day|daily|everyday)\b/i, ()=>{ out.recur='daily'; return ' '; });
  s = s.replace(/\severy\s+(sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)[a-z]*\b/i, (m,w)=>{ out.recur='weekly'; let n=(WD[w.toLowerCase()]-tdow+7)%7; out.due = D.add(today,n); return ' '; });
  s = s.replace(/\s(?:weekly|every\s+week)\b/i, ()=>{ out.recur='weekly'; return ' '; });
  s = s.replace(/\s(?:monthly|every\s+month)\b/i, ()=>{ out.recur='monthly'; return ' '; });
  // time
  let m;
  const setT = (h,mi,ap) => {
    h = +h; mi = +(mi||0);
    if(ap){ ap = ap.toLowerCase(); if(ap==='pm' && h<12) h+=12; if(ap==='am' && h===12) h=0; }
    else if(h<=6) h+=12; else if(h===12) h=12;
    if(h>23||mi>59) return false;
    out.time = D.hhmm(h*60+mi); return true;
  };
  if((m = s.match(/\s(?:at|@)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?(?=\s)/i)) && setT(m[1],m[2],m[3])) s = s.replace(m[0],' ');
  else if((m = s.match(/\s(\d{1,2})(?::(\d{2}))?\s*(am|pm)(?=\s)/i)) && setT(m[1],m[2],m[3])) s = s.replace(m[0],' ');
  else if((m = s.match(/\s([01]?\d|2[0-3]):([0-5]\d)(?=\s)/)) && setT(m[1],m[2],'')) s = s.replace(m[0],' ');
  else if((m = s.match(/\s(noon)(?=\s)/i))){ out.time='12:00'; s = s.replace(m[0],' '); }
  // date
  const setD = (re,fn) => { const mm = s.match(re); if(mm){ const v = fn(mm); if(v){ out.due = v; s = s.replace(mm[0],' '); return true; } } return false; };
  setD(/\s(?:by\s+|on\s+)?(?:day\s+after\s+tomorrow)(?=\s)/i, ()=>D.add(today,2))
  || setD(/\s(?:by\s+|on\s+)?(tonight|today)(?=\s)/i, (mm)=>{ if(/tonight/i.test(mm[1]) && !out.time) out.time='20:00'; return today; })
  || setD(/\s(?:by\s+|on\s+)?(tomorrow|tmrw|tmr)(?=\s)/i, ()=>D.add(today,1))
  || setD(/\sin\s+(\d{1,2})\s*(day|days|d|week|weeks|w)(?=\s)/i, (mm)=>D.add(today, +mm[1]*(/^w/i.test(mm[2])?7:1)))
  || setD(/\s(?:by\s+|on\s+)?next\s+week(?=\s)/i, ()=>D.add(today,7))
  || setD(/\s(?:by\s+|on\s+|next\s+|this\s+)?(sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)(?:day|sday|nesday|rsday|urday)?(?=\s)/i, (mm)=>{ let n=(WD[mm[1].toLowerCase()]-tdow+7)%7; if(n===0) n=7; return D.add(today,n); })
  || setD(/\s(?:by\s+|on\s+)?(\d{1,2})(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sept|sep|oct|nov|dec)[a-z]*(?=\s)/i, (mm)=>mkDate(+mm[1],MO[mm[2].toLowerCase()]))
  || setD(/\s(?:by\s+|on\s+)?(jan|feb|mar|apr|may|jun|jul|aug|sept|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})(?:st|nd|rd|th)?(?=\s)/i, (mm)=>mkDate(+mm[2],MO[mm[1].toLowerCase()]));
  function mkDate(day,mon){
    if(day<1||day>31) return null;
    let y = new Date().getFullYear(); let d = new Date(y,mon,day);
    if(d.getMonth()!==mon) return null;
    if(D.fmt(d) < today){ d = new Date(y+1,mon,day); }
    return D.fmt(d);
  }
  // category guess
  const low = s.toLowerCase();
  if(/\b(assignment|lab|record|viva|submit|college|seminar|attendance|exam)\b/.test(low)) out.category='College';
  else if(/\b(revise|revision|study|read|chapter|problem set|notes|practice test|syllabus)\b/.test(low)) out.category='Study';
  else if(/\b(code|coding|leetcode|python|java|debug|git|github|programming)\b/.test(low)) out.category='Coding';
  else if(/\b(gym|run|workout|walk|doctor|yoga|exercise|water|sleep|meditat\w*)\b/.test(low)) out.category='Health';
  else if(/\b(project|prototype|portfolio)\b/.test(low)) out.category='Project';
  else if(/\b(buy|call|pay|laundry|mom|dad|book|order|return)\b/.test(low)) out.category='Personal';
  let title = s.replace(/\s+/g,' ').trim().replace(/\s+(by|on|at|for|in|from|to|due)$/i,'').replace(/^(by|on|at)\s+/i,'').trim();
  out.title = title.charAt(0).toUpperCase()+title.slice(1);
  return out;
};
})();

/* store.js: data, persistence, demo seed, queries (Q) and notification engine */
(function(){
const T = window.T, D = T.D, uid = T.uid;
const KEY = 'ticic-os:v1';
const COLS = ['subjects','timetables','classes','tasks','reminders','events','attendance','assignments','exams','notes','habits','goals','notifications','notifSeen','studyLog'];
const PFX = {subjects:'s',timetables:'tt',classes:'c',tasks:'t',reminders:'r',events:'e',attendance:'a',assignments:'as',exams:'ex',notes:'n',habits:'h',goals:'g',notifications:'nt',studyLog:'sl'};

const DEFAULT_SETTINGS = () => ({
  name:'Aman', college:'', course:'B.Tech', semester:'3', workDays:[1,2,3,4,5,6], studyTarget:4, attTarget:75,
  weekStart:1, time24:false, theme:'light', activeTT:null, onboarded:false, demo:false,
  dayStart:'08:00', dayEnd:'21:00', lunch:'12:00',
  notify:{classes:true,deadlines:true,attendance:true,overdue:true,browser:false},
  defaults:{priority:'medium',category:'College',reminder:'none'}
});
const blank = () => { const d = {v:1, settings:DEFAULT_SETTINGS(), plans:{}}; COLS.forEach(c=>d[c]=[]); return d; };

const S = T.S = {
  d:null, subs:[], storageOk:true, loadError:false,
  probe(){ try{ localStorage.setItem(KEY+':probe','1'); localStorage.removeItem(KEY+':probe'); return true; }catch(e){ return false; } },
  normalize(raw){
    const b = blank(); const d = Object.assign(b, raw);
    d.settings = Object.assign(DEFAULT_SETTINGS(), raw.settings||{});
    d.settings.notify = Object.assign(DEFAULT_SETTINGS().notify, (raw.settings||{}).notify||{});
    d.settings.defaults = Object.assign(DEFAULT_SETTINGS().defaults, (raw.settings||{}).defaults||{});
    COLS.forEach(c=>{ if(!Array.isArray(d[c])) d[c]=[]; });
    if(!d.plans || typeof d.plans!=='object') d.plans = {};
    return d;
  },
  load(){
    this.storageOk = this.probe();
    let raw = null;
    if(this.storageOk){
      try{ const s = localStorage.getItem(KEY); if(s) raw = JSON.parse(s); }catch(e){ this.loadError = true; raw = null; }
    }
    this.d = raw && raw.settings ? this.normalize(raw) : blank();
    this.applyPrefs();
  },
  save(){
    if(!this.storageOk) return;
    try{ localStorage.setItem(KEY, JSON.stringify(this.d)); }
    catch(e){ this.storageOk = false; T.UI && T.UI.toast && T.UI.toast('Browser storage is full or blocked. Changes will not be saved.'); }
  },
  on(fn){ this.subs.push(fn); },
  emit(){ this.save(); this.subs.forEach(f=>{ try{ f(); }catch(e){ console.error(e); } }); },
  applyPrefs(){
    const s = this.d.settings; T.fmt24 = !!s.time24;
    const root = document.documentElement;
    if(s.theme==='system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', s.theme==='dark'?'dark':'light');
  },
  get(c,id){ return this.d[c].find(x=>x.id===id) || null; },
  add(c,o,silent){ o = Object.assign({}, o); if(!o.id) o.id = uid(PFX[c]||'x'); if(!o.created) o.created = D.isoNow(); this.d[c].push(o); if(!silent) this.emit(); return o; },
  upd(c,id,patch,silent){ const o = this.get(c,id); if(!o) return null; Object.assign(o,patch); if(!silent) this.emit(); return o; },
  del(c,id){ const i = this.d[c].findIndex(x=>x.id===id); if(i<0) return null; const item = this.d[c].splice(i,1)[0]; this.emit(); return {c,item,i}; },
  restore(rec){ if(!rec) return; this.d[rec.c].splice(Math.min(rec.i,this.d[rec.c].length),0,rec.item); this.emit(); },
  setting(patch){ Object.assign(this.d.settings, patch); this.applyPrefs(); this.emit(); },

  /* tasks */
  nextDue(t){
    const today = D.today(); let base = t.due && t.due>today ? t.due : today;
    if(t.recur==='daily') return D.add(t.due && t.due>=today ? t.due : today, 1);
    if(t.recur==='weekly'){ let n = t.due || today; while(n<=today) n = D.add(n,7); return n; }
    if(t.recur==='monthly'){ const d = D.parse(t.due||today); d.setMonth(d.getMonth()+1); return D.fmt(d); }
    return base;
  },
  toggleTask(id){
    const t = this.get('tasks',id); if(!t) return null;
    if(!t.done){
      t.done = true; t.doneAt = D.isoNow();
      if(t.recur && t.recur!=='none'){
        const nx = this.add('tasks', Object.assign({}, t, {id:null, done:false, doneAt:null, spawned:null, created:null, due:this.nextDue(t), subtasks:(t.subtasks||[]).map(s=>Object.assign({},s,{id:uid('st'),done:false}))}), true);
        t.spawned = nx.id;
      }
    } else {
      t.done = false; t.doneAt = null;
      if(t.spawned){ const sp = this.get('tasks',t.spawned); if(sp && !sp.done){ this.d.tasks = this.d.tasks.filter(x=>x.id!==sp.id); } t.spawned = null; }
    }
    this.emit(); return t;
  },
  delSubject(id){
    const d = this.d; const clsIds = d.classes.filter(c=>c.subjectId===id).map(c=>c.id);
    d.classes = d.classes.filter(c=>c.subjectId!==id);
    d.attendance = d.attendance.filter(a=>a.subjectId!==id);
    d.exams = d.exams.filter(e=>e.subjectId!==id);

    d.notes.forEach(n=>{ if(n.subjectId===id) n.subjectId = ''; });
    d.subjects = d.subjects.filter(s=>s.id!==id);

  },
  clearData(keepProfile){
    const s = this.d.settings; this.d = blank();
    if(keepProfile) this.d.settings = s;
    this.d.settings.demo = false; this.applyPrefs();
    const tt = this.add('timetables',{id:'tt_main',name:'Semester '+(this.d.settings.semester||'1')},true);
    this.d.settings.activeTT = tt.id;
    this.emit();
  },
  exportJSON(){ return JSON.stringify({app:'ticic-os',version:1,exportedAt:new Date().toISOString(),data:this.d},null,2); },
  importJSON(text){
    let o; try{ o = JSON.parse(text); }catch(e){ throw new Error('That file is not valid JSON.'); }
    if(!o || o.app!=='ticic-os' || !o.data || !o.data.settings) throw new Error('This does not look like a Ticic OS export.');
    this.d = this.normalize(o.data); this.applyPrefs(); this.emit();
  }
};

/* ---------- queries ---------- */
const PR = {urgent:0,high:1,medium:2,low:3};
const Q = T.Q = {
  st(){ return S.d.settings; },
  subject(id){ return S.get('subjects',id); },
  subjects(){ return S.d.subjects.slice().sort((a,b)=>a.name.localeCompare(b.name)); },
  subjName(id,short){ const s = S.get('subjects',id); return s ? (short&&s.short?s.short:s.name) : ''; },
  subjColor(id){ const s = S.get('subjects',id); return s ? s.color : 'stone'; },
  priRank(p){ return PR[p]==null?2:PR[p]; },
  tt(){ return S.get('timetables',S.d.settings.activeTT) || S.d.timetables[0] || null; },
  classes(ttId){ const id = ttId || (Q.tt()&&Q.tt().id); return S.d.classes.filter(c=>c.ttId===id); },
  classesOn(dow){ return Q.classes().filter(c=>c.day===dow).sort((a,b)=>a.start.localeCompare(b.start)); },
  classColor(c){ return c.color || Q.subjColor(c.subjectId); },
  classTitle(c){ return Q.subjName(c.subjectId,true) || 'Class'; },
  todayClasses(){ return Q.classesOn(D.dow(D.today())); },
  nextClass(){
    const now = D.nowMin(), today = D.today();
    for(let i=0;i<8;i++){
      const date = D.add(today,i), list = Q.classesOn(D.dow(date));
      for(const c of list){
        const st = D.mins(c.start), en = D.mins(c.end);
        if(i===0 && en<=now) continue;
        const ongoing = i===0 && st<=now && now<en;
        return {cls:c,date,ongoing,minsUntil:i*1440+st-now,minsLeft:ongoing?en-now:null,progress:ongoing?(now-st)/(en-st):0};
      }
    }
    return null;
  },
  /* tasks */
  isOverdue(t){ if(t.done||!t.due) return false; const today = D.today(); return t.due<today || (t.due===today && !!t.time && t.time<D.nowHHMM()); },
  open(){ return S.d.tasks.filter(t=>!t.done); },
  overdue(){ return Q.open().filter(Q.isOverdue); },
  inbox(){ return Q.open().filter(t=>!t.due); },
  todayTasks(){ const today = D.today(); return Q.open().filter(t=>t.due===today && !Q.isOverdue(t)); },
  upcomingTasks(){ const today = D.today(); return Q.open().filter(t=>t.due && t.due>today); },
  completed(){ return S.d.tasks.filter(t=>t.done).sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||'')); },
  doneOn(date){ return S.d.tasks.filter(t=>t.done && (t.doneAt||'').slice(0,10)===date); },
  taskSort(list,by){
    const l = list.slice();
    const dk = t => t.due ? t.due+(t.time||'23:59') : '9999';
    if(by==='priority') l.sort((a,b)=>Q.priRank(a.priority)-Q.priRank(b.priority) || dk(a).localeCompare(dk(b)));
    else if(by==='created') l.sort((a,b)=>(b.created||'').localeCompare(a.created||''));
    else if(by==='category') l.sort((a,b)=>a.category.localeCompare(b.category) || dk(a).localeCompare(dk(b)));
    else l.sort((a,b)=>dk(a).localeCompare(dk(b)) || Q.priRank(a.priority)-Q.priRank(b.priority));
    return l;
  },
  streak(){
    const today = D.today(); let d = Q.doneOn(today).length ? today : D.add(today,-1), n = 0;
    while(Q.doneOn(d).length){ n++; d = D.add(d,-1); if(n>400) break; }
    return n;
  },
  weekRange(){ const s = D.weekStart(D.today(), S.d.settings.weekStart); return [s, D.add(s,6)]; },
  weeklyRate(){
    const r = Q.weekRange(); const done = S.d.tasks.filter(t=>t.done && t.doneAt && t.doneAt.slice(0,10)>=r[0] && t.doneAt.slice(0,10)<=r[1]).length;
    const pend = Q.open().filter(t=>t.due && t.due>=r[0] && t.due<=r[1]).length;
    return {done,pend,rate:(done+pend)?Math.round(done/(done+pend)*100):null};
  },
  studyMin(date){ return T.sum(S.d.studyLog.filter(x=>x.date===date),x=>x.min); },
  linkLabel(l){
    if(!l) return '';
    if(l.type==='assignment'){ const a = S.get('assignments',l.id); return a ? 'Assignment · '+a.title : ''; }
    if(l.type==='subject'){ const s = S.get('subjects',l.id); return s ? 'Class · '+s.name : ''; }
    if(l.type==='exam'){ const e = S.get('exams',l.id); return e ? 'Exam · '+e.name : ''; }
    return '';
  },
  /* attendance */
  attStats(sid){
    const s = S.get('subjects',sid); if(!s) return null;
    const recs = S.d.attendance.filter(r=>r.subjectId===sid), base = s.base||{attended:0,total:0};
    const p = recs.filter(r=>r.status==='present').length, a = recs.filter(r=>r.status==='absent').length;
    const att = base.attended+p, total = base.total+p+a, target = s.target || S.d.settings.attTarget;
    let pct = null, canMiss = null, need = 0, status = 'nodata';
    if(total>0){
      pct = att/total*100;
      canMiss = Math.max(0,Math.floor(att*100/target - total + 1e-9));
      need = pct>=target ? 0 : (target>=100 ? Infinity : Math.ceil((target*total-100*att)/(100-target)-1e-9));
      status = pct<target ? 'low' : (canMiss<=1 ? 'edge' : 'safe');
    }
    return {att,total,missed:total-att,pct,target,canMiss,need,status};
  },
  attMessage(st){
    if(st.status==='nodata') return 'No classes recorded yet.';
    const t = Math.round(st.target*100)/100;
    if(st.status==='low') return isFinite(st.need) ? 'Below '+t+'%. Attend the next '+T.plural(st.need,'class','classes')+' in a row to get back to target.' : 'Below target. Only perfect attendance can reach it.';
    if(st.canMiss===0) return 'Close to the line. You cannot miss another class without dropping below '+t+'%.';
    return 'You can miss '+T.plural(st.canMiss,'more class','more classes')+' before dropping below '+t+'%.';
  },
  attOverall(){
    let att = 0, total = 0;
    S.d.subjects.forEach(s=>{ const x = Q.attStats(s.id); att += x.att; total += x.total; });
    return {att,total,pct:total?att/total*100:null};
  },
  attTrend(weeks){
    const ws = S.d.settings.weekStart, today = D.today(), endThis = D.add(D.weekStart(today,ws),6), pts = [];
    const baseA = T.sum(S.d.subjects,s=>(s.base||{}).attended||0), baseT = T.sum(S.d.subjects,s=>(s.base||{}).total||0);
    for(let i=weeks-1;i>=0;i--){
      let end = D.add(endThis,-7*i); const label = D.short(D.add(end,-6)); if(end>today) end = today;
      const rs = S.d.attendance.filter(r=>r.date<=end);
      const att = baseA + rs.filter(r=>r.status==='present').length, tot = baseT + rs.length;
      pts.push({label,pct:tot?att/tot*100:null});
    }
    return pts;
  },
  classAttendance(classId,date){ return S.d.attendance.find(r=>r.classId===classId && r.date===date) || null; },
  /* exams, goals, habits */
  examProg(e){ const tp = (e.units||[]).flatMap(u=>u.topics); const done = tp.filter(t=>t.done).length; return {done,total:tp.length,pct:tp.length?Math.round(done/tp.length*100):0}; },
  goalProg(g){ const m = g.milestones||[]; const done = m.filter(x=>x.done).length; return {done,total:m.length,pct:m.length?Math.round(done/m.length*100):0}; },
  habit(h){
    const today = D.today(), log = new Set(h.log||[]), ws = S.d.settings.weekStart;
    const doneToday = log.has(today); let streak = 0, pct = 0, thisWeek = 0, target = h.target||1;
    const w0 = D.weekStart(today,ws);
    for(let i=0;i<7;i++) if(log.has(D.add(w0,i))) thisWeek++;
    if(h.freq==='weekly'){
      let wk = thisWeek>=target ? w0 : D.add(w0,-7);
      for(let k=0;k<200;k++){ let c = 0; for(let i=0;i<7;i++) if(log.has(D.add(wk,i))) c++; if(c>=target){ streak++; wk = D.add(wk,-7); } else break; }
      pct = Math.min(100,Math.round(thisWeek/target*100));
    } else {
      let d = doneToday ? today : D.add(today,-1);
      while(log.has(d)){ streak++; d = D.add(d,-1); if(streak>800) break; }
      let c = 0; for(let i=0;i<7;i++) if(log.has(D.add(today,-i))) c++;
      pct = Math.round(c/7*100);
    }
    return {doneToday,streak,pct,thisWeek,target};
  },
  /* upcoming list for dashboard */
  upcoming(limit){
    const today = D.today(), now = D.isoNow(), items = [];
    S.d.assignments.filter(a=>!['submitted','completed'].includes(a.status) && a.due>=today).forEach(a=>items.push({kind:'Assignment',icon:'file',title:a.title,sub:Q.subjName(a.subjectId,true),date:a.due,time:a.dueTime||'',color:Q.subjColor(a.subjectId),go:'assignments',id:a.id}));
    S.d.exams.filter(e=>e.date>=today).forEach(e=>items.push({kind:'Exam',icon:'cap',title:e.name,sub:Q.subjName(e.subjectId,true),date:e.date,time:e.time||'',color:Q.subjColor(e.subjectId),go:'exams',id:e.id}));
    S.d.events.filter(e=>e.date>=today).forEach(e=>items.push({kind:'Event',icon:'calendar',title:e.title,sub:e.type,date:e.date,time:e.start||'',color:'stone',go:'calendar',id:e.id}));
    S.d.reminders.filter(r=>!r.fired && r.at>=now.slice(0,16)).forEach(r=>items.push({kind:'Reminder',icon:'bell',title:r.title,sub:r.recur!=='none'?'Repeats '+r.recur:'',date:r.at.slice(0,10),time:r.at.slice(11,16),color:'stone',go:'tasks/reminders',id:r.id}));
    items.sort((a,b)=>(a.date+(a.time||'23:59')).localeCompare(b.date+(b.time||'23:59')));
    return items.slice(0,limit||6);
  },
  nextDeadline(){
    const today = D.today(), now = D.nowHHMM(), c = [];
    Q.open().filter(t=>t.due && !Q.isOverdue(t)).forEach(t=>c.push({title:t.title,date:t.due,time:t.time}));
    S.d.assignments.filter(a=>!['submitted','completed'].includes(a.status) && a.due>=today).forEach(a=>c.push({title:a.title,date:a.due,time:a.dueTime}));
    c.sort((a,b)=>(a.date+(a.time||'23:59')).localeCompare(b.date+(b.time||'23:59')));
    return c[0] || null;
  },
  assignmentBucket(a){
    if(['submitted','completed'].includes(a.status)) return 'done';
    const today = D.today(), n = D.diff(today,a.due);
    if(n<0) return 'overdue'; if(n===0) return 'today'; if(n<=7) return 'week'; return 'upcoming';
  },
  openAssignments(){ return S.d.assignments.filter(a=>!['submitted','completed'].includes(a.status)); },
  /* events merged for calendar */
  eventsOn(date){
    const out = [], dow = D.dow(date);
    Q.classesOn(dow).forEach(c=>out.push({kind:c.lab?'lab':'class',title:Q.classTitle(c),start:c.start,end:c.end,sub:[c.room,c.building].filter(Boolean).join(' · '),src:'class',id:c.id,color:Q.classColor(c)}));
    S.d.assignments.filter(a=>a.due===date).forEach(a=>out.push({kind:'assignment',title:a.title+' due',start:a.dueTime||'',end:'',sub:Q.subjName(a.subjectId,true),src:'assignment',id:a.id}));
    S.d.exams.filter(e=>e.date===date).forEach(e=>out.push({kind:'exam',title:e.name,start:e.time||'',end:'',sub:Q.subjName(e.subjectId,true)+(e.room?' · '+e.room:''),src:'exam',id:e.id}));
    S.d.events.filter(e=>e.date===date).forEach(e=>out.push({kind:e.type,title:e.title,start:e.start||'',end:e.end||'',sub:e.notes||'',src:'event',id:e.id}));
    out.sort((a,b)=>(a.start||'00:00').localeCompare(b.start||'00:00'));
    return out;
  }
};

/* ---------- notification engine ---------- */
T.Notifier = {
  push(n){
    const d = S.d;
    if(n.key){ if(d.notifSeen.includes(n.key)) return false; d.notifSeen.push(n.key); if(d.notifSeen.length>800) d.notifSeen.splice(0,200); }
    d.notifications.unshift({id:uid('nt'),title:n.title,body:n.body||'',type:n.type||'info',ts:Date.now(),read:false,go:n.go||null});
    if(d.notifications.length>200) d.notifications.length = 200;
    try{ if(d.settings.notify.browser && 'Notification' in window && Notification.permission==='granted') new Notification(n.title,{body:n.body||''}); }catch(e){}
    return true;
  },
  advance(r){
    const step = r.recur==='daily'?1 : r.recur==='weekly'?7 : Math.max(1,+r.every||1);
    let date = r.at.slice(0,10); const time = r.at.slice(11,16), now = D.isoNow();
    do { date = D.add(date,step); } while(date+'T'+time <= now);
    r.at = date+'T'+time; r.fired = false;
  },
  scan(){
    const d = S.d, st = d.settings, n = st.notify, now = D.isoNow(), today = D.today(), tomorrow = D.add(today,1);
    let changed = false;
    d.reminders.forEach(r=>{
      if(r.fired || r.at>now) return;
      const stale = Date.now() - new Date(r.at).getTime() > 864e5;
      if(!stale) T.Notifier.push({key:'rem:'+r.id+':'+r.at,title:r.title,body:'Reminder',type:'reminder',go:'tasks/reminders'});
      if(r.recur && r.recur!=='none') T.Notifier.advance(r); else r.fired = true;
      changed = true;
    });
    Q.open().forEach(t=>{
      if(!t.due || !t.reminder || t.reminder==='none') return;
      const at = D.addMin(t.due, t.time||'09:00', -(+t.reminder||0));
      if(at.date+'T'+at.time<=now && Date.now()-new Date(at.date+'T'+at.time).getTime()<864e5 && T.Notifier.push({key:'trem:'+t.id+':'+t.due,title:t.title,body:'Due '+D.dt(t.due,t.time).toLowerCase(),type:'reminder',go:'tasks'})) changed = true;
    });
    if(n.classes){
      const nowM = D.nowMin();
      Q.todayClasses().forEach(c=>{
        const diff = D.mins(c.start)-nowM;
        if(diff>0 && diff<=20 && T.Notifier.push({key:'cls:'+c.id+':'+today,title:'You have '+Q.classTitle(c)+' class in '+T.plural(diff,'minute')+'.',body:[c.room,c.building].filter(Boolean).join(' · '),type:'class',go:'timetable'})) changed = true;
      });
    }
    if(n.deadlines){
      d.assignments.forEach(a=>{
        if(['submitted','completed'].includes(a.status)) return;
        const sub = Q.subjName(a.subjectId,true)||'Your';
        if(a.due===tomorrow && T.Notifier.push({key:'asg:'+a.id+':'+a.due,title:sub+' assignment is due tomorrow.',body:a.title,type:'deadline',go:'assignments'})) changed = true;
        if(a.due===today && T.Notifier.push({key:'asg:'+a.id+':today',title:sub+' assignment is due today.',body:a.title,type:'deadline',go:'assignments'})) changed = true;
      });
      d.exams.forEach(e=>{
        const n3 = D.diff(today,e.date);
        if(n3>=0 && n3<=3 && T.Notifier.push({key:'exm:'+e.id+':'+n3,title:e.name+(n3===0?' is today.':' is in '+T.plural(n3,'day')+'.'),body:Q.subjName(e.subjectId),type:'deadline',go:'exams'})) changed = true;
      });
    }
    if(n.attendance){
      d.subjects.forEach(s=>{
        const x = Q.attStats(s.id);
        if(x.status==='low' && T.Notifier.push({key:'att:'+s.id+':'+Math.floor(x.pct),title:'Your '+(s.short||s.name)+' attendance has fallen below '+Math.round(x.target*100)/100+'%.',body:Q.attMessage(x),type:'attendance',go:'attendance'})) changed = true;
      });
    }
    if(n.overdue){
      const od = Q.overdue().length;
      if(od>0 && T.Notifier.push({key:'od:'+today,title:'You have '+T.plural(od,'overdue task')+'.',body:'',type:'overdue',go:'tasks/overdue'})) changed = true;
    }
    if(changed) S.emit();
  }
};
})();

/* ui.js: layers (modal, drawer, palette), toasts, confirm/prompt, schema-driven forms, small HTML helpers */
(function(){
const T = window.T, esc = T.esc, icon = T.icon, D = T.D;
const UI = T.UI = { stack:[] };

/* ---------- small html helpers ---------- */
UI.chk = (on,act,id,label) => '<button type="button" class="chk'+(on?' on':'')+'" data-act="'+act+'" data-id="'+esc(id)+'" role="checkbox" aria-checked="'+(on?'true':'false')+'" aria-label="'+esc(label||'Mark complete')+'">'+icon('check')+'</button>';
UI.pri = p => '<span class="pri '+p+'"><i></i>'+({urgent:'Urgent',high:'High',medium:'Medium',low:'Low'}[p]||p)+'</span>';

UI.subj = sid => { const s = T.S.get('subjects',sid); return s ? '<span class="chip sc sc-'+s.color+'"><span class="dot"></span>'+esc(s.short||s.name)+'</span>' : ''; };
UI.bar = (pct,cls,target) => '<div class="bar" role="progressbar" aria-valuenow="'+Math.round(pct)+'" aria-valuemin="0" aria-valuemax="100"><i class="'+(cls||'')+'" style="width:'+T.clamp(pct,0,100)+'%"></i>'+(target!=null?'<b style="left:'+target+'%"></b>':'')+'</div>';
UI.empty = o => '<div class="empty">'+(o.icon?'<div class="ico accent" style="width:48px;height:48px;border-radius:16px">'+icon(o.icon,22)+'</div>':'')+'<h3>'+esc(o.title)+'</h3>'+(o.text?'<p>'+esc(o.text)+'</p>':'')+(o.btn?'<button class="btn accent" data-act="'+o.act+'"'+(o.attr||'')+'>'+icon('plus')+esc(o.btn)+'</button>':'')+'</div>';
UI.skel = n => Array.from({length:n||3},()=>'<div class="skel" style="height:64px"></div>').join('');

/* ---------- layers ---------- */
UI.open = function(o){
  const el = document.createElement('div');
  el.className = 'layer '+o.kind+(o.wide?' wide':'');
  const head = o.raw ? '' : '<header class="panel-h"><h2>'+esc(o.title||'')+'</h2><button type="button" class="btn icon sm" data-act="close" aria-label="Close">'+icon('x')+'</button></header>';
  el.innerHTML = '<div class="scrim" data-act="close"></div><section class="panel" role="dialog" aria-modal="true" aria-label="'+esc(o.title||'Dialog')+'">'+head+(o.raw?'':'<div class="panel-b"></div>')+'</section>';
  const rec = {el, o, prev:document.activeElement, body:o.raw?el.querySelector('.panel'):el.querySelector('.panel-b')};
  rec.body.innerHTML = o.render ? o.render() : (o.html||'');
  document.getElementById('layers').appendChild(el);
  UI.stack.push(rec);
  document.body.style.overflow = 'hidden';
  const first = rec.body.querySelector('[data-focus]') || rec.body.querySelector('input:not([type=hidden]):not([type=checkbox]):not([type=radio]),textarea,select');
  const pn = el.querySelector('.panel'); pn.setAttribute('tabindex','-1');
  (first || pn).focus({preventScroll:true});
  if(o.onMount) o.onMount(rec);
  return rec;
};
UI.close = function(rec){
  rec = rec || UI.stack[UI.stack.length-1]; if(!rec) return;
  const i = UI.stack.indexOf(rec); if(i<0) return;
  UI.stack.splice(i,1); rec.el.remove();
  if(!UI.stack.length) document.body.style.overflow = '';
  if(rec.o.onClose) rec.o.onClose(rec);
  try{ if(rec.prev && document.body.contains(rec.prev)) rec.prev.focus({preventScroll:true}); }catch(e){}
};
UI.closeAll = function(){ while(UI.stack.length) UI.close(); };
UI.top = () => UI.stack[UI.stack.length-1] || null;
UI.refresh = function(){
  UI.stack.forEach(rec=>{
    if(!rec.o.render) return;
    const sc = rec.body.scrollTop;
    const active = document.activeElement, keep = active && rec.body.contains(active) && active.id ? active.id : null;
    rec.body.innerHTML = rec.o.render();
    rec.body.scrollTop = sc;
    if(keep){ const n = document.getElementById(keep); if(n) n.focus({preventScroll:true}); }
    if(rec.o.onMount) rec.o.onMount(rec);
  });
};
UI.trap = function(e){
  const rec = UI.top(); if(!rec) return;
  const f = [...rec.el.querySelectorAll('button:not([disabled]),input:not([type=hidden]):not([disabled]),select,textarea,a[href],[tabindex="0"]')].filter(x=>x.offsetParent!==null);
  if(!f.length) return;
  const a = f[0], z = f[f.length-1];
  if(e.shiftKey && (document.activeElement===a || !rec.el.contains(document.activeElement))){ e.preventDefault(); z.focus(); }
  else if(!e.shiftKey && (document.activeElement===z || !rec.el.contains(document.activeElement))){ e.preventDefault(); a.focus(); }
};

/* ---------- toast ---------- */
UI.toast = function(msg,opt){
  opt = opt||{};
  const box = document.getElementById('toasts'); if(!box) return;
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role','status');
  el.innerHTML = '<span>'+esc(msg)+'</span>'+(opt.undo?'<button type="button">Undo</button>':'');
  if(opt.undo) el.querySelector('button').addEventListener('click',()=>{ opt.undo(); el.remove(); });
  box.appendChild(el);
  while(box.children.length>3) box.firstChild.remove();
  setTimeout(()=>el.remove(), opt.ms || (opt.undo?6000:3500));
};

/* ---------- confirm / prompt ---------- */
UI.confirm = function(o){

    let done = false;
    const rec = UI.open({kind:'modal',title:o.title||'Are you sure?',
      html:'<p style="color:var(--ink-2);margin-bottom:18px">'+esc(o.msg||'')+'</p><div class="fm-act"><button type="button" class="btn" data-act="close">Cancel</button><button type="button" class="btn '+(o.danger===false?'accent':'danger')+'" data-yes data-focus>'+esc(o.ok||'Delete')+'</button></div>',

UI.prompt = function(o){

      onMount:r=>{ r.el.querySelector('form').addEventListener('submit',e=>{ e.preventDefault(); const v = e.target.v.value.trim(); if(!v){ r.el.querySelector('#pr-err').textContent = 'Enter a value to continue.'; return; } done = true; res(v); UI.close(r); }); },
      onClose:()=>{ if(!done) res(null); }});
  });
};

/* ---------- schema forms ---------- */
function opts(list,val){
  return list.map(o=>{
    if(o.group) return '<optgroup label="'+esc(o.group)+'">'+opts(o.items,val)+'</optgroup>';
    return '<option value="'+esc(o[0])+'"'+(String(o[0])===String(val)?' selected':'')+'>'+esc(o[1])+'</option>';
  }).join('');
}
function listRow(f,item){
  item = item || {};
  return '<div class="li" data-id="'+esc(item.id||'')+'" data-done="'+(item.done?'1':'0')+'"><input class="in" type="text" value="'+esc(item.title||'')+'" placeholder="'+esc(f.ph||'')+'" aria-label="'+esc(f.label)+'"><button type="button" class="btn icon sm" data-act="list-del" aria-label="Remove">'+icon('x')+'</button></div>';
}
UI.listRow = listRow;
function control(f,v){
  const id = 'f-'+f.name, val = v==null ? '' : v;
  switch(f.type){
    case 'textarea': return '<textarea class="in" id="'+id+'" name="'+f.name+'" rows="'+(f.rows||3)+'" placeholder="'+esc(f.ph||'')+'">'+esc(val)+'</textarea>';
    case 'select': return '<select class="in" id="'+id+'" name="'+f.name+'">'+opts(f.opts,val)+'</select>';
    case 'seg': return '<input type="hidden" id="'+id+'" name="'+f.name+'" value="'+esc(val)+'"><div class="seg" role="radiogroup" aria-label="'+esc(f.label)+'">'+f.opts.map(o=>'<button type="button" role="radio" aria-checked="'+(o[0]===val?'true':'false')+'" class="'+(o[0]===val?'on':'')+'" data-act="seg" data-v="'+esc(o[0])+'">'+esc(o[1])+'</button>').join('')+'</div>';
    case 'color': return '<div class="swatches" role="radiogroup" aria-label="'+esc(f.label)+'">'+['blue','green','amber','rose','stone','violet','teal'].map(c=>'<label class="sc-'+c+'" title="'+c+'"><input type="radio" name="'+f.name+'" value="'+c+'"'+(val===c?' checked':'')+'><span></span><span class="sr">'+c+'</span></label>').join('')+'</div>';
    case 'days': return '<div class="days" role="group" aria-label="'+esc(f.label)+'">'+[1,2,3,4,5,6,0].map(d=>'<label><input type="checkbox" name="'+f.name+'" value="'+d+'"'+((v||[]).includes(d)?' checked':'')+'><span>'+D.DAYS[d]+'</span></label>').join('')+'</div>';
    case 'list': return '<div class="listf" data-list="'+f.name+'">'+(v||[]).map(x=>listRow(f,x)).join('')+'</div><div><button type="button" class="btn sm" data-act="list-add" data-name="'+f.name+'" data-ph="'+esc(f.ph||'')+'" data-label="'+esc(f.label)+'">'+icon('plus')+esc(f.addLabel||'Add')+'</button></div>';
    case 'tags': return '<input class="in" id="'+id+'" name="'+f.name+'" type="text" value="'+esc((v||[]).join(', '))+'" placeholder="'+esc(f.ph||'e.g. physics, formulas')+'">';
    case 'checkbox': return '<label class="chkrow"><input type="checkbox" id="'+id+'" name="'+f.name+'"'+(v?' checked':'')+'>'+esc(f.text||f.label)+'</label>';
    case 'number': return '<input class="in" id="'+id+'" name="'+f.name+'" type="number" inputmode="numeric" value="'+esc(val)+'"'+(f.min!=null?' min="'+f.min+'"':'')+(f.max!=null?' max="'+f.max+'"':'')+' placeholder="'+esc(f.ph||'')+'">';
    default: return '<input class="in" id="'+id+'" name="'+f.name+'" type="'+(f.type||'text')+'" value="'+esc(val)+'" placeholder="'+esc(f.ph||'')+'"'+(f.max?' maxlength="'+f.max+'"':'')+'>';
  }
}
UI.fields = function(schema,values){
  return schema.map(f=>{
    if(f.type==='heading') return '<div class="fld"><div class="lbl" style="margin-top:6px">'+esc(f.label)+'</div></div>';
    const lab = f.type==='checkbox' ? '' : (f.type==='seg'||f.type==='color'||f.type==='days'||f.type==='list') ? '<div class="fl">'+esc(f.label)+(f.req?' *':'')+'</div>' : '<label for="f-'+f.name+'">'+esc(f.label)+(f.req?' *':'')+'</label>';
    const hid = f.showIf && String((values||{})[f.showIf.name])!==String(f.showIf.eq);
    return '<div class="fld'+(f.half?' half':'')+'" data-fld="'+f.name+'"'+(hid?' hidden':'')+'>'+lab+control(f,(values||{})[f.name])+(f.hint?'<div class="hint">'+esc(f.hint)+'</div>':'')+'<div class="err" id="e-'+f.name+'" role="alert"></div></div>';
  }).join('');
};
UI.read = function(form,schema){
  const v = {};
  schema.forEach(f=>{
    const n = f.name; if(f.type==='heading') return;
    if(f.type==='checkbox') v[n] = !!form.querySelector('input[name="'+n+'"]').checked;
    else if(f.type==='days') v[n] = [...form.querySelectorAll('input[name="'+n+'"]:checked')].map(i=>+i.value);
    else if(f.type==='list') v[n] = [...form.querySelectorAll('[data-list="'+n+'"] .li')].map(li=>({id:li.dataset.id||T.uid('x'),title:li.querySelector('input').value.trim(),done:li.dataset.done==='1'})).filter(x=>x.title);
    else if(f.type==='tags') v[n] = [...new Set(form.elements[n].value.split(/[,\s]+/).map(x=>x.replace(/^#/,'').trim().toLowerCase()).filter(Boolean))];
    else if(f.type==='number'){ const x = form.elements[n].value; v[n] = x==='' ? null : +x; }
    else if(f.type==='color'){ const c = form.querySelector('input[name="'+n+'"]:checked'); v[n] = c ? c.value : ''; }
    else v[n] = (form.elements[n].value||'').trim();
  });
  return v;
};
UI.showErrors = function(form,errs){
  form.querySelectorAll('.err').forEach(e=>e.textContent = '');
  form.querySelectorAll('[aria-invalid]').forEach(e=>e.removeAttribute('aria-invalid'));
  let first = null;
  Object.keys(errs).forEach(k=>{
    const e = form.querySelector('#e-'+k); if(e) e.textContent = errs[k];
    const c = form.querySelector('[name="'+k+'"]'); if(c && c.type!=='hidden'){ c.setAttribute('aria-invalid','true'); if(!first) first = c; }
  });
  if(first) first.focus();
};
/* o: {title, schema, values, ok, onSubmit(values,rec)->void|false|errors, onDelete, wide, extra} */
UI.form = function(o){
  return UI.open({kind:'modal',title:o.title,wide:o.wide,
    html:'<form class="fm" novalidate>'+UI.fields(o.schema,o.values)+(o.extra||'')+'<div class="fm-act">'+(o.onDelete?'<button type="button" class="btn danger sp" data-form-del>'+icon('trash')+'Delete</button>':'')+'<button type="button" class="btn" data-act="close">Cancel</button><button type="submit" class="btn accent">'+esc(o.ok||'Save')+'</button></div></form>',
    onMount:rec=>{
      const form = rec.el.querySelector('form');
      const vis = () => { const v = UI.read(form,o.schema.filter(f=>!f.showIf)); o.schema.forEach(f=>{ if(!f.showIf) return; const el = form.querySelector('[data-fld="'+f.name+'"]'); const cur = f.showIf.name in v ? v[f.showIf.name] : UI.read(form,o.schema.filter(x=>x.name===f.showIf.name))[f.showIf.name]; if(el) el.hidden = String(cur)!==String(f.showIf.eq); }); };
      form.addEventListener('change',vis); form.addEventListener('click',e=>{ if(e.target.closest('[data-act="seg"]')) setTimeout(vis,0); });
      form.addEventListener('submit',e=>{
        e.preventDefault();
        const v = UI.read(form,o.schema), errs = {};
        o.schema.forEach(f=>{
          const hf = form.querySelector('[data-fld="'+f.name+'"]'); if(hf && hf.hidden) return;
          if(f.req && (v[f.name]===''||v[f.name]==null||(Array.isArray(v[f.name])&&!v[f.name].length))) errs[f.name] = f.reqMsg || 'This field is required.';
          if(f.type==='number' && v[f.name]!=null){ if(f.min!=null && v[f.name]<f.min) errs[f.name] = 'Must be at least '+f.min+'.'; if(f.max!=null && v[f.name]>f.max) errs[f.name] = 'Must be at most '+f.max+'.'; }
        });
        if(o.validate) Object.assign(errs, o.validate(v)||{});
        if(Object.keys(errs).length){ UI.showErrors(form,errs); return; }
        const r = o.onSubmit(v,rec);
        if(r && typeof r==='object'){ UI.showErrors(form,r); return; }
        if(r!==false) UI.close(rec);
      });
      const del = form.querySelector('[data-form-del]');
      if(del) del.addEventListener('click',()=>{ UI.confirm({title:'Delete this?',msg:o.deleteMsg||'This cannot be undone.'}).then(ok=>{ if(ok){ o.onDelete(); UI.close(rec); } }); });
    }
  });
};
T.A.close = (el) => { const l = el.closest('.layer'); const rec = UI.stack.find(r=>r.el===l); UI.close(rec); };
T.A.seg = (el) => { const wrap = el.closest('.seg'); wrap.querySelectorAll('button').forEach(b=>{ b.classList.toggle('on',b===el); b.setAttribute('aria-checked',b===el?'true':'false'); }); wrap.previousElementSibling.value = el.dataset.v; };
T.A['list-add'] = (el) => {
  const box = el.closest('.fld').querySelector('[data-list]');
  const wrap = document.createElement('div'); wrap.innerHTML = listRow({ph:el.dataset.ph,label:el.dataset.label},{});
  const row = wrap.firstChild; box.appendChild(row); row.querySelector('input').focus();
};
T.A['list-del'] = (el) => el.closest('.li').remove();
})();

/* forms.js: entity forms, quick add, command palette, task detail drawer, notifications drawer */
(function(){
const T = window.T, S = T.S, Q = T.Q, D = T.D, UI = T.UI, esc = T.esc, icon = T.icon;
const F = T.F = {};
const st = () => S.d.settings;
const DAYSEL = [[1,'Monday'],[2,'Tuesday'],[3,'Wednesday'],[4,'Thursday'],[5,'Friday'],[6,'Saturday'],[0,'Sunday']];
const subjOpts = (none) => (none?[['',none]]:[]).concat(Q.subjects().map(s=>[s.id,s.name]));
const REM = [['none','No reminder'],['0','At due time'],['5','5 minutes before'],['15','15 minutes before'],['30','30 minutes before'],['60','1 hour before'],['1440','1 day before']];
const EVT = [['personal','Personal event'],['college','College event'],['holiday','Holiday'],['class','Class'],['lab','Lab'],['assignment','Assignment'],['exam','Exam']];

/* ---------- task ---------- */
F.task = function(item,preset){
  const editing = item && item.id && S.get('tasks',item.id);
  const df = st().defaults;
  const v = Object.assign({title:'',due:'',time:'',priority:df.priority,category:df.category,estimate:null,reminder:df.reminder,recur:'none',tags:[],subtasks:[],notes:'',link:null}, item||{}, preset||{});

  const open = S.d.assignments.filter(a=>!['submitted','completed'].includes(a.status));
  const schema = [
    {name:'title',label:'Title',type:'text',req:true,ph:'What needs to be done?',max:160},
    {name:'due',label:'Due date',type:'date',half:true},
    {name:'time',label:'Due time',type:'time',half:true},
    {name:'priority',label:'Priority',type:'seg',opts:T.PRIS},

    {name:'linkv',label:'Related to',type:'select',opts:[['','Nothing']].concat(open.length?[{group:'Assignments',items:open.map(a=>['assignment:'+a.id,a.title])}]:[]).concat(Q.subjects().length?[{group:'Classes',items:Q.subjects().map(s=>['subject:'+s.id,s.name])}]:[])},
    {name:'tags',label:'Tags',type:'tags'},
    {name:'subtasks',label:'Subtasks',type:'list',addLabel:'Add subtask',ph:'Subtask'},
    {name:'notes',label:'Notes',type:'textarea',rows:3}
  ];
  UI.form({title:editing?'Edit task':'New task',schema,values:v,wide:true,ok:editing?'Save changes':'Add task',
    validate:x=>{ const e = {}; if(x.time && !x.due) e.due = 'Add a due date to use a time.'; if(x.reminder!=='none' && !x.due) e.reminder = 'A reminder needs a due date.'; return e; },

    onSubmit:x=>{

/* quick text task */
F.quickTask = function(text,def){
  const p = T.parseQuick(text); if(!p.title) return null;
  if(!p.due && def && def.due) p.due = def.due;
  const df = st().defaults;
  const t = S.add('tasks',{title:p.title,due:p.due,time:p.time,priority:p.priority||df.priority,category:p.category||df.category,tags:p.tags,recur:p.recur,reminder:p.due?df.reminder:'none',subtasks:[],notes:'',estimate:null,link:null,done:false,doneAt:null});
  return t;
};
F.parsedChips = function(text){
  if(!text.trim()) return '';
  const p = T.parseQuick(text), c = [];
  if(p.due) c.push('<span class="chip accent">'+icon('calendar',13)+esc(D.label(p.due))+'</span>');
  if(p.time) c.push('<span class="chip accent">'+icon('clock',13)+esc(D.time(p.time))+'</span>');
  if(p.priority) c.push('<span class="chip">'+esc(p.priority.charAt(0).toUpperCase()+p.priority.slice(1))+' priority</span>');
  if(p.category) c.push('<span class="chip">'+esc(p.category)+'</span>');
  if(p.recur!=='none') c.push('<span class="chip">'+icon('repeat',13)+esc(p.recur)+'</span>');
  p.tags.forEach(t=>c.push('<span class="chip">#'+esc(t)+'</span>'));
  return '<span class="muted" style="font-size:12px;align-self:center">Task: <b style="color:var(--ink)">'+esc(p.title||'…')+'</b></span>'+c.join('');
};

/* ---------- reminder ---------- */
F.reminder = function(item){
  const editing = item && item.id && S.get('reminders',item.id);
  const now = D.isoNow();
  const v = Object.assign({title:'',kind:'time',date:D.add(D.today(),0),time:D.hhmm(Math.ceil((D.nowMin()+30)/15)*15),target:'',before:'60',recur:'none',every:2}, item||{});
  if(editing && item.at){ v.date = item.at.slice(0,10); v.time = item.at.slice(11,16); if(item.kind==='before'){ v.target = item.target||''; v.before = String(item.before||60); } }
  const targets = [].concat(
    S.d.exams.filter(e=>e.date>=D.today()).map(e=>({v:'exam:'+e.id,l:e.name+' · '+D.label(e.date)})),
    S.d.assignments.filter(a=>a.due>=D.today()&&!['submitted','completed'].includes(a.status)).map(a=>({v:'assignment:'+a.id,l:a.title+' · '+D.label(a.due)})),
    S.d.events.filter(e=>e.date>=D.today()).map(e=>({v:'event:'+e.id,l:e.title+' · '+D.label(e.date)})));
  const schema = [
    {name:'title',label:'Remind me to',type:'text',req:true,ph:'e.g. Submit assignment',max:140},
    {name:'kind',label:'When',type:'seg',opts:[['time','At a date and time'],['before','Before an event']]},
    {name:'date',label:'Date',type:'date',half:true,req:true,showIf:{name:'kind',eq:'time'}},
    {name:'time',label:'Time',type:'time',half:true,req:true,showIf:{name:'kind',eq:'time'}},
    {name:'target',label:'Event',type:'select',opts:[['','Choose an event']].concat(targets.map(t=>[t.v,t.l])),req:true,showIf:{name:'kind',eq:'before'},hint:targets.length?'':'Add an exam, assignment or calendar event first.'},
    {name:'before',label:'How long before',type:'select',opts:[['15','15 minutes'],['30','30 minutes'],['60','1 hour'],['120','2 hours'],['1440','1 day'],['2880','2 days']],showIf:{name:'kind',eq:'before'}},
    {name:'recur',label:'Repeat',type:'select',opts:[['none','Does not repeat'],['daily','Every day'],['weekly','Every week'],['custom','Every few days']],half:true,showIf:{name:'kind',eq:'time'}},
    {name:'every',label:'Every how many days',type:'number',min:1,max:365,half:true,showIf:{name:'recur',eq:'custom'}}
  ];
  // a field can only depend on one control; the "every" field shows for custom recurrence in time mode
  UI.form({title:editing?'Edit reminder':'New reminder',schema,values:v,ok:editing?'Save changes':'Add reminder',
    onDelete:editing?()=>{ const rec = S.del('reminders',item.id); UI.toast('Reminder deleted',{undo:()=>S.restore(rec)}); }:null,
    validate:x=>{
      const e = {};
      if(x.kind==='time'){ if(!editing && x.date+'T'+x.time<=now && x.recur==='none') e.date = 'Pick a time in the future.'; }
      return e;
    },
    onSubmit:x=>{
      let at, tgt = null;
      if(x.kind==='time') at = x.date+'T'+x.time;
      else {
        const parts = x.target.split(':'), id = parts[1]; let date, time;
        if(parts[0]==='exam'){ const e = S.get('exams',id); date = e.date; time = e.time||'09:00'; }
        else if(parts[0]==='assignment'){ const a = S.get('assignments',id); date = a.due; time = a.dueTime||'09:00'; }
        else { const e = S.get('events',id); date = e.date; time = e.start||'09:00'; }
        const r = D.addMin(date,time,-(+x.before)); at = r.date+'T'+r.time; tgt = x.target;
      }
      const data = {title:x.title,kind:x.kind,at,recur:x.kind==='time'?x.recur:'none',every:x.every||1,target:tgt,before:+x.before,fired:false};
      if(editing){ S.upd('reminders',item.id,data); UI.toast('Reminder saved'); }
      else { const r = S.add('reminders',data); UI.toast('Reminder set for '+D.dt(at.slice(0,10),at.slice(11,16)).toLowerCase(),{undo:()=>S.del('reminders',r.id)}); }
      if(at<=now) T.Notifier.scan();
    }});
};

const ago = ts => { const m = Math.round((Date.now()-ts)/60000); if(m<1) return 'Just now'; if(m<60) return m+' min ago'; const h = Math.round(m/60); if(h<24) return h+' h ago'; return T.plural(Math.round(h/24),'day')+' ago'; };
const NICON = {reminder:'bell',class:'clock',deadline:'file',attendance:'users',overdue:'tasks',info:'info'};

/* ---------- command palette ---------- */
F.palette = function(){
  const NAV = [['Dashboard','dashboard','home'],['Tasks','tasks','tasks'],['Calendar','calendar','calendar'],['Timetable','timetable','clock'],['Attendance','attendance','users'],['Assignments','assignments','file'],['Exams','exams','cap'],['Notes','notes','note'],['Habits','habits','pulse'],['Goals','goals','target'],['Analytics','analytics','chart'],['Settings','settings','gear'],['Plan my day','plan','spark']];
  const CMD = [['New task','task','tasks'],['New reminder','reminder','bell'],['New class','class','clock'],['New assignment','assignment','file'],['New exam','exam','cap'],['New note','note','note'],['New event','event','calendar'],['Mark attendance','attendance','users']];
  const score = (q,s) => { s = (s||'').toLowerCase(); if(!s) return 0; if(s.startsWith(q)) return 3; if(s.split(/\s+/).some(w=>w.startsWith(q))) return 2; return s.includes(q)?1:0; };
  function items(q){
    q = q.trim().toLowerCase(); const out = [];
    const push = (group,arr) => arr.slice(0,5).forEach(x=>out.push(Object.assign({group},x)));
    const nav = NAV.filter(n=>!q||score(q,n[0])).map(n=>({title:n[0],sub:'Go to',icon:n[2],run:()=>T.go(n[1])}));
    const cmd = CMD.filter(n=>!q||score(q,n[0])).map(n=>({title:n[0],sub:'Create',icon:n[2],run:()=>F.openKind(n[1])}));
    if(!q){ push('Create',cmd.slice(0,8)); push('Go to',nav.slice(0,8)); return out; }
    const rank = (arr,fn) => arr.map(x=>({x,s:fn(x)})).filter(r=>r.s>0).sort((a,b)=>b.s-a.s).map(r=>r.x);
    push('Tasks',rank(S.d.tasks,t=>Math.max(score(q,t.title)*2,score(q,t.notes)*.5,score(q,(t.tags||[]).join(' ')),score(q,t.category))).map(t=>({title:t.title,sub:(t.done?'Completed':D.dt(t.due,t.time)),icon:'tasks',run:()=>F.taskDetail(t.id)})));
    push('Assignments',rank(S.d.assignments,a=>Math.max(score(q,a.title)*2,score(q,a.description)*.5,score(q,Q.subjName(a.subjectId)))).map(a=>({title:a.title,sub:'Due '+D.label(a.due)+' · '+Q.subjName(a.subjectId,true),icon:'file',run:()=>F.assignment(a)})));
    const cls = Q.classes().map(c=>({c,t:Q.subjName(c.subjectId)+' '+(c.teacher||(Q.subject(c.subjectId)||{}).teacher||'')+' '+c.room+' '+c.building}));
    push('Classes',rank(cls,x=>score(q,x.t)).map(x=>({title:Q.classTitle(x.c),sub:D.DAYS_FULL[x.c.day]+' · '+D.range(x.c.start,x.c.end)+(x.c.room?' · '+x.c.room:''),icon:'clock',run:()=>F.cls(x.c)})));
    push('Notes',rank(S.d.notes,n=>Math.max(score(q,n.title)*2,score(q,n.body)*.5,score(q,(n.tags||[]).join(' ')))).map(n=>({title:n.title,sub:(n.tags||[]).map(x=>'#'+x).join(' ')||'Note',icon:'note',run:()=>F.note(n)})));
    push('Exams',rank(S.d.exams,e=>Math.max(score(q,e.name)*2,score(q,Q.subjName(e.subjectId)),score(q,e.syllabus)*.5)).map(e=>({title:e.name,sub:D.label(e.date)+' · '+Q.subjName(e.subjectId,true),icon:'cap',run:()=>T.go('exams')})));
    push('Goals',rank(S.d.goals,g=>Math.max(score(q,g.title)*2,score(q,(g.milestones||[]).map(m=>m.title).join(' '))*.5)).map(g=>({title:g.title,sub:Q.goalProg(g).pct+'% complete',icon:'target',run:()=>T.go('goals')})));
    push('Go to',nav); push('Create',cmd);
    return out;
  }
  let list = [], sel = 0, rec;
  const draw = () => {
    const box = rec.el.querySelector('.pal-list'); let g = '', html = '';
    if(!list.length){ box.innerHTML = '<div class="empty" style="padding:28px"><h3>No matches</h3><p>Try a task, class, note or exam name.</p></div>'; return; }
    list.forEach((it,i)=>{ if(it.group!==g){ g = it.group; html += '<div class="lbl" style="padding:10px 12px 4px">'+esc(g)+'</div>'; } html += '<button type="button" class="pal-i'+(i===sel?' sel':'')+'" data-i="'+i+'" role="option" aria-selected="'+(i===sel)+'">'+icon(it.icon,18)+'<span style="flex:1;min-width:0"><b style="font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(it.title)+'</b></span><span class="muted" style="font-size:12px;white-space:nowrap">'+esc(it.sub||'')+'</span></button>'; });
    box.innerHTML = html;
    const s = box.querySelector('.sel'); if(s) s.scrollIntoView({block:'nearest'});
  };
  const run = i => { const it = list[i]; if(!it) return; UI.close(rec); setTimeout(it.run,0); };
  rec = UI.open({kind:'palette',raw:true,title:'Search',
    html:'<div class="pal-in">'+icon('search')+'<input id="pal-q" type="text" autocomplete="off" placeholder="Search tasks, classes, notes, exams, goals…" aria-label="Search" data-focus><span class="chip mono">Esc</span></div><div class="pal-list" role="listbox" aria-label="Results"></div><div class="pal-foot"><span><span class="mono">↑↓</span> move</span><span><span class="mono">Enter</span> open</span><span style="margin-left:auto">Tasks · Classes · Notes · Exams · Goals</span></div>',
    onMount:r=>{
      rec = r;
      const inp = r.el.querySelector('#pal-q');
      const upd = () => { list = items(inp.value); sel = 0; draw(); };
      inp.addEventListener('input',upd);
      inp.addEventListener('keydown',e=>{
        if(e.key==='ArrowDown'){ e.preventDefault(); sel = Math.min(list.length-1,sel+1); draw(); }
        else if(e.key==='ArrowUp'){ e.preventDefault(); sel = Math.max(0,sel-1); draw(); }
        else if(e.key==='Enter'){ e.preventDefault(); run(sel); }
      });
      r.el.querySelector('.pal-list').addEventListener('click',e=>{ const b = e.target.closest('[data-i]'); if(b) run(+b.dataset.i); });
      upd();
    }});
};
})();

/* views1.js: shared view helpers, task actions, Dashboard, Tasks (+ reminders) */
(function(){
const T = window.T, S = T.S, Q = T.Q, D = T.D, UI = T.UI, F = T.F, esc = T.esc, icon = T.icon;
const V = T.V = {};
const st = () => S.d.settings;

/* ---------- helpers ---------- */
V.card = (title,body,right,cls) => '<section class="card pad '+(cls||'')+'"><div class="card-h"><h2>'+esc(title)+'</h2>'+(right||'')+'</div>'+body+'</section>';
V.link = (txt,go) => '<button type="button" class="link" data-act="go" data-go="'+go+'">'+esc(txt)+'</button>';
V.durText = (m) => m>=60 ? Math.floor(m/60)+'h'+(m%60?' '+(m%60)+'m':'') : m+' min';
V.whenLabel = (t) => {
  if(!t.due) return '';
  if(t.due===D.today()) return t.time ? D.time(t.time) : 'Today';
  return D.label(t.due)+(t.time?' · '+D.time(t.time):'');
};
V.taskRow = (t) => {
  const sub = t.subtasks||[], sd = sub.filter(s=>s.done).length, od = Q.isOverdue(t);
  return '<div class="row'+(t.done?' done':'')+'">'+UI.chk(t.done,'task-toggle',t.id,(t.done?'Restore ':'Complete ')+t.title)
    +'<button type="button" class="tt" data-act="task-open" data-id="'+esc(t.id)+'">'+esc(t.title)+'</button>'
    +'<div class="rowmeta">'+(sub.length?'<span class="mono muted" style="font-size:12px" title="Subtasks">'+sd+'/'+sub.length+'</span>':'')
    +(t.recur&&t.recur!=='none'?'<span class="muted" title="Repeats '+esc(t.recur)+'">'+icon('repeat',14)+'</span>':'')
    +UI.chip(t.category)+UI.pri(t.priority)
    +'<span class="when'+(od?' bad':'')+'">'+esc(V.whenLabel(t))+'</span></div></div>';
};
V.group = (label,n,cls) => '<div class="grp"><span class="lbl '+(cls||'')+'">'+esc(label)+'</span><span class="mono muted" style="font-size:12px">'+n+'</span></div>';
V.quickBar = (def) => '<form data-quickform data-due="'+esc((def&&def.due)||'')+'" novalidate><div class="addbar">'+icon('plus')+'<input name="q" data-quick autocomplete="off" placeholder="Add a task. Try &quot;Revise physics tomorrow 6 PM&quot;" aria-label="Quick add a task"></div><div class="parsed" aria-live="polite"></div></form>';
V.bell = () => S.d.notifications.filter(n=>!n.read).length;

/* ---------- task actions ---------- */
const A = T.A;
A['task-toggle'] = (el) => {
  const t = S.toggleTask(el.dataset.id); if(!t) return;
  if(t.done) UI.toast('Task completed',{undo:()=>S.toggleTask(t.id)}); else UI.toast('Task restored');
};
A['task-open'] = (el) => F.taskDetail(el.dataset.id);
A['task-edit'] = (el) => F.task(S.get('tasks',el.dataset.id));
A['task-del'] = (el) => F.delTask(el.dataset.id);
A['task-dup'] = (el) => F.dupTask(el.dataset.id);
A['task-new'] = (el) => F.task(null, el && el.dataset.due ? {due:el.dataset.due} : null);
A['sub-toggle'] = (el) => { const t = S.get('tasks',el.dataset.id); if(!t) return; const s = t.subtasks.find(x=>x.id===el.dataset.sid); if(s){ s.done = !s.done; S.emit(); } };
A['sub-add'] = (el) => UI.prompt({title:'Add subtask',label:'Subtask',ph:'What is the next step?'}).then(v=>{ if(!v) return; const t = S.get('tasks',el.dataset.id); if(!t) return; t.subtasks = (t.subtasks||[]).concat([{id:T.uid('st'),title:v,done:false}]); S.emit(); });
A['reminder-new'] = () => F.reminder();
A['reminder-edit'] = (el) => F.reminder(S.get('reminders',el.dataset.id));
A['tasks-clear-done'] = () => UI.confirm({title:'Delete completed tasks?',msg:'All '+Q.completed().length+' completed tasks will be removed.',ok:'Delete all'}).then(ok=>{ if(!ok) return; const snap = S.d.tasks.filter(t=>t.done); S.d.tasks = S.d.tasks.filter(t=>!t.done); S.emit(); UI.toast('Completed tasks deleted',{undo:()=>{ S.d.tasks = S.d.tasks.concat(snap); S.emit(); }}); });
A['log-study'] = () => UI.prompt({title:'Log study time',label:'Minutes studied',type:'number',value:'60',ok:'Log time'}).then(v=>{ const m = Math.round(+v); if(!v) return; if(!(m>0 && m<=1440)){ UI.toast('Enter minutes between 1 and 1440.'); return; } S.add('studyLog',{date:D.today(),min:m}); UI.toast('Logged '+V.durText(m)+' of study time'); });

/* ---------- schedule builder (dashboard + plan) ---------- */
V.schedule = function(date){
  const items = [], dow = D.dow(date);
  Q.classesOn(dow).forEach(c=>items.push({k:'class',start:c.start,end:c.end,title:Q.classTitle(c),sub:[c.room,c.building].filter(Boolean).join(' · '),color:Q.classColor(c),id:c.id}));
  const ls = st().lunch;
  if(ls){ const le = D.hhmm(D.mins(ls)+60); if(!items.some(i=>D.mins(i.start)<D.mins(le) && D.mins(i.end)>D.mins(ls))) items.push({k:'lunch',start:ls,end:le,title:'Lunch'}); }
  S.d.tasks.filter(t=>!t.done && t.due===date && t.time).forEach(t=>items.push({k:'task',start:t.time,end:D.hhmm(D.mins(t.time)+(t.estimate||30)),title:t.title,id:t.id}));
  (S.d.plans[date]||[]).filter(b=>b.kind!=='fixed').forEach(b=>items.push({k:'plan',start:b.start,end:b.end,title:b.title,sub:'Planned',id:b.id}));
  return items.sort((a,b)=>D.mins(a.start)-D.mins(b.start) || D.mins(a.end)-D.mins(b.end));
};
V.timeline = function(date){
  const items = V.schedule(date), isToday = date===D.today(), now = D.nowMin();
  if(!items.length) return UI.empty({icon:'calendar',title:'Nothing scheduled',text:'No classes or timed tasks for this day.'});
  let rows = '', nowDone = !isToday;
  const nowRow = (txt) => '<div class="tl-r"><div class="tl-t" style="color:var(--accent-text)">'+esc(D.time(D.hhmm(now)))+'</div><div class="tl-b"><div class="nowline"><i></i><u></u></div>'+(txt?'<div class="tl-free">'+esc(txt)+'</div>':'')+'</div></div>';
  items.forEach((it,i)=>{
    const s = D.mins(it.start), e = D.mins(it.end);
    if(!nowDone && now<s){
      const prevEnd = i ? D.mins(items[i-1].end) : 0;
      if(now>=prevEnd) rows += nowRow('Free for '+V.durText(s-now)+' until '+it.title);
      nowDone = true;
    }
    const cur = isToday && s<=now && now<e, past = isToday && e<=now;
    const cls = it.k==='class' ? 'sc-'+it.color : '';
    if(it.k==='lunch') rows += '<div class="tl-r"><div class="tl-t">'+esc(D.time(it.start))+'</div><div class="tl-b" style="color:var(--muted);padding-top:3px">'+icon('coffee',15)+' Lunch</div></div>';
    else rows += '<div class="tl-r"><div class="tl-t"'+(cur?' style="color:var(--accent-text);font-weight:600"':'')+'>'+esc(D.time(it.start))+'</div><div class="tl-b"><div class="tl-c '+cls+(cur?' now':'')+(past?' past':'')+'"><b>'+esc(it.title)+(it.k==='task'?' <span style="font-weight:400">· task</span>':'')+'</b><span>'+esc(D.range(it.start,it.end))+(it.sub?' · '+esc(it.sub):'')+'</span></div></div></div>';
  });
  return '<div class="tl">'+rows+'</div>';
};

/* ---------- Dashboard ---------- */
function focusTask(){
  const od = Q.taskSort(Q.overdue(),'priority')[0];
  if(od) return {t:od,why:'Overdue since '+D.label(od.due).toLowerCase()};
  const today = D.today(), tm = D.add(today,1);
  const hi = Q.taskSort(Q.open().filter(t=>t.due && t.due<=tm && Q.priRank(t.priority)<=1),'due')[0];
  if(hi) return {t:hi,why:'Due '+D.dt(hi.due,hi.time).toLowerCase()+' · '+hi.priority+' priority'};
  const nx = Q.taskSort(Q.todayTasks(),'due')[0];
  if(nx) return {t:nx,why:'Due '+(nx.time?D.time(nx.time).toLowerCase():'today')};
  return null;
}
function nextClassCard(){

  let chip;
  if(n.ongoing) chip = 'In class · '+n.minsLeft+' min left';
  else if(n.date===D.today()) chip = 'Starts in '+V.durText(n.minsUntil);
  else chip = D.label(n.date)+' at '+D.time(c.start);
  const after = Q.classesOn(D.dow(n.date)).find(x=>D.mins(x.start)>=D.mins(c.end));
  return '<section class="card pad hot"><div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px"><div class="lbl" style="color:var(--accent-text)">'+(n.ongoing?'Right now':'Next class')+'</div><span class="chip" style="height:30px;padding:0 12px;background:var(--ink);color:var(--bg);font-weight:600;font-size:13px">'+icon('clock',15)+esc(chip)+'</span></div>'

V.lineChart = function(pts,o){

  const tg = o.target!=null ? o.target : null;
  let lo = Math.min.apply(null,vals.concat(tg!=null?[tg]:[])), hi = Math.max.apply(null,vals.concat(tg!=null?[tg]:[]));
  lo = Math.max(0,Math.floor((lo-6)/10)*10); hi = Math.min(100,Math.ceil((hi+4)/10)*10); if(hi-lo<20){ hi = Math.min(100,lo+20); lo = Math.max(0,hi-20); }
  const x = i => L + (pts.length===1?(W-L-R)/2:i*(W-L-R)/(pts.length-1)), y = v => Tp + (hi-v)/(hi-lo)*(H-Tp-B);
  const ticks = []; for(let v=lo; v<=hi+0.001; v+=(hi-lo)/4) ticks.push(Math.round(v));
  const path = pts.map((p,i)=>p.pct==null?null:(x(i)+','+y(p.pct))).filter(Boolean).join(' ');

    +ticks.map(v=>'<line class="grid-l" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>').join('')
    +(tg!=null?'<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(tg)+'" y2="'+y(tg)+'" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="4 4"/><text x="'+(W-R)+'" y="'+(y(tg)-6)+'" text-anchor="end" style="fill:var(--ink)">Target '+Math.round(tg)+'%</text>':'')
    +'<polyline points="'+path+'" fill="none" stroke="var(--chart)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'
    +(last?'<circle cx="'+x(last.i)+'" cy="'+y(last.p.pct)+'" r="5" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/><text x="'+x(last.i)+'" y="'+(y(last.p.pct)-10)+'" text-anchor="middle" style="fill:var(--ink)">'+Math.round(last.p.pct)+'%</text>':'')
    +pts.map((p,i)=>'<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(p.label)+'</text>').join('')+'</svg>';
};
V.barChart = function(data,o){

}
