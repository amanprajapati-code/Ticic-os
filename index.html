*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#CFE4FF}
body{margin:0;background:#CFE4FF;color:var(--tx);font:16px/1.4 "Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,system-ui,sans-serif;font-feature-settings:"cv11","ss03";-webkit-font-smoothing:antialiased;overscroll-behavior:none;min-height:100vh;min-height:100dvh;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid rgb(var(--blue));outline-offset:2px}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* sky background */
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 40% at 90% 18%,rgba(255,255,255,.7),transparent 70%),radial-gradient(70% 45% at 0% 55%,rgba(61,139,255,.38),transparent 70%),radial-gradient(60% 40% at 40% 100%,rgba(255,255,255,.85),transparent 70%),linear-gradient(180deg,#86BDFF 0%,#A9D0FF 26%,#D3E6FF 58%,#EEF5FF 100%)}
.blobs i{display:none}

#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:calc(16px + var(--sat)) 18px calc(124px + var(--sab))}
.anim .rise{animation:rise .75s var(--apple) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97);}to{opacity:1;transform:none;filter:none}}

/* glass surface */
.glass,.tcard,.rcard,.rrow,.lcard,.alert{background:var(--glass);border:1px solid var(--line);box-shadow:0 8px 18px -12px rgba(20,80,200,.4)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 18px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.wt{display:flex;flex-direction:column;min-width:0}
.wt b{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt small{font-size:12.5px;font-weight:500;color:rgb(5,96,224)}
.tools{display:flex;gap:10px}
.avatar{position:relative;width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:19px;color:#fff;background:linear-gradient(145deg,#6FB4FF,#0560E0);box-shadow:0 0 0 3px rgba(255,255,255,.8),0 10px 20px -8px rgba(5,96,224,.8);transition:transform .3s var(--spring)}
.avatar:active{transform:scale(.9)}
.round{position:relative;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:rgb(var(--blue));background:rgba(255,255,255,.55);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.8);transition:transform .3s var(--spring)}
.round:active{transform:scale(.88)}
.round .dot{position:absolute;top:10px;right:11px;width:10px;height:10px;border-radius:50%;background:#FF5A4D;border:2px solid #fff}
.date{font-size:13.5px;font-weight:500;color:var(--mu)}
h1{margin:2px 0 0;font-size:30px;line-height:1.12;font-weight:700;letter-spacing:-.03em}
h1.hi{margin:0 0 20px;font-size:34px;line-height:1.1}
h1 .soft{color:rgba(11,42,91,.45);font-weight:700}
h1 b{font-weight:700}
.lh{display:flex;align-items:center;gap:12px}
.ldot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:10px;background:rgb(var(--c))}

/* day strip + filter chips */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.day{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:15px 0 11px;border-radius:99px;background:rgba(255,255,255,.45);border:1px solid var(--line);transition:transform .35s var(--spring),background .35s,color .35s,box-shadow .35s}
.day span{font-size:11.5px;font-weight:500;color:var(--mu)}
.day b{font-size:16px;font-weight:600}
.day i{position:absolute;top:6px;left:50%;margin-left:-2.5px;width:5px;height:5px;border-radius:50%;background:transparent}
.day i.has{background:rgb(var(--blue))}
.day.on{background:rgb(var(--blue));border-color:transparent;color:#fff;box-shadow:0 12px 22px -10px rgba(5,96,224,.9)}
.day.on span{color:rgba(255,255,255,.75)}
.day.on i.has{background:#fff}
.day:active{transform:scale(.92)}
.fchips{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;padding:11px 18px;border-radius:99px;font-size:15px;font-weight:500;background:rgba(255,255,255,.55);border:1px solid var(--line);transition:background .35s,color .35s,transform .3s var(--spring),box-shadow .35s}
.fchip em{font-style:normal;color:var(--mu2);margin-left:3px;transition:color .35s}
.fchip.on{background:rgb(var(--blue));color:#fff;border-color:transparent;box-shadow:0 12px 22px -10px rgba(5,96,224,.9)}
.fchip.on em{color:rgba(255,255,255,.7)}
.fchip:active{transform:scale(.94)}

/* hero card with drag-to-done */
.hero{position:relative;margin:26px 0 18px}
.hero::before,.hero::after{content:"";position:absolute;left:0;right:0;border-radius:34px;background:rgba(5,96,224,.3);z-index:0}
.hero::before{top:-20px;height:60px;margin:0 30px;opacity:.65}
.hero::after{top:-10px;height:70px;margin:0 15px;opacity:.9}
.hcard{position:relative;z-index:1;padding:20px 18px 18px;border-radius:34px;color:#fff;background:radial-gradient(120% 90% at 85% -10%,#2F86FF 0%,#0560E0 55%,#0449B8 100%);box-shadow:0 16px 30px -16px rgba(5,70,200,.8)}
.htop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}
.htag{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 9px;border-radius:99px;font-size:13px;font-weight:600;background:#fff;color:#E5453A}
.htag.warn{background:#FFE4E0}
.hpill{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:99px;font-size:13.5px;font-weight:500;background:rgba(255,255,255,.28)}
.htitle{margin:0;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.03em;overflow-wrap:anywhere}
.hsub{margin:10px 0 0;font-size:14px;color:rgba(255,255,255,.75)}
.hbot{display:flex;align-items:center;gap:12px;margin-top:26px}
.slide{--p:0;position:relative;flex:1;height:62px;border-radius:99px;background:rgba(255,255,255,.26);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y}
.slide::before{content:"";position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.28);transform-origin:left;transform:scaleX(var(--p))}
.knob{position:absolute;left:4px;top:4px;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:rgb(var(--navy));touch-action:none;box-shadow:0 8px 18px -6px rgba(0,20,80,.6);transition:transform .55s var(--spring);z-index:2}
.knob svg{position:static;width:24px;height:24px;padding:0;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.knob .cp{stroke-dashoffset:0}
.stxt{position:relative;margin-left:44px;font-size:15px;font-weight:500;opacity:calc(1 - var(--p)*1.3);transition:opacity .2s}
.sarr{display:flex;gap:1px;margin-left:10px;position:relative;opacity:calc(1 - var(--p)*1.3)}
.sarr i{width:7px;height:7px;border-top:2px solid rgba(255,255,255,.8);border-right:2px solid rgba(255,255,255,.8);transform:rotate(45deg);animation:chevs 1.5s ease-in-out infinite}
.sarr i:nth-child(2){animation-delay:.15s}.sarr i:nth-child(3){animation-delay:.3s}
@keyframes chevs{0%,100%{opacity:.25}40%{opacity:1}}
.slide.hint .knob{animation:nudge .7s var(--apple)}
@keyframes nudge{40%{transform:translateX(34px)}}
.slide.ok .knob{background:#fff;color:rgb(var(--blue))}
.slide.ok .knob svg{stroke:rgb(var(--blue))}
.slide.drag .knob{box-shadow:0 10px 22px -4px rgba(0,20,80,.7)}
.edit{width:62px;height:62px;border-radius:50%;flex:none;display:grid;place-items:center;background:#fff;color:rgb(var(--navy));transition:transform .3s var(--spring)}
.edit:active{transform:scale(.88)}
.hero.out{animation:heroout .5s var(--apple) forwards;pointer-events:none}
@keyframes heroout{to{transform:translateX(115%) rotate(7deg);opacity:0}}
.hero.heroin{animation:heroin .8s var(--apple) both}
@keyframes heroin{from{opacity:0;transform:translateY(30px) scale(.9)}to{opacity:1;transform:none}}

/* progress */
.pcard{display:flex;align-items:center;gap:18px;padding:18px;border-radius:30px;margin-bottom:6px}
.ringwrap{position:relative;width:80px;height:80px;flex:none}
.ring{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.rt,.rf{fill:none;stroke-width:7}
.rt{stroke:rgba(11,42,91,.1)}
.rf{stroke-linecap:round;stroke-dasharray:163.4;transition:stroke-dashoffset 1.2s var(--apple)}
.pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;letter-spacing:-.02em}
.pct small{font-size:11px;font-weight:600;color:var(--mu);margin-left:1px}
.pinfo{min-width:0}
.pbig{font-size:20px;font-weight:700;letter-spacing:-.025em}
.pmut{font-size:13.5px;color:var(--mu);margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.streak{display:inline-flex;align-items:center;gap:5px;margin-top:9px;padding:5px 12px 5px 9px;border-radius:99px;font-size:12.5px;font-weight:700;color:var(--tx);background:rgb(var(--lime));transform:rotate(-2deg)}

/* labels */
.lbl{display:flex;align-items:center;gap:8px;margin:26px 2px 12px;font-size:22px;font-weight:700;letter-spacing:-.03em;color:var(--tx)}
.lbl em{font-style:normal;font-weight:600;font-size:13px;color:var(--mu);padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.55);letter-spacing:0}
.warnl{color:#D9402F}
.togl{width:calc(100% - 4px)}
.chev{display:inline-grid;margin-left:auto;transform:rotate(180deg);transition:transform .4s var(--apple)}
.chev.up{transform:rotate(-90deg)}
.link{color:rgb(var(--blue));font-weight:600;font-size:15px;letter-spacing:0;padding:6px 4px}
.lbl .link{margin-left:auto}
.stack{display:flex;flex-direction:column;gap:11px}

/* task card */
.tcard{--c:var(--violet);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:13px;padding:13px 16px 13px 13px;border-radius:26px;position:relative;overflow:hidden;
  background:linear-gradient(rgba(var(--c),.2),rgba(var(--c),.2)),var(--glass);transition:opacity .4s,transform .45s var(--apple),filter .4s}
.tcard.leaving{opacity:.3;transform:translateX(18px) scale(.97)}
.tcard.isdone{opacity:.6}
.tcard.isdone .tt{text-decoration:line-through;text-decoration-color:rgba(11,42,91,.5)}
.tbody{display:flex;flex-direction:column;min-width:0;gap:2px;padding:4px 0;text-align:left}
.tt{font-size:16.5px;font-weight:600;letter-spacing:-.015em;overflow-wrap:anywhere}
.ts{font-size:13px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{flex:none;padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.8);white-space:nowrap}
.pill.warn{color:#D9402F}
.pill.dim{color:var(--mu);font-weight:500}
.tcard:active{transform:scale(.982)}

/* check */
.ck{position:relative;width:30px;height:30px;border-radius:50%;flex:none;border:1.8px solid rgba(var(--navy),.55);background:rgba(255,255,255,.8);transition:background .35s,border-color .35s,transform .4s var(--spring)}
.ck.big{width:42px;height:42px}
.ck svg,.rbox svg,.wd svg{position:absolute;inset:0;width:100%;height:100%;padding:20%;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.cp{stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .45s var(--apple) .05s}
.on>svg .cp,.on svg .cp{stroke-dashoffset:0}
.ck.on{background:rgb(var(--navy));border-color:rgb(var(--navy))}
.ck.pop{animation:pop .55s var(--spring)}
@keyframes pop{40%{transform:scale(1.28)}}

/* routines (habit style) */
.rcard,.rrow{--c:var(--cyan);border-radius:28px;background:linear-gradient(rgba(var(--c),.2),rgba(var(--c),.2)),var(--glass)}
.rcard{padding:16px 16px 8px}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rname{display:flex;flex-direction:column;text-align:left;min-width:0;gap:1px}
.rname b{font-size:17px;font-weight:700;letter-spacing:-.02em}
.rname span{font-size:13px;color:var(--mu)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:14px 0 8px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px}
.wd small{font-size:11.5px;font-weight:500;color:var(--mu)}
.wd i{position:relative;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.9);transition:background .4s}
.wd i.on{background:rgb(var(--navy));animation:pop .55s var(--spring)}
.wd.off{opacity:.4}
.wd.cur small{color:var(--tx);font-weight:700}
.rsteps{display:flex;flex-direction:column}
.rstep{display:flex;align-items:center;gap:12px;padding:11px 0;font-size:15.5px;font-weight:500;text-align:left}
.rstep+.rstep{border-top:1px solid rgba(11,42,91,.08)}
.rstep.on{color:var(--mu);text-decoration:line-through}
.rbox{position:relative;width:24px;height:24px;border-radius:50%;flex:none;border:1.8px solid rgba(var(--navy),.5);background:rgba(255,255,255,.85);transition:background .35s,border-color .35s}
.rstep.on .rbox,.rbox.on{background:rgb(var(--navy));border-color:rgb(var(--navy))}
.rstep.on .rbox .cp{stroke-dashoffset:0}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px}
.bar{height:5px;border-radius:9px;background:rgba(255,255,255,.7);overflow:hidden;margin:10px 0 0}
.bar i{display:block;height:100%;border-radius:9px;background:rgb(var(--blue));transition:width .8s var(--apple)}

/* lists grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lcard{--c:var(--violet);display:flex;flex-direction:column;justify-content:flex-end;gap:2px;min-height:120px;padding:16px;border-radius:28px;text-align:left;background:linear-gradient(150deg,rgba(var(--c),.45),rgba(var(--c),.12)),var(--glass);transition:transform .35s var(--spring)}
.lcard b{font-size:19px;font-weight:700;letter-spacing:-.02em}
.lcard span{font-size:13px;color:var(--mu)}
.lcard .bar{margin:10px 0 0;height:4px}
.lcard:active{transform:scale(.95)}
.lcard.add{align-items:center;justify-content:center;gap:6px;background:transparent;border:1.5px dashed rgba(var(--navy),.3);box-shadow:none;color:var(--mu);font-weight:600}
.alert{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;margin-bottom:6px;border-radius:24px;background:linear-gradient(rgba(var(--coral),.3),rgba(var(--coral),.3)),var(--glass)}
.alert div{display:flex;flex-direction:column;min-width:0}
.alert b{font-size:15.5px}
.alert span{font-size:13px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;padding:38px 20px 20px}
.empty h3{margin:20px 0 6px;font-size:23px;font-weight:700;letter-spacing:-.03em}
.empty p{margin:0 auto 20px;max-width:280px;color:var(--mu);font-size:15px}
.orb{width:96px;height:96px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 32% 26%,#fff9,transparent 38%),radial-gradient(circle at 50% 60%,#4D9CFF,#0560E0 70%);box-shadow:0 26px 36px -14px rgba(5,96,224,.8);animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.allclear{display:flex;align-items:center;justify-content:center;gap:8px;margin:22px 0 4px;padding:14px;border-radius:22px;font-weight:600;background:rgb(var(--lime))}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:99px;font-weight:600;font-size:15.5px;background:rgba(11,42,91,.08);transition:transform .3s var(--spring),background .3s}
.btn:active{transform:scale(.94)}
.btn.glow{color:#fff;background:rgb(var(--blue));box-shadow:0 14px 24px -10px rgba(5,96,224,.9)}
.btn.ghost{background:rgba(11,42,91,.07)}
.btn.plain{background:none;color:var(--mu);font-weight:500}
.btn.sm{min-height:38px;padding:0 16px;font-size:14px}
.btn.big{width:100%;min-height:58px;font-size:17px;margin-top:16px}
.btn.wide{width:100%}
.btn.grow{flex:1}
.btn.danger{color:#D9402F}
.btn.armed{background:#E5453A;color:#fff}
.btnrow{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}

/* bottom nav */
#nav{position:fixed;left:50%;bottom:calc(14px + var(--sab));transform:translateX(-50%);z-index:20;width:min(calc(100% - 28px),440px);display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:99px;background:rgba(255,255,255,.96);border:1px solid #fff;box-shadow:0 12px 26px -12px rgba(10,60,160,.5)}
.tab{display:flex;align-items:center;justify-content:center;gap:7px;height:46px;min-width:46px;padding:0 12px;border-radius:99px;background:rgba(11,42,91,.06);color:var(--tx);font-size:14.5px;font-weight:600;transition:background .45s var(--apple),color .45s,padding .45s var(--apple),transform .3s var(--spring)}
.tab:active{transform:scale(.9)}
.tab span{display:none;white-space:nowrap}
.tab.on{background:rgb(var(--blue));color:#fff;padding:0 16px;box-shadow:0 10px 18px -8px rgba(5,96,224,.9)}
.tab.on span{display:inline;animation:fadein .5s var(--apple)}
@keyframes fadein{from{opacity:0;transform:translateX(-6px)}}
.fab{flex:none;width:58px;height:58px;margin:-24px 4px 0;border-radius:50%;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 34% 26%,#8EC4FF 0,#1D6DF0 36%,#0A2F8C 82%);box-shadow:0 0 0 5px rgba(255,255,255,.95),0 16px 26px -6px rgba(5,60,200,.8),inset 0 2px 6px rgba(255,255,255,.5);transition:transform .4s var(--spring)}
.fab:active{transform:scale(.86)}

/* toast + banner */
#toast{position:fixed;left:50%;bottom:calc(108px + var(--sab));z-index:50;transform:translate(-50%,26px) scale(.92);opacity:0;pointer-events:none;display:flex;align-items:center;gap:14px;max-width:min(calc(100% - 32px),440px);padding:13px 18px;border-radius:99px;font-size:14.5px;font-weight:500;background:#0B2A5B;color:#fff;box-shadow:0 10px 22px -8px rgba(10,40,120,.6);transition:opacity .4s,transform .55s var(--spring)}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
#toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast button{color:#8EC4FF;font-weight:700;padding:2px 4px}
#banner{position:fixed;left:0;right:0;top:calc(10px + var(--sat));z-index:60;display:flex;justify-content:center;padding:0 12px;pointer-events:none;transform:translateY(-150%);transition:transform .7s var(--spring)}
#banner.show{transform:none}
.bn{pointer-events:auto;display:flex;align-items:center;gap:11px;width:100%;max-width:480px;padding:12px;border-radius:30px;background:#fff;box-shadow:0 14px 30px -10px rgba(10,60,160,.5)}
.bi{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(145deg,#6FB4FF,#0560E0);animation:ring 1.4s ease-in-out 3}
@keyframes ring{20%,60%{transform:rotate(14deg)}40%,80%{transform:rotate(-14deg)}}
.bt{display:flex;flex-direction:column;min-width:0;flex:1}
.bt b{font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt span{font-size:12.5px;color:var(--mu)}
.bb{flex:none;padding:8px 13px;border-radius:99px;font-size:13px;font-weight:600;background:rgba(11,42,91,.08)}
.bb.main{background:rgb(var(--blue));color:#fff}
.bb.x{padding:8px;background:none;color:var(--mu)}
#warn .note{margin:0 0 10px;padding:10px 14px;border-radius:16px;font-size:13px;background:rgb(var(--amber))}

/* sheets */
#sheets{position:fixed;inset:0;z-index:40;display:none}
#sheets.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(11,42,91,.4);opacity:0;transition:opacity .4s}
#sheets.show .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;margin:0 auto;width:100%;max-width:520px;bottom:var(--kb);max-height:calc(100dvh - var(--kb) - var(--sat) - 10px);overflow-y:auto;overscroll-behavior:contain;padding:8px 20px calc(24px + var(--sabs));border-radius:36px 36px 0 0;background:#F7FAFF;border:1px solid #fff;border-bottom:0;box-shadow:0 -24px 60px -24px rgba(10,60,160,.55);transform:translateY(100%);transition:transform .6s var(--apple),bottom .3s}
#sheets.show .sheet{transform:none}

/* auth.js: phone-number profile + 4-digit password lock (works offline, no SMS) */
async function pinHash(salt, pin) {
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch (e) { return 'h' + hash(salt + ':' + pin); }
}

/* ----- online account (Supabase) so you can log in again after reinstalling ----- */
const CLOUD = window.TICIC_CLOUD || {};
const cloudOn = () => /^https:\/\/[^ ]+$/.test(CLOUD.url || '') && String(CLOUD.key || '').length > 20;
async function cloudHash(full, pin) {
  try {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(full + ':' + pin), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: new TextEncoder().encode('ticic.v1.' + full), iterations: 60000 }, km, 256);
    return Array.from(new Uint8Array(bits)).map(x => x.toString(16).padStart(2, '0')).join('');
  } catch (e) { return 'h' + hash('ticic.v1.' + full + ':' + pin); }
}
async function cloudCall(fn, body) {
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 15000);
  try {
    const r = await fetch(CLOUD.url.replace(/\/$/, '') + '/rest/v1/rpc/' + fn, { method: 'POST', signal: ctl.signal, headers: { 'Content-Type': 'application/json', apikey: CLOUD.key, Authorization: 'Bearer ' + CLOUD.key }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error('http ' + r.status); return await r.json();
  } finally { clearTimeout(to); }
}
const fullPhone = p => p.cc + p.phone;
function cloudPayload() { const d = JSON.parse(JSON.stringify(S)); ['profile', 'bioOn', 'noLogin', 'lockOn', 'cloudAt'].forEach(k => delete d[k]); return d; }
let cloudT = null, cloudDeny = false;
function cloudPush(now) {
  if (!cloudOn() || !S.profile || !S.profile.ck) return;
  clearTimeout(cloudT);
  cloudT = setTimeout(async () => {
    try {
      const r = await cloudCall('ticic_push', { p_phone: fullPhone(S.profile), p_hash: S.profile.ck, p_data: cloudPayload() });
      if (r === 'denied') { if (!cloudDeny) { cloudDeny = true; toast('Online backup paused. The password was changed elsewhere.'); } }
      else { cloudDeny = false; S.cloudAt = Date.now(); save(); }
    } catch (e) {}
  }, now ? 0 : 4000);
}
