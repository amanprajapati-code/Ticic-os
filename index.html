<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07050F"><meta name="color-scheme" content="dark">
<title>Ticic</title>
<style>:root{
  --bg:#07050F;--tx:#F5F2FF;--mu:rgba(245,242,255,.58);--mu2:rgba(245,242,255,.36);
  --pink:255,95,168;--violet:139,124,255;--cyan:61,217,255;--lime:140,240,90;--amber:255,181,71;--coral:255,122,89;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Roboto,"Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;min-height:100vh;min-height:100dvh;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid rgba(var(--cyan),.9);outline-offset:2px}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* background glow */
.blobs{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
.blobs i:nth-child(1){width:340px;height:340px;background:rgb(var(--violet));left:-120px;top:-80px;animation:drift1 22s ease-in-out infinite alternate}
.blobs i:nth-child(2){width:300px;height:300px;background:rgb(var(--pink));right:-130px;top:26vh;opacity:.4;animation:drift2 26s ease-in-out infinite alternate}
.blobs i:nth-child(3){width:320px;height:320px;background:rgb(var(--cyan));left:-60px;bottom:-120px;opacity:.32;animation:drift3 30s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(90px,120px) scale(1.15)}}
@keyframes drift2{to{transform:translate(-80px,-90px) scale(1.2)}}
@keyframes drift3{to{transform:translate(110px,-70px) scale(.9)}}

#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:calc(18px + var(--sat)) 18px calc(124px + var(--sab))}
#view>*+*{margin-top:0}

/* entry animation */
.anim .rise{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:6px 0 20px}
.date{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
h1{margin:4px 0 0;font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.025em}
h1 .soft{color:var(--mu);font-weight:600;font-size:24px}
.avatar{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px;background:linear-gradient(135deg,rgb(var(--pink)),rgb(var(--violet)));box-shadow:0 0 0 1px rgba(255,255,255,.2) inset,0 8px 28px -4px rgba(var(--pink),.7);transition:transform .25s var(--spring)}
.avatar:active{transform:scale(.9)}
.avatar .dot{position:absolute;top:-1px;right:-1px;width:13px;height:13px;border-radius:50%;background:rgb(var(--amber));border:2px solid var(--bg);box-shadow:0 0 10px rgb(var(--amber));animation:pulse 2s infinite}
@keyframes pulse{50%{transform:scale(1.25);opacity:.7}}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .2s var(--spring)}
.round:active{transform:scale(.88)}
.lh{display:flex;align-items:center;gap:12px}
.ldot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:10px;background:rgb(var(--c));box-shadow:0 0 14px rgb(var(--c))}

/* day strip */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:18px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);transition:transform .25s var(--spring),background .3s,box-shadow .3s}
.day span{font-size:11px;font-weight:600;color:var(--mu);letter-spacing:.04em}
.day b{font-size:18px;font-weight:700}
.day i{width:5px;height:5px;border-radius:50%;background:transparent;transition:background .3s}
.day i.has{background:rgb(var(--cyan));box-shadow:0 0 8px rgb(var(--cyan))}
.day.on{background:linear-gradient(160deg,rgba(var(--violet),.95),rgba(var(--pink),.85));border-color:rgba(255,255,255,.3);box-shadow:0 10px 30px -6px rgba(var(--pink),.65);transform:translateY(-2px)}
.day.on span{color:rgba(255,255,255,.85)}
.day.on i.has{background:#fff;box-shadow:0 0 8px #fff}
.day:active{transform:scale(.92)}

/* glass + progress */
.glass{background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:0 20px 50px -20px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.18)}
.pcard{display:flex;align-items:center;gap:18px;padding:18px;border-radius:28px;margin-bottom:22px}
.ringwrap{position:relative;width:84px;height:84px;flex:none}
.ring{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.rt,.rf{fill:none;stroke-width:6.5}
.rt{stroke:rgba(255,255,255,.1)}
.rf{stroke-linecap:round;stroke-dasharray:163.4;transition:stroke-dashoffset 1.1s var(--ease);filter:drop-shadow(0 0 6px rgba(var(--violet),.9))}
.pct{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:700;letter-spacing:-.02em}
.pct small{font-size:11px;font-weight:600;color:var(--mu);margin-left:1px;align-self:center}
.pct{display:flex;align-items:center;justify-content:center}
.pinfo{min-width:0}
.pbig{font-size:20px;font-weight:700;letter-spacing:-.015em}
.pmut{font-size:13.5px;color:var(--mu);margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.streak{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:4px 10px 4px 8px;border-radius:99px;font-size:12.5px;font-weight:700;color:rgb(var(--amber));background:rgba(var(--amber),.14);border:1px solid rgba(var(--amber),.3);box-shadow:0 0 18px -4px rgba(var(--amber),.7)}

/* labels */
.lbl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 4px 10px;font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mu)}
.lbl em{font-style:normal;font-weight:600;color:var(--mu2);letter-spacing:.02em;text-transform:none}
.warnl{color:rgb(var(--coral))}
.togl{width:calc(100% - 8px)}
.chev{display:inline-grid;transform:rotate(180deg);transition:transform .3s var(--ease)}
.chev.up{transform:rotate(-90deg)}
.link{color:rgb(var(--cyan));font-weight:600;font-size:15px;letter-spacing:0;text-transform:none;padding:6px 4px}
.stack{display:flex;flex-direction:column;gap:11px}

/* task card */
.tcard{--c:var(--violet);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:13px;padding:13px 15px 13px 13px;border-radius:24px;position:relative;overflow:hidden;
  background:linear-gradient(120deg,rgba(var(--c),.26),rgba(var(--c),.07) 65%),rgba(255,255,255,.035);
  border:1px solid rgba(var(--c),.32);box-shadow:0 14px 34px -16px rgba(var(--c),.7),inset 0 1px 0 rgba(255,255,255,.1);
  transition:opacity .35s,transform .35s var(--ease),filter .35s}
.tcard::before{content:"";position:absolute;left:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(var(--c),.35);filter:blur(34px);pointer-events:none}
.tcard>*{position:relative}
.tcard.leaving{opacity:.35;transform:translateX(14px) scale(.98);filter:saturate(.5)}
.tcard.isdone{opacity:.62}
.tcard.isdone .tt{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.4)}
.tbody{display:flex;flex-direction:column;min-width:0;gap:2px;padding:4px 0;text-align:left}
.tt{font-size:16.5px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.ts{font-size:13px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{flex:none;padding:5px 11px;border-radius:99px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);white-space:nowrap}
.pill.warn{color:rgb(var(--coral));background:rgba(var(--coral),.15);border-color:rgba(var(--coral),.4)}
.pill.dim{color:var(--mu);font-weight:600}
.tcard:active{transform:scale(.985)}

/* check */
.ck{--c:var(--violet);position:relative;width:30px;height:30px;border-radius:50%;flex:none;border:2px solid rgba(var(--c),.85);background:rgba(var(--c),.1);box-shadow:0 0 14px -2px rgba(var(--c),.6);transition:background .3s,box-shadow .3s,transform .3s var(--spring)}
.ck.big{width:42px;height:42px}
.ck svg,.rbox svg{position:absolute;inset:0;width:100%;height:100%;padding:18%;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.cp{stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .38s var(--ease) .06s}
.on>svg .cp,.on svg .cp{stroke-dashoffset:0}
.ck.on{background:rgb(var(--c));border-color:rgb(var(--c));box-shadow:0 0 22px rgba(var(--c),.95)}
.ck.pop{animation:pop .5s var(--spring)}
@keyframes pop{40%{transform:scale(1.28)}}
.tcard .ck{--c:inherit}
.tcard .ck{border-color:rgba(var(--c),.9);background:rgba(var(--c),.12)}
.tcard .ck.on{background:rgb(var(--c))}

/* routines */
.rcard,.rrow{--c:var(--pink);border-radius:24px;border:1px solid rgba(var(--c),.32);background:linear-gradient(120deg,rgba(var(--c),.24),rgba(var(--c),.06) 70%),rgba(255,255,255,.035);box-shadow:0 14px 34px -16px rgba(var(--c),.7),inset 0 1px 0 rgba(255,255,255,.1)}
.rcard{padding:15px 16px 10px}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rname{display:flex;flex-direction:column;text-align:left;min-width:0;gap:1px}
.rname b{font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.rname span{font-size:13px;color:var(--mu)}
.bar{height:5px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,rgba(var(--c),.7),rgb(var(--c)));box-shadow:0 0 12px rgb(var(--c));transition:width .7s var(--ease)}
.rsteps{display:flex;flex-direction:column}
.rstep{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:15.5px;font-weight:500;text-align:left;transition:color .3s}
.rstep+.rstep{border-top:1px solid rgba(255,255,255,.07)}
.rstep.on{color:var(--mu);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.35)}
.rbox{position:relative;width:24px;height:24px;border-radius:50%;flex:none;border:2px solid rgba(var(--c,var(--violet)),.8);background:transparent;transition:background .3s,box-shadow .3s}
.rcard .rbox{border-color:rgba(var(--c),.85)}
.rstep.on .rbox,.rbox.on{background:rgb(var(--c,var(--violet)));border-color:rgb(var(--c,var(--violet)));box-shadow:0 0 16px rgba(var(--c,var(--violet)),.9)}
.rstep.on .rbox .cp{stroke-dashoffset:0}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px}

/* lists grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lcard{--c:var(--violet);display:flex;flex-direction:column;justify-content:flex-end;gap:2px;min-height:118px;padding:16px;border-radius:26px;text-align:left;position:relative;overflow:hidden;border:1px solid rgba(var(--c),.34);
  background:linear-gradient(150deg,rgba(var(--c),.34),rgba(var(--c),.07) 75%),rgba(255,255,255,.03);box-shadow:0 16px 36px -16px rgba(var(--c),.8),inset 0 1px 0 rgba(255,255,255,.12);transition:transform .25s var(--spring)}
.lcard::before{content:"";position:absolute;right:-26px;top:-26px;width:100px;height:100px;border-radius:50%;background:rgba(var(--c),.5);filter:blur(30px)}
.lcard>*{position:relative}
.lcard b{font-size:18px;font-weight:700;letter-spacing:-.01em}
.lcard span{font-size:13px;color:var(--mu)}
.lcard .bar{margin:10px 0 0;height:4px}
.lcard:active{transform:scale(.95)}
.lcard.add{align-items:center;justify-content:center;gap:6px;border:1.5px dashed rgba(255,255,255,.25);background:rgba(255,255,255,.03);box-shadow:none;color:var(--mu);font-weight:600}
.lcard.add::before{display:none}

/* upcoming alert, empty, all-clear */
.alert{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;margin-bottom:6px;border-radius:22px;background:linear-gradient(120deg,rgba(var(--coral),.28),rgba(var(--coral),.07));border:1px solid rgba(var(--coral),.4);box-shadow:0 14px 34px -16px rgba(var(--coral),.8)}
.alert div{display:flex;flex-direction:column;min-width:0}
.alert b{font-size:15.5px}
.alert span{font-size:13px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;padding:38px 20px 20px}
.empty h3{margin:20px 0 6px;font-size:22px;letter-spacing:-.02em}
.empty p{margin:0 auto 20px;max-width:280px;color:var(--mu);font-size:15px}
.orb{width:92px;height:92px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff8,transparent 40%),linear-gradient(135deg,rgb(var(--pink)),rgb(var(--violet)) 55%,rgb(var(--cyan)));box-shadow:0 0 60px rgba(var(--violet),.8),0 0 120px rgba(var(--pink),.35);animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) scale(1.04)}}
.allclear{display:flex;align-items:center;justify-content:center;gap:8px;margin:26px 0 4px;padding:13px;border-radius:20px;font-weight:600;color:rgb(var(--lime));background:rgba(var(--lime),.1);border:1px solid rgba(var(--lime),.28);box-shadow:0 0 30px -8px rgba(var(--lime),.6)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:99px;font-weight:700;font-size:15.5px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);transition:transform .2s var(--spring),box-shadow .3s,background .3s}
.btn:active{transform:scale(.94)}
.btn.glow{border:0;color:#fff;background:linear-gradient(120deg,rgb(var(--pink)),rgb(var(--violet)) 60%,rgb(var(--cyan)) 140%);background-size:160% 100%;box-shadow:0 12px 34px -8px rgba(var(--pink),.75),0 0 0 1px rgba(255,255,255,.18) inset;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.btn.ghost{background:rgba(255,255,255,.05)}
.btn.plain{background:none;border:0;color:var(--mu);font-weight:600}
.btn.sm{min-height:38px;padding:0 15px;font-size:14px}
.btn.big{width:100%;min-height:56px;font-size:17px;margin-top:16px}
.btn.wide{width:100%}
.btn.grow{flex:1}
.btn.danger{color:rgb(var(--coral))}
.btn.armed{background:rgb(var(--coral));color:#fff;border-color:transparent;box-shadow:0 0 28px rgba(var(--coral),.8)}
.btnrow{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}

/* bottom nav */
#nav{position:fixed;left:50%;bottom:calc(14px + var(--sab));transform:translateX(-50%);z-index:20;width:min(calc(100% - 28px),440px);display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:center;padding:8px 6px;border-radius:34px;
  background:linear-gradient(145deg,rgba(40,30,80,.72),rgba(18,12,38,.8));border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);box-shadow:0 22px 50px -10px rgba(0,0,0,.8),0 0 40px -12px rgba(var(--violet),.6),inset 0 1px 0 rgba(255,255,255,.16)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--mu2);transition:color .3s,transform .25s var(--spring)}
.tab:active{transform:scale(.88)}
.tab.on{color:#fff}
.tab.on .ic{filter:drop-shadow(0 0 8px rgb(var(--pink))) drop-shadow(0 0 14px rgba(var(--violet),.9))}
.tab.on span{text-shadow:0 0 12px rgba(var(--pink),.8)}
.fab{justify-self:center;width:58px;height:58px;margin-top:-30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,rgb(var(--pink)),rgb(var(--violet)) 60%,rgb(var(--cyan)) 150%);box-shadow:0 0 0 5px rgba(7,5,15,.9),0 14px 36px -4px rgba(var(--pink),.85),0 0 50px rgba(var(--violet),.6);transition:transform .3s var(--spring);animation:glowpulse 3.4s ease-in-out infinite}
.fab:active{transform:scale(.88) rotate(90deg)}
@keyframes glowpulse{50%{box-shadow:0 0 0 5px rgba(7,5,15,.9),0 14px 44px 0 rgba(var(--pink),1),0 0 70px rgba(var(--cyan),.5)}}

/* toast + banner */
#toast{position:fixed;left:50%;bottom:calc(112px + var(--sab));z-index:50;transform:translate(-50%,24px) scale(.94);opacity:0;pointer-events:none;display:flex;align-items:center;gap:14px;max-width:min(calc(100% - 32px),440px);padding:12px 16px;border-radius:99px;font-size:14.5px;font-weight:600;background:rgba(32,24,62,.92);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 16px 40px -8px rgba(0,0,0,.8),0 0 30px -8px rgba(var(--violet),.7);transition:opacity .35s,transform .45s var(--spring)}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
#toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast button{color:rgb(var(--cyan));font-weight:700;padding:2px 4px}
#banner{position:fixed;left:0;right:0;top:calc(10px + var(--sat));z-index:60;display:flex;justify-content:center;padding:0 12px;pointer-events:none;transform:translateY(-140%);transition:transform .6s var(--spring)}
#banner.show{transform:none}
.bn{pointer-events:auto;display:flex;align-items:center;gap:11px;width:100%;max-width:480px;padding:12px;border-radius:26px;background:linear-gradient(135deg,rgba(60,40,120,.92),rgba(30,18,64,.94));border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);box-shadow:0 22px 50px -10px rgba(0,0,0,.85),0 0 46px -6px rgba(var(--pink),.7)}
.bi{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,rgb(var(--pink)),rgb(var(--violet)));box-shadow:0 0 22px rgba(var(--pink),.8);animation:ring 1.4s ease-in-out 3}
@keyframes ring{20%,60%{transform:rotate(14deg)}40%,80%{transform:rotate(-14deg)}}
.bt{display:flex;flex-direction:column;min-width:0;flex:1}
.bt b{font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt span{font-size:12.5px;color:var(--mu)}
.bb{flex:none;padding:8px 12px;border-radius:99px;font-size:13px;font-weight:700;background:rgba(255,255,255,.12)}
.bb.main{background:linear-gradient(120deg,rgb(var(--pink)),rgb(var(--violet)));box-shadow:0 0 18px -2px rgba(var(--pink),.8)}
.bb.x{padding:8px;background:none;color:var(--mu)}
#warn .note{margin:0 0 10px;padding:10px 14px;border-radius:16px;font-size:13px;background:rgba(var(--amber),.12);border:1px solid rgba(var(--amber),.35);color:rgb(var(--amber))}

/* sheets */
#sheets{position:fixed;inset:0;z-index:40;display:none}
#sheets.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(3,2,10,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .3s}
#sheets.show .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;margin:0 auto;bottom:0;width:100%;max-width:520px;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;padding:8px 20px calc(24px + var(--sab));border-radius:34px 34px 0 0;
  background:linear-gradient(180deg,rgba(40,30,82,.96),rgba(14,10,30,.98) 40%);border:1px solid rgba(255,255,255,.14);border-bottom:0;box-shadow:0 -24px 80px -10px rgba(var(--violet),.55),inset 0 1px 0 rgba(255,255,255,.2);

let syncT = 0, busy = false, lastRender = Date.now();
function syncNow() { return NAT.sync(buildSchedule(new Date())); }
function commit() {
  save(); render(); lastRender = Date.now();
  clearTimeout(syncT); syncT = setTimeout(syncNow, 350);
}
const num = v => (v !== '' && !isNaN(Number(v)) ? Number(v) : v);

/* ---------- completion ---------- */
function completeTask(t, quiet) {
  const before = JSON.stringify(t), hl = S.history.length;
  t.snoozeUntil = null;
  if (t.repeat && t.repeat !== 'none') {
    S.history.push({ date: today(), title: t.title, list: t.list, at: nowStamp() });
    t.due = nextAfterDone(t);
    if (!quiet) toast('Done. Next: ' + relDay(t.due), () => undoComplete(t.id, before, hl));
  } else {
    t.done = true; t.doneAt = nowStamp();
    if (!quiet) toast('Done: ' + t.title, () => undoComplete(t.id, before, hl));
  }
}
function undoComplete(id, before, hl) {
  const i = S.tasks.findIndex(t => t.id === id); if (i < 0) return;
  S.tasks[i] = JSON.parse(before); S.history.length = Math.min(S.history.length, hl); commit();
}
function uncomplete(t) { t.done = false; t.doneAt = null; }
function snooze(id) {
  const t = taskById(id); if (!t) return;
  t.snoozeUntil = new Date(Date.now() + 10 * 60000).toISOString(); commit(); toast('Snoozed for 10 minutes');
}
function arm(el, label) {
  if (el.dataset.armed) return true;
  el.dataset.armed = '1'; el._t = el.textContent; el.textContent = label; el.classList.add('armed');
  setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.textContent = el._t; el.classList.remove('armed'); } }, 3000);
  return false;
}
function chipSelect(el) { $$('.chip', el.parentNode).forEach(c => { c.classList.toggle('on', c === el); c.setAttribute('aria-pressed', c === el); }); }
function shake(sel) { const b = $(sel); if (!b) return; b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); const i = $('input', b); if (i) i.focus(); }
async function copyText(txt, ta) {
  try { await navigator.clipboard.writeText(txt); return true; } catch (e) { try { ta.focus(); ta.select(); return document.execCommand('copy'); } catch (e2) { return false; } }
}

/* ---------- examples ---------- */
function addExamples() {
  const now = new Date(), td = today(), at = new Date(now.getTime() + 2 * 60000);
  const hm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
  const slot = (h, m) => { const t = pad(h) + ':' + pad(m); return atTime(td, t) > now ? [td, t] : [addDays(td, 1), t]; };
  let seq = 0;
  const mk = (title, o) => Object.assign({ id: uid(), title, note: '', due: td, time: null, remind: 'morning', repeat: 'none', nudge: true, list: 'inbox', steps: [], done: false, created: Date.now() + (seq++) }, o);
  const v = slot(20, 0), c = slot(20, 30);
  S.tasks.push(
    mk('Try your first reminder', { due: iso(at), time: hm(at), remind: 0, nudge: false, list: 'inbox' }),
    mk('Take vitamins', { due: v[0], time: v[1], remind: 0, repeat: 'daily', list: 'health' }),
    mk('Call mom', { due: c[0], time: c[1], remind: 10, list: 'family' }),
    mk('Pay electricity bill', { due: addDays(td, 2), list: 'bills', steps: [{ id: uid(), t: 'Find the bill', done: false }, { id: uid(), t: 'Pay in the app', done: false }] }),
    mk('Buy milk and eggs', { remind: 'none', list: 'groceries' })
  );
  if (!S.routines.length) S.routines.push({ id: uid(), name: 'Morning routine', time: '07:00', days: [0, 1, 2, 3, 4, 5, 6], on: true, c: 'amber', log: {},
    steps: ['Drink a glass of water', 'Stretch for 5 minutes', 'Plan the day'].map(t => ({ id: uid(), t })) });
}

/* ---------- task detail helpers ---------- */
function tdTask() { return TD && taskById(TD.id); }
function tdMeta(t) { const s = $('.tdtitle span'); if (s) s.textContent = listOf(t.list).name + ' · ' + (t.due ? relDay(t.due) + (t.time ? ', ' + fmtTime(t.time) : '') : 'No date'); const h = $('.tdhead'); if (h) h.style.setProperty('--c', rgbOf(t)); }
function tdFlush() {
  const t = tdTask(); if (!t || !$('#td-title')) return;
  const ti = $('#td-title').value.trim(); if (ti) t.title = ti;
  t.note = $('#td-note').value;
  const du = $('#td-due').value || null, tm = $('#td-time').value || null;
  if (du !== t.due || tm !== t.time) t.snoozeUntil = null;
  t.due = du; t.time = tm;
  if (t.repeat !== 'none' && !t.due) t.due = today();
  save();
}
function settingsFlush() {
  const n = $('#s-name'); if (!n) return;
  S.name = n.value.trim(); const m = $('#s-morning'); if (m && m.value) S.settings.morning = m.value; save();
}
function closeAll() {
  if (V.sheet && V.sheet.indexOf('task:') === 0) { tdFlush(); commit(); }
  else if (V.sheet === 'settings') { settingsFlush(); commit(); }
  closeSheet();
}

/* ---------- onboarding ---------- */
async function finishOnboarding(ask) {
  const n = $('#o-name'); S.name = n ? n.value.trim() : '';
  S.onboarded = true;
  if (!S.tasks.length) addExamples();
  closeOnboarding(); commit();
  if (ask) { const s = await NAT.ask(); NAT_state = V.notif = s; render(); if (s === 'granted') { syncNow(); toast('Reminders are on'); } else if (s === 'denied') toast('Reminders are blocked in phone settings'); }
}

/* ---------- actions ---------- */
const ACT = {
  toggle(el) {
    const t = taskById(el.dataset.id); if (!t || busy) return;
    if (t.done) { uncomplete(t); commit(); return; }
    busy = true; el.classList.add('on', 'pop');
    const c = el.closest('.tcard'); if (c) c.classList.add('leaving');
    setTimeout(() => { busy = false; completeTask(t); commit(); }, 360);
  },
  open(el) { openTask(el.dataset.id); },
  add() { openQuickAdd(); },
  settings() { openSettings(); },
  day(el) { V.day = el.dataset.d; V.anim = true; render(); },
  'toggle-done'() { V.showDone = !V.showDone; render(); },
  'move-overdue'() { const td = today(); let n = 0; S.tasks.forEach(t => { if (!t.done && t.due && t.due < td) { t.due = td; n++; } }); commit(); toast('Moved ' + n + ' to today'); },
  'list-open'(el) { go('list', el.dataset.id); },
  'list-new'() { openListSheet(); },
  'list-edit'(el) { openListSheet(el.dataset.id); },
  'list-clear'(el) {
    const id = el.dataset.id, gone = S.tasks.filter(t => t.list === id && t.done);
    S.tasks = S.tasks.filter(t => !(t.list === id && t.done)); commit();
    toast('Cleared ' + gone.length, () => { S.tasks = S.tasks.concat(gone); commit(); });
  },
  back() { go('lists'); },
  'routine-new'() { openRoutine(); },
  'routine-edit'(el) { openRoutine(el.dataset.id); },
  'routine-toggle'(el) { const r = S.routines.find(x => x.id === el.dataset.id); if (r) { r.on = !r.on; commit(); } },
  rstep(el) {
    const r = S.routines.find(x => x.id === el.dataset.id); if (!r) return;
    r.log = r.log || {}; const l = r.log[el.dataset.d] = r.log[el.dataset.d] || [], s = el.dataset.s, i = l.indexOf(s);
    if (i < 0) l.push(s); else l.splice(i, 1);
    commit();
  },
  undo() { const t = $('#toast'), f = t._undo; t._undo = null; t.classList.remove('show'); if (f) f(); },
  'b-done'(el) { const t = taskById(el.dataset.id); $('#banner').classList.remove('show'); if (t && !t.done) { completeTask(t); commit(); } },
  'b-snooze'(el) { $('#banner').classList.remove('show'); snooze(el.dataset.id); },
  'b-open'() { $('#banner').classList.remove('show'); V.day = today(); go('today'); },
  'b-close'() { $('#banner').classList.remove('show'); },
  'sheet-close'() { closeAll(); },
  /* quick add */
  'qa-set'(el) {
    const f = el.dataset.f, v = el.dataset.v, m = QA.manual, td = today();
    if (f === 'due') m.due = v === 'today' ? td : v === 'tomorrow' ? addDays(td, 1) : v === 'weekend' ? nextDow('sat') : null;
    else if (f === 'time') m.time = v || null;
    else if (f === 'repeat') m.repeat = v;
    else if (f === 'remind') m.remind = num(v);
    else if (f === 'list') m.list = v;
    qaForce();
  },
  'qa-more'() { QA.more = !QA.more; const o = $('#qa-opts'); o.hidden = !QA.more; if (QA.more) o.innerHTML = qaOpts(qaEff()); qaRefresh(); },
  /* task detail */
  'td-set'(el) {
    const t = tdTask(); if (!t) return; const f = el.dataset.f, v = el.dataset.v;
    t[f] = f === 'remind' ? num(v) : v;
    if (f === 'repeat' && v !== 'none' && !t.due) { t.due = today(); $('#td-due').value = t.due; }
    tdChips(t); tdMeta(t); commit();
  },
  'td-toggle'() { ACT['td-done'](); },
  'td-done'() {
    const t = tdTask(); if (!t) return; tdFlush();
    if (t.done) uncomplete(t); else completeTask(t);
    closeSheet(); commit();
  },
  'td-delete'(el) {
    const t = tdTask(); if (!t) return; if (!arm(el, 'Tap again to delete')) return;
    const i = S.tasks.indexOf(t); S.tasks.splice(i, 1); TD = null; closeSheet(); commit();
    toast('Deleted', () => { S.tasks.splice(Math.min(i, S.tasks.length), 0, t); commit(); });
  },
  'td-nudge'(el) { const t = tdTask(); if (!t) return; t.nudge = !t.nudge; el.classList.toggle('on', t.nudge); el.setAttribute('aria-checked', t.nudge); commit(); },
  'step-toggle'(el) { const t = tdTask(); if (!t) return; const s = t.steps.find(x => x.id === el.dataset.s); if (s) s.done = !s.done; $('#td-steps').innerHTML = TD.stepsHtml(); commit(); },
  'step-del'(el) { const t = tdTask(); if (!t) return; t.steps = t.steps.filter(x => x.id !== el.dataset.s); $('#td-steps').innerHTML = TD.stepsHtml(); commit(); },
  /* settings */
  async 's-enable'() { const s = await NAT.ask(); NAT_state = V.notif = s; if (s === 'granted') { await syncNow(); toast('Reminders are on'); } settingsStatus(); },
  async 's-test'() { const ok = await NAT.test(); toast(ok ? 'Test arrives in 5 seconds. You can close the app.' : 'Could not schedule a test'); },
  's-nudge'(el) { S.settings.nudge = !S.settings.nudge; el.classList.toggle('on', S.settings.nudge); el.setAttribute('aria-checked', S.settings.nudge); commit(); },
  's-set'(el) { S.settings[el.dataset.f] = Number(el.dataset.v); chipSelect(el); commit(); },
  async 's-export'() {
    const d = $('#s-data'); d.innerHTML = '<p class="hint">Copy this text and keep it somewhere safe, like a note to yourself.</p><textarea id="s-json" rows="5" readonly></textarea><button type="button" class="btn ghost sm" data-act="s-copy">Copy again</button>';
    const ta = $('#s-json'); ta.value = JSON.stringify(S); toast((await copyText(ta.value, ta)) ? 'Copied backup' : 'Select the text and copy it');
  },
  async 's-copy'() { const ta = $('#s-json'); toast((await copyText(ta.value, ta)) ? 'Copied' : 'Select the text and copy it'); },
  's-import'() { $('#s-data').innerHTML = '<p class="hint">Paste a backup you copied earlier. This replaces what is on this phone.</p><textarea id="s-json" rows="5" placeholder="Paste backup here"></textarea><button type="button" class="btn glow sm" data-act="s-restore">Restore</button>'; $('#s-json').focus(); },
  's-restore'(el) {
    let d; try { d = JSON.parse($('#s-json').value); if (!d || !Array.isArray(d.tasks)) throw 0; } catch (e) { toast('That does not look like a backup'); return; }
    if (!arm(el, 'Tap again to replace')) return;
    S = Object.assign(freshState(), d); S.settings = Object.assign(freshState().settings, d.settings || {}); S.onboarded = true;
    commit(); closeSheet(); toast('Restored ' + S.tasks.length + ' tasks');
  },
  's-examples'() { addExamples(); commit(); closeSheet(); toast('Added examples'); },
  's-erase'(el) { if (!arm(el, 'Tap again to erase')) return; const n = S.name; S = freshState(); S.name = n; S.onboarded = true; commit(); closeSheet(); toast('Everything erased'); },
  /* routines */
  'r-day'(el) { const n = Number(el.dataset.v), i = RF.days.indexOf(n); if (i < 0) RF.days.push(n); else RF.days.splice(i, 1); rRefresh(); },
  'r-stepdel'(el) { RF.steps = RF.steps.filter(s => s.id !== el.dataset.s); rRefresh(); },
  'r-save'() {
    const n = $('#r-name').value.trim(); if (!n) { shake('.fld.full'); return; }
    RF.name = n; RF.time = $('#r-time').value || '07:00';
    const isNew = RF.isNew; delete RF.isNew;
    if (isNew) S.routines.push(RF); else { const i = S.routines.findIndex(r => r.id === RF.id); if (i >= 0) S.routines[i] = RF; }
    commit(); closeSheet(); toast('Saved ' + RF.name);
  },
  'r-delete'(el) { if (!arm(el, 'Tap again to delete')) return; S.routines = S.routines.filter(r => r.id !== RF.id); commit(); closeSheet(); },
  /* lists */
  'l-col'(el) { LF.c = el.dataset.v; lRefresh(); },
  'l-save'() {
    const n = $('#l-name').value.trim(); if (!n) { shake('.fld.full'); return; }
    LF.name = n;
    if (LF.isNew) { delete LF.isNew; S.lists.push(LF); } else { const l = S.lists.find(x => x.id === LF.id); if (l) { l.name = LF.name; l.c = LF.c; } }
    commit(); closeSheet();
  },
  'l-delete'(el) {
    if (!arm(el, 'Tap again to delete')) return;
    S.tasks.forEach(t => { if (t.list === LF.id) t.list = 'inbox'; });
    S.lists = S.lists.filter(l => l.id !== LF.id); closeSheet();
    if (V.view === 'list') go('lists'); else commit();
    commit();
  },
  /* onboarding */
  'o-enable'() { finishOnboarding(true); },
  'o-skip'() { finishOnboarding(false); },
  reload() { location.reload(); }
};
function qaForce() { const o = $('#qa-opts'); if (o && QA.more) o.innerHTML = qaOpts(qaEff()); qaRefresh(); }

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { V.day = today(); go(tab.dataset.tab); return; }
  const el = e.target.closest('[data-act]');
  if (el && ACT[el.dataset.act]) { e.preventDefault(); ACT[el.dataset.act](el, e); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'qa-in' && QA) { QA.text = e.target.value; qaRefresh(); }
});
document.addEventListener('change', e => {
  const id = e.target.id, v = e.target.value;
  if (id === 'qa-date' && QA) { QA.manual.due = v || null; qaForce(); }
  else if (id === 'qa-time' && QA) { QA.manual.time = v || null; qaForce(); }
  else if (/^td-(title|due|time|note)$/.test(id)) { const t = tdTask(); if (t) { tdFlush(); tdMeta(t); commit(); tdChips(t); } }
  else if (id === 's-name' || id === 's-morning') { settingsFlush(); commit(); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.closest('form[data-form]'); if (!f) return;
  const kind = f.dataset.form, inp = $('input[type=text]', f), val = inp ? inp.value.trim() : '';
  if (kind === 'qa') return qaSubmit();
  if (!val) return;
  if (kind === 'listadd') {
    const p = parseQuick(val), due = p.due, tm = p.time;
    if (!p.title) return;
    S.tasks.push({ id: uid(), title: p.title, note: '', due, time: tm, remind: p.remind != null ? p.remind : (due ? (tm ? 0 : 'morning') : 'none'), repeat: p.repeat || 'none', nudge: true, list: f.dataset.id, steps: [], done: false, created: Date.now() });
    commit(); const n = $('#la'); if (n) n.focus();
  } else if (kind === 'stepadd') {
    const t = tdTask(); if (!t) return;
    t.steps.push({ id: uid(), t: val, done: false }); $('#td-steps').innerHTML = TD.stepsHtml(); inp.value = ''; inp.focus(); commit();
  } else if (kind === 'rstepadd') {
    RF.steps.push({ id: uid(), t: val }); inp.value = ''; rRefresh(); inp.focus();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && V.sheet) closeAll(); });

/* ---------- ticker: in-app banners ---------- */
function tick() {
  const now = new Date();
  if (V.view === 'today' && V.day < today() && !V.sheet) { V.day = today(); render(); }
  const items = buildSchedule(new Date(now.getTime() - 60 * 60000), 1).filter(i => i.at <= now && !fired[i.key]);
  if (items.length) {
    markFired(items.map(i => i.key));
    const last = items[items.length - 1];
    showBanner(last); NAT.show(last);
    if (items.length > 1) setTimeout(() => toast('+' + (items.length - 1) + ' more reminders'), 600);
    lastRender = 0;
  }
  const a = document.activeElement, typing = a && /^(INPUT|TEXTAREA)$/.test(a.tagName);
  if (Date.now() - lastRender > 60000 && !V.sheet && !typing && !busy) { render(); lastRender = Date.now(); }
}

/* ---------- native hooks ---------- */
function onNative(ev) {
  const x = (ev && ev.notification && ev.notification.extra) || {}, id = x.taskId, t = id && taskById(id);
  V.day = today();
  if (ev.actionId === 'done' && t) { if (!t.done) { completeTask(t); commit(); } }
  else if (ev.actionId === 'snooze' && t) snooze(id);
  else if (t) { go('today'); openTask(id); }
  else go('today');
}
function nativeChrome() {
  const P = NAT.plugins || {};
  try { P.StatusBar && P.StatusBar.setStyle({ style: 'DARK' }); P.StatusBar && P.StatusBar.setBackgroundColor({ color: '#07050F' }); } catch (e) {}
  try {
    P.App && P.App.addListener('backButton', () => {
      if (V.sheet) closeAll();
      else if ($('#onb').classList.contains('on')) return;
      else if (V.view === 'list') go('lists');
      else if (V.view !== 'today') go('today');
      else P.App.exitApp();
    });
    P.App && P.App.addListener('appStateChange', s => { if (s.isActive) { syncNow(); tick(); } });
  } catch (e) {}
}

/* ---------- boot ---------- */
function boot() {
  load(); V.day = today(); V.anim = true;
  render();
  NAT.init(onNative); nativeChrome();
  NAT.status().then(s => { NAT_state = V.notif = s; render(); if (s === 'granted') syncNow(); });
  if (!S.onboarded) openOnboarding();
  tick(); setInterval(tick, 5000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); syncNow(); } });
  window.__ticic = { S: () => S, tick, buildSchedule, parseQuick, commit, NAT, V, ACT, fired: () => fired };
}
boot();

})();</script>
