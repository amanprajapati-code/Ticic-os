/* drag to reschedule (desktop) */
(function(){
  let drag = null;
  document.addEventListener('dragstart',e=>{
    const b = e.target.closest && e.target.closest('.tt-blk'); if(!b) return;
    drag = {id:b.dataset.id,off:e.clientY-b.getBoundingClientRect().top};
    try{ e.dataTransfer.setData('text/plain',drag.id); e.dataTransfer.effectAllowed = 'move'; }catch(x){}
  });
  document.addEventListener('dragover',e=>{ const c = e.target.closest && e.target.closest('.tt-col'); if(!c||!drag) return; e.preventDefault(); document.querySelectorAll('.tt-col.over').forEach(x=>{ if(x!==c) x.classList.remove('over'); }); c.classList.add('over'); });
  document.addEventListener('dragend',()=>{ drag = null; document.querySelectorAll('.tt-col.over').forEach(x=>x.classList.remove('over')); });
  document.addEventListener('drop',e=>{
    const col = e.target.closest && e.target.closest('.tt-col'); if(!col||!drag) return; e.preventDefault();
    const c = S.get('classes',drag.id); const gs = +col.dataset.gs; col.classList.remove('over');
    const y = e.clientY - col.getBoundingClientRect().top - drag.off;
    let start = Math.round((gs*60 + y/TT_HH*60)/15)*15; const dur = D.mins(c.end)-D.mins(c.start);
    start = T.clamp(start,0,1440-dur); const day = +col.dataset.day; drag = null;
    const clash = Q.classes().find(x=>x.id!==c.id && x.day===day && D.mins(x.start)<start+dur && D.mins(x.end)>start);
    if(clash){ UI.toast('That slot overlaps with '+Q.classTitle(clash)+'.'); return; }
    S.upd('classes',c.id,{day,start:D.hhmm(start),end:D.hhmm(start+dur)}); UI.toast('Moved to '+D.DAYS[day]+' '+D.time(D.hhmm(start)));
  });
})();

      +(recs.length?recs.slice(0,40).map(r=>'<button type="button" class="rowline" style="width:100%;border:0;border-top:1px solid var(--line-soft);background:none;text-align:left" data-act="att-edit" data-id="'+esc(r.id)+'"><span class="mono muted" style="width:64px;font-size:12px">'+esc(D.short(r.date))+'</span><span style="flex:1;font-weight:500;font-size:14px">'+esc(Q.subjName(r.subjectId,true))+'</span>'+UI.chip(r.status==='present'?'Present':'Absent',r.status==='present'?'ok':'bad')+'</button>').join('')+(recs.length>40?'<p class="muted" style="font-size:12px;margin-top:8px">Showing the latest 40 of '+recs.length+'.</p>':''):UI.empty({title:'No records yet',text:'Mark a class above or add a past class.'}))+'</section>';
    return mark+'<div class="grid">'+cards+'</div>'+charts+hist;

    const c1 = V.barChart(days.map((d,i)=>({label:lbl(d,i),v:doneCounts[i],hi:d===today})),{label:'Tasks completed per day'});

    const subs = Q.subjects();
    const c3 = subs.length ? V.barChart(subs.map(s=>({label:(s.short||s.name).slice(0,6),v:Math.round(Q.attStats(s.id).pct||0)})),{max:100,target:st().attTarget,targetLabel:'Target '+st().attTarget+'%',label:'Attendance by subject'}) : UI.empty({title:'No subjects',text:'Add subjects to see attendance.'});

/* views4.js: Plan My Day (rule-based), Settings, onboarding */
(function(){
const T = window.T, S = T.S, Q = T.Q, D = T.D, UI = T.UI, V = T.V, A = T.A, esc = T.esc, icon = T.icon;
const st = () => S.d.settings;

/* =========================================================
   Plan My Day: a transparent rule-based planner (no AI).
   1. Find free gaps between classes, lunch and timed tasks.
   2. Score open work: priority, overdue/due-today, assignments due soon, exams coming up.
   3. Place highest score first into the earliest gap that fits, with a 10 minute breather.
   ========================================================= */
const RANK = {urgent:4,high:3,medium:2,low:1};
T.vs.plan = {date:D.today(), left:[]};

V.buildPlan = function(date){
  const s = st(), today = D.today();
  let from = D.mins(s.dayStart||'08:00'), to = D.mins(s.dayEnd||'21:00');
  if(date===today) from = Math.max(from, Math.ceil(D.nowMin()/5)*5);
  const fixed = V.schedule(date).filter(i=>i.k!=='plan');
  const busy = fixed.map(i=>[D.mins(i.start),D.mins(i.end)]).sort((a,b)=>a[0]-b[0]);
  let gaps = [], cur = from;
  busy.forEach(b=>{ if(b[0]>cur) gaps.push([cur,Math.min(b[0],to)]); cur = Math.max(cur,b[1]); });
  if(cur<to) gaps.push([cur,to]);
  gaps = gaps.filter(g=>g[1]-g[0]>=20);
  const free = T.sum(gaps,g=>g[1]-g[0]);

  const cands = [];
  Q.open().filter(t=>!t.time).forEach(t=>{
    const r = RANK[t.priority]||2, soon = t.due && t.due>date && D.diff(date,t.due)<=2;
    const odue = t.due && t.due<date, tod = t.due===date;
    if(!(odue || tod || (soon && r>=3) || (!t.due && r>=3))) return;
    cands.push({kind:'task',title:t.title,dur:T.clamp(t.estimate||30,15,90),score:r*10+(odue?30:tod?25:soon?12:0),ref:{type:'task',id:t.id}});
  });
  S.d.assignments.forEach(a=>{
    if(['submitted','completed'].includes(a.status)) return;
    const n = D.diff(date,a.due); if(n>3) return;
    cands.push({kind:'study',title:'Work on '+a.title,dur:60,score:(n<0?55:45-n*5),ref:{type:'assignment',id:a.id}});
  });
  S.d.exams.forEach(e=>{
    const n = D.diff(date,e.date); if(n<0 || n>10) return;
    const topic = (e.units||[]).flatMap(u=>u.topics).find(t=>!t.done);
    const label = 'Revise '+(Q.subjName(e.subjectId,true)||e.name)+(topic?': '+topic.title:'');
    for(let i=0;i<(n<=3?2:1);i++) cands.push({kind:'study',title:label,dur:45,score:38-n*2-i*3,ref:{type:'exam',id:e.id}});
  });
  cands.sort((a,b)=>b.score-a.score);

  const cap = Math.round((s.studyTarget||4)*60); let studyMin = 0;
  const blocks = [], left = [];
  cands.forEach(c=>{
    if(c.kind==='study' && studyMin+c.dur>cap){ left.push(c.title); return; }
    const g = gaps.find(x=>x[1]-x[0]>=c.dur);
    if(!g){ left.push(c.title); return; }
    blocks.push({id:T.uid('pl'),kind:c.kind,title:c.title,start:D.hhmm(g[0]),end:D.hhmm(g[0]+c.dur),ref:c.ref,done:false});
    g[0] += c.dur+10;
    if(c.kind==='study') studyMin += c.dur;
  });
  blocks.sort((a,b)=>D.mins(a.start)-D.mins(b.start));
  return {blocks,left,free};
};

const blockDone = b => (b.ref && b.ref.type==='task') ? !!(S.get('tasks',b.ref.id)||{}).done : !!b.done;
const planOf = date => (S.d.plans[date]||[]).slice().sort((a,b)=>D.mins(a.start)-D.mins(b.start));
const KIND = {class:'Class',lunch:'Break',task:'Timed task'};

V.plan = {
  head(){
    const v = T.vs.plan, has = planOf(v.date).length>0;
    return {title:'Plan my day',sub:'Built from your classes, deadlines and priorities. Every rule is visible, and you can edit anything.',
      actions:'<button type="button" class="btn accent" data-act="plan-gen">'+icon('spark')+'<span>'+(has?'Rebuild plan':'Build plan')+'</span></button>'};
  },
  render(){
    const v = T.vs.plan, today = D.today(); if(v.date<today) v.date = today;
    const date = v.date, planned = planOf(date), fixed = V.schedule(date).filter(i=>i.k!=='plan');
    const seg = '<div class="seg" role="radiogroup" aria-label="Plan for"><button type="button" role="radio" aria-checked="'+(date===today)+'" class="'+(date===today?'on':'')+'" data-act="plan-date" data-d="0">Today</button><button type="button" role="radio" aria-checked="'+(date!==today)+'" class="'+(date!==today?'on':'')+'" data-act="plan-date" data-d="1">Tomorrow</button></div>';
    const rows = fixed.map(i=>({fixed:true,i,start:i.start})).concat(planned.map(b=>({fixed:false,b,start:b.start})));
    rows.sort((a,b)=>D.mins(a.start)-D.mins(b.start));
    let list = '';
    if(!rows.length) list = UI.empty({icon:'spark',title:'Nothing on the schedule',text:'Press Build plan and Ticic OS will place your open tasks, deadlines and revision into free time.'});
    else list = rows.map(r=>{
      if(r.fixed){ const i = r.i; return '<div class="plan-r plan-fixed"><span class="mono" style="min-width:128px;font-size:13px">'+esc(D.range(i.start,i.end))+'</span><b style="font-weight:600;flex:1 1 140px;min-width:0;overflow-wrap:anywhere">'+esc(i.title)+'</b><span class="chip">'+(KIND[i.k]||'Fixed')+'</span></div>'; }
      const b = r.b, dn = blockDone(b);
      return '<div class="plan-r">'+UI.chk(dn,'plan-done',b.id,(dn?'Mark not done: ':'Mark done: ')+b.title)
        +'<input class="in" id="pt-'+esc(b.id)+'" style="flex:1 1 170px;min-width:0;width:auto'+(dn?';text-decoration:line-through;color:var(--muted)':'')+'" value="'+esc(b.title)+'" data-change="plan-title" data-id="'+esc(b.id)+'" aria-label="Block title">'
        +'<span style="display:flex;align-items:center;gap:6px"><input class="in" type="time" id="ps-'+esc(b.id)+'" value="'+esc(b.start)+'" data-change="plan-time" data-f="start" data-id="'+esc(b.id)+'" aria-label="Start time"><span class="muted">to</span><input class="in" type="time" id="pe-'+esc(b.id)+'" value="'+esc(b.end)+'" data-change="plan-time" data-f="end" data-id="'+esc(b.id)+'" aria-label="End time"></span>'
        +'<button type="button" class="btn icon sm" data-act="plan-del" data-id="'+esc(b.id)+'" aria-label="Remove block">'+icon('trash',16)+'</button></div>';
    }).join('');
    const mins = T.sum(planned,b=>D.mins(b.end)-D.mins(b.start)), dnN = planned.filter(blockDone).length;
    const study = T.sum(planned.filter(b=>b.kind==='study'),b=>D.mins(b.end)-D.mins(b.start));
    const side = V.card('Summary',
      '<div class="kv"><span class="k">Planned blocks</span><span class="mono">'+dnN+' / '+planned.length+' done</span></div>'
      +'<div class="kv"><span class="k">Planned time</span><span class="mono">'+(mins?D.dur(mins):'0m')+'</span></div>'
      +'<div class="kv"><span class="k">Study time</span><span class="mono">'+D.dur(study)+' of '+(st().studyTarget||4)+'h target</span></div>'
      +(v.left.length?'<div style="margin-top:12px"><div class="lbl" style="margin-bottom:6px">Did not fit</div>'+v.left.map(x=>'<div style="font-size:13px;color:var(--ink-2);padding:3px 0;overflow-wrap:anywhere">'+esc(x)+'</div>').join('')+'</div>':''))
      +V.card('How it works',
      '<ol style="padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2)"><li>Classes, lunch and timed tasks stay fixed.</li><li>Free gaps within your day ('+esc(D.time(st().dayStart))+' to '+esc(D.time(st().dayEnd))+') are found.</li><li>Overdue and due-today work, then assignments due within 3 days and exams within 10 days, are ranked by priority.</li><li>Highest rank goes into the earliest gap that fits, with a 10 minute breather.</li></ol><div style="margin-top:12px"><button type="button" class="btn sm" data-act="go" data-go="settings">Change day hours</button></div>');
    return '<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px">'+seg+'<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn sm" data-act="plan-add">'+icon('plus',15)+'Add block</button>'+(planned.length?'<button type="button" class="btn sm" data-act="plan-clear">Clear plan</button>':'')+'</div></div>'
      +'<div class="cols"><div class="cm"><section class="card pad"><div class="card-h"><h2>'+esc(D.long(date))+'</h2></div>'+list+'</section></div><div class="cs">'+side+'</div></div>';
  }
};

A['plan-date'] = (el) => { const v = T.vs.plan; v.date = D.add(D.today(),+el.dataset.d); v.left = []; T.refresh(); };
A['plan-gen'] = () => {
  const v = T.vs.plan, run = () => {
    const r = V.buildPlan(v.date); S.d.plans[v.date] = r.blocks; v.left = r.left; S.emit();
    UI.toast(r.blocks.length?'Planned '+T.plural(r.blocks.length,'block')+(r.left.length?' · '+r.left.length+' did not fit':''):'Nothing to place. Add tasks or deadlines first.');
  };
  if(planOf(v.date).length) UI.confirm({title:'Rebuild this plan?',msg:'Your current blocks for this day will be replaced.',ok:'Rebuild',danger:false}).then(ok=>{ if(ok) run(); }); else run();
};
A['plan-clear'] = () => { const v = T.vs.plan, old = S.d.plans[v.date]; delete S.d.plans[v.date]; v.left = []; S.emit(); UI.toast('Plan cleared',{undo:()=>{ S.d.plans[v.date] = old; S.emit(); }}); };
A['plan-del'] = (el) => { const v = T.vs.plan, arr = S.d.plans[v.date]||[]; S.d.plans[v.date] = arr.filter(b=>b.id!==el.dataset.id); S.emit(); };
A['plan-done'] = (el) => {
  const b = (S.d.plans[T.vs.plan.date]||[]).find(x=>x.id===el.dataset.id); if(!b) return;
  if(b.ref && b.ref.type==='task' && S.get('tasks',b.ref.id)) S.toggleTask(b.ref.id); else { b.done = !b.done; S.emit(); }
};
A['plan-title'] = (el) => { const b = (S.d.plans[T.vs.plan.date]||[]).find(x=>x.id===el.dataset.id); if(!b) return; const v = el.value.trim(); if(!v){ UI.toast('A block needs a title.'); T.refresh(); return; } b.title = v; S.emit(); };
A['plan-time'] = (el) => {
  const b = (S.d.plans[T.vs.plan.date]||[]).find(x=>x.id===el.dataset.id); if(!b) return;
  const f = el.dataset.f, val = el.value; if(!val){ T.refresh(); return; }
  const n = Object.assign({},b,{[f]:val});
  if(D.mins(n.end)<=D.mins(n.start)){ UI.toast('End time must be after the start time.'); T.refresh(); return; }
  b[f] = val; S.emit();
};
A['plan-add'] = () => UI.prompt({title:'Add a block',label:'What will you work on?',ph:'e.g. Revise Physics notes',ok:'Add'}).then(title=>{
  if(!title) return;
  const v = T.vs.plan, arr = S.d.plans[v.date] || (S.d.plans[v.date] = []);
  const fixed = V.schedule(v.date).concat(arr.map(b=>({start:b.start,end:b.end})));
  let at = D.mins(st().dayStart||'08:00'); if(v.date===D.today()) at = Math.max(at,Math.ceil(D.nowMin()/5)*5);
  const hit = () => fixed.find(i=>D.mins(i.start)<at+30 && D.mins(i.end)>at);
  let guard = 0; while(hit() && guard++<60) at = D.mins(hit().end);
  if(at+30>1439) at = 1409;
  arr.push({id:T.uid('pl'),kind:'study',title,start:D.hhmm(at),end:D.hhmm(at+30),ref:null,done:false}); S.emit();
});

/* =========================================================
   Settings

A['set'] = (el) => {
  const k = el.dataset.k; let v = el.value;
  if(el.type==='number'){
    const x = +v, min = +el.min, max = +el.max;
    if(v==='' || isNaN(x) || x<min || x>max){ UI.toast('Enter a number between '+el.min+' and '+el.max+'.'); T.refresh(); return; }
    v = x;
  } else if(el.tagName==='SELECT' && k==='weekStart') v = +v;
  else if(k==='name'){ v = v.trim(); if(!v){ UI.toast('Name cannot be empty.'); T.refresh(); return; } }
  else if(el.type!=='time') v = v.trim();
  if(el.type==='time' && !v){ T.refresh(); return; }
  if(k==='dayEnd' && D.mins(v)<=D.mins(st().dayStart)){ UI.toast('Day must end after it starts.'); T.refresh(); return; }
  if(k==='dayStart' && D.mins(v)>=D.mins(st().dayEnd)){ UI.toast('Day must start before it ends.'); T.refresh(); return; }
  const parts = k.split('.');
  if(parts.length===2){ S.d.settings[parts[0]][parts[1]] = v; S.emit(); } else S.setting({[k]:v});
};
A['set-tog'] = (el) => {
  const k = el.dataset.k, on = el.checked, parts = k.split('.');
  if(k==='notify.browser' && on){
    if(!('Notification' in window)){ UI.toast('This browser does not support system notifications.'); el.checked = false; return; }
    const done = p => { if(p==='granted'){ S.d.settings.notify.browser = true; S.emit(); UI.toast('Browser notifications on'); } else { S.d.settings.notify.browser = false; S.emit(); UI.toast('Permission was not granted. In-app notifications still work.'); } };
    try{ const r = Notification.requestPermission(); if(r && r.then) r.then(done,()=>done('denied')); else done(r); }catch(e){ done('denied'); }
    return;
  }
  if(parts.length===2) S.d.settings[parts[0]][parts[1]] = on; else S.d.settings[k] = on;
  S.setting({});
};
A['set-theme'] = (el) => S.setting({theme:el.dataset.v});
A['set-days'] = (el) => {
  const days = [...el.closest('[data-days]').querySelectorAll('input:checked')].map(i=>+i.value);
  if(!days.length){ UI.toast('Keep at least one working day.'); T.refresh(); return; }
  S.setting({workDays:days});
};

A['data-export'] = async () => {
  const text = S.exportJSON(), name = 'ticic-os-backup-'+D.today()+'.json';
  let dl = null; try{ dl = window.claude && await window.claude.use('downloads'); }catch(e){}
  if(dl){
    try{ await dl.save({filename:name,data:new Blob([text],{type:'application/json'})}); UI.toast('Backup ready'); return; }
    catch(e){ if(e && e.code==='declined') return; }
  }
  UI.open({kind:'modal',wide:true,title:'Backup',html:'<p class="muted" style="font-size:13px;margin-bottom:10px">Saving a file is not available here. Copy this text into a .json file to keep it.</p><textarea class="in" id="exp-t" readonly rows="10" style="font-family:var(--mono);font-size:12px;padding:10px">'+esc(text)+'</textarea><div class="fm-act"><button type="button" class="btn" data-act="close">Close</button><button type="button" class="btn accent" data-act="copy-export">Copy</button></div>'});
};
A['copy-export'] = async (el) => {
  const ta = document.getElementById('exp-t');
  try{ await navigator.clipboard.writeText(ta.value); UI.toast('Copied to clipboard'); }catch(e){ ta.focus(); ta.select(); UI.toast('Press Ctrl+C to copy the selected text.'); }
};
A['data-import'] = (el) => {
  const f = el.files && el.files[0]; el.value = ''; if(!f) return;
  if(f.size>8*1024*1024){ UI.toast('That file is too large to be a Ticic OS backup.'); return; }
  const r = new FileReader();
  r.onerror = () => UI.toast('Could not read that file.');
  r.onload = () => {
    try{ const o = JSON.parse(r.result); if(!o || o.app!=='ticic-os' || !o.data || !o.data.settings) throw new Error('This does not look like a Ticic OS export.'); }
    catch(e){ UI.toast(e.message.indexOf('Ticic')>=0 ? e.message : 'That file is not valid JSON.'); return; }
    UI.confirm({title:'Replace your data?',msg:'Importing "'+f.name+'" replaces everything currently in Ticic OS.',ok:'Import',danger:false}).then(ok=>{
      if(!ok) return; try{ S.importJSON(r.result); UI.toast('Backup imported'); T.go('dashboard'); }catch(e){ UI.toast(e.message); }
    });
  };
  r.readAsText(f);
};
A['data-demo'] = () => UI.confirm({title:st().demo?'Reset demo data?':'Load demo data?',msg:'This replaces your current tasks, classes, notes and everything else with sample student data.',ok:'Load demo',danger:false}).then(ok=>{ if(!ok) return; T.seedDemo(); UI.toast('Demo data loaded'); T.go('dashboard'); });
A['data-clear'] = () => UI.confirm({title:'Clear all data?',msg:'Tasks, classes, attendance, notes, goals and the rest will be deleted. Your profile and settings stay. This cannot be undone.',ok:'Clear everything'}).then(ok=>{

});

Onb.read = function(){
  const e = Onb.el, s = Onb.s, g = id => e.querySelector('#'+id);

  else body = '<h2 style="font-size:24px;font-weight:600;letter-spacing:-.02em">How do you want to start?</h2><p class="muted" style="margin:8px 0 16px">You can switch any time from Settings.</p><div style="display:flex;flex-direction:column;gap:10px">'
    +[['demo','Explore with sample data','A semester of classes, tasks, attendance and exams so you can see how everything fits together.'],['empty','Start empty','A clean slate. Add your own timetable and subjects.']].map(o=>'<label class="chkrow" style="align-items:flex-start;padding:14px;border:1px solid var(--edge);border-radius:14px;background:var(--glass);gap:12px"><input type="radio" name="ob-start" value="'+o[0]+'"'+(s.start===o[0]?' checked':'')+' style="margin-top:2px"><span><b style="display:block;font-size:15px">'+o[1]+'</b><span class="muted" style="font-size:13px">'+o[2]+'</span></span></label>').join('')+'</div>';

  Onb.el.innerHTML = '<div class="card">'+dots+body+foot+'</div>';
  const f = Onb.el.querySelector('[data-focus]') || Onb.el.querySelector('input,button'); if(f) f.focus({preventScroll:true});

Onb.finish = function(skip){
  if(!skip) Onb.read();
  const s = Onb.s;
  if(!skip){ S.d.settings.name = s.name || 'there'; S.d.settings.college = s.college; S.d.settings.course = s.course; S.d.settings.semester = s.semester; S.d.settings.attTarget = s.target; }
  S.d.settings.onboarded = true;
  if(!skip && s.start==='demo') T.seedDemo(); else ensureTT();
  S.d.settings.onboarded = true; S.d.settings.activeTT = S.d.settings.activeTT || (S.d.timetables[0]||{}).id || null;
  Onb.el.remove(); Onb.el = null; document.body.style.overflow = '';
  S.emit(); T.go('dashboard');
};
A['onb-next'] = () => { Onb.read(); if(Onb.s.step<2){ Onb.s.step++; Onb.draw(); } else Onb.finish(false); };
A['onb-back'] = () => { Onb.read(); if(Onb.s.step>0){ Onb.s.step--; Onb.draw(); } };

/* app.js: shell, router, global listeners, boot */
(function(){
const T = window.T, S = T.S, D = T.D, UI = T.UI, V = T.V, A = T.A, F = T.F, esc = T.esc, icon = T.icon;
const NAV = [['dashboard','Dashboard','home'],['tasks','Tasks','tasks'],['calendar','Calendar','calendar'],['timetable','Timetable','clock'],['attendance','Attendance','users'],['assignments','Assignments','file'],['exams','Exams','cap'],['notes','Notes','note'],['habits','Habits','pulse'],['goals','Goals','target'],['analytics','Analytics','chart'],['plan','Plan my day','spark']];
const $ = id => document.getElementById(id);
let cur = 'dashboard';

/* ---------- routing ---------- */
const parse = r => { const parts = String(r||'').replace(/^#\/?/,'').split('/'); return {name:parts[0]||'dashboard', sub:parts[1]||'', parts}; };
T.go = function(r){
  UI.closeAll(); cur = r || 'dashboard';
  try{ if(location.hash!=='#'+cur) location.hash = cur; }catch(e){}
  render(true);
};
window.addEventListener('hashchange',()=>{
  const h = location.hash.replace(/^#/,''); if(!h || h===cur) return;
  cur = h; UI.closeAll(); render(true);
});

function pageHtml(p){
  const v = V[p.name];
  try{
    const h = v.head ? v.head(p) : {title:p.name};
    return '<header class="head"><div style="min-width:0"><h1>'+h.title+'</h1>'+(h.sub?'<div class="sub">'+h.sub+'</div>':'')+'</div>'+(h.actions?'<div class="head-acts">'+h.actions+'</div>':'')+'</header>'
      +'<div class="view">'+v.render(p)+'</div>';
  }catch(err){
    console.error(err);
    return '<div class="card pad" role="alert"><div class="empty"><h3>This screen hit a problem</h3><p>Your data is safe. Try again or head back to the dashboard.</p><div style="display:flex;gap:8px;margin-top:10px"><button type="button" class="btn" data-act="retry">Try again</button><button type="button" class="btn accent" data-act="go" data-go="dashboard">Dashboard</button></div></div></div>';
  }
}
function render(reset){
  let p = parse(cur); if(!V[p.name]){ cur = 'dashboard'; p = parse(cur); }
  const page = $('page');
  page.innerHTML = pageHtml(p);
  chrome();
  if(reset){ window.scrollTo(0,0); }
}
A.retry = () => render();

/* refresh keeps scroll, focus, caret and any half-typed quick-add text */
T.refresh = function(){
  const a = document.activeElement, inPage = a && $('page').contains(a);
  const id = inPage && a.id ? a.id : null;
  const caret = id && a.setSelectionRange && /^(text|search|url|email|tel|number|)$/.test(a.type||'') ? [a.selectionStart,a.selectionEnd] : null;
  const quick = inPage && a.hasAttribute && a.hasAttribute('data-quick') ? {v:a.value,parsed:(a.closest('form').querySelector('.parsed')||{}).innerHTML||''} : null;
  const y = window.scrollY;
  render(false);
  window.scrollTo(0,y);
  if(id){ const n = $(id); if(n){ n.focus({preventScroll:true}); if(caret){ try{ n.setSelectionRange(caret[0],caret[1]); }catch(e){} } } }
  else if(quick){ const n = $('page').querySelector('[data-quick]'); if(n){ n.value = quick.v; const b = n.closest('form').querySelector('.parsed'); if(b) b.innerHTML = quick.parsed; n.focus({preventScroll:true}); } }
};

function chrome(){
  const name = parse(cur).name, s = S.d.settings;
  document.querySelectorAll('[data-nav]').forEach(a=>{ const on = a.dataset.nav===name; a.classList.toggle('on',on); if(on) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  const main4 = ['dashboard','tasks','calendar'];
  document.querySelectorAll('[data-bn]').forEach(a=>{ const k = a.dataset.bn, on = k==='more' ? !main4.includes(name) : k===name; a.classList.toggle('on',on); if(on) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  const nb = V.bell(), b = $('bellN'); if(b){ b.hidden = !nb; b.textContent = nb>9?'9+':nb; }
  const od = T.Q.overdue().length, nt = $('navTasks'); if(nt){ nt.hidden = !od; nt.textContent = od; }
  $('meAv').textContent = (s.name||'?').trim().charAt(0).toUpperCase();
  $('meName').textContent = s.name||'';
  $('meSub').textContent = [s.course, s.semester?'Sem '+s.semester:''].filter(Boolean).join(' · ');
  const bn = $('banner'); let html = '';
  if(!S.storageOk) html = '<div class="banner" role="status"><span>Browser storage is unavailable here, so changes last only until you close this page.</span><button type="button" class="btn sm" data-act="go" data-go="settings">Export backup</button></div>';
  else if(S.loadError && !T._lerr){ html = '<div class="banner" role="status"><span>Your saved data could not be read, so Ticic OS started fresh.</span><button type="button" class="btn sm" data-act="dismiss-banner">Dismiss</button></div>'; }
  if(bn.innerHTML!==html) bn.innerHTML = html;
}
A['dismiss-banner'] = () => { T._lerr = true; chrome(); };

/* ---------- global actions ---------- */
A.go = (el) => { const r = el.dataset.go || el.dataset.view; if(r) T.go(r); };
A.new = () => { UI.closeAll(); F.quickAdd(); };
A.search = () => { if(UI.top() && UI.top().el.classList.contains('palette')) return; F.palette(); };
A.bell = () => { UI.closeAll(); F.notifications(); };
A.more = () => UI.open({kind:'modal',title:'More',html:'<div class="qa-grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">'+NAV.slice(3).concat([['settings','Settings','gear']]).map(n=>'<button type="button" class="qa-o" data-act="go" data-go="'+n[0]+'"><span class="qa-t">'+icon(n[2],22)+'</span>'+n[1]+'</button>').join('')+'</div>'});
A['notif-readall'] = () => { S.d.notifications.forEach(n=>n.read = true); S.emit(); };
A['notif-clear'] = () => { const snap = S.d.notifications.slice(); S.d.notifications = []; S.emit(); UI.toast('Notifications cleared',{undo:()=>{ S.d.notifications = snap; S.emit(); }}); };
A['notif-open'] = (el) => { const n = S.d.notifications.find(x=>x.id===el.dataset.id); if(!n) return; n.read = true; S.emit(); if(n.go){ T.go(n.go); } };

/* ---------- global listeners ---------- */
document.addEventListener('click',e=>{
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const fn = A[el.dataset.act]; if(!fn) return;
  if(el.tagName==='A') e.preventDefault();
  try{ fn(el,e); }catch(err){ console.error(err); UI.toast('Something went wrong. Please try again.'); }
});
document.addEventListener('input',e=>{
  const el = e.target;
  if(el.matches('[data-quick]')){ const box = el.closest('form').querySelector('.parsed'); if(box) box.innerHTML = F.parsedChips(el.value); return; }
  if(el.matches('[data-st]') && el.tagName!=='SELECT' && el.type!=='checkbox'){
    const k = el.dataset.st.split('.'); T.vs[k[0]][k[1]] = el.value; T.refresh();
  }
});
document.addEventListener('change',e=>{
  const el = e.target;
  if(el.matches('[data-st]') && (el.tagName==='SELECT' || el.type==='checkbox')){
    const k = el.dataset.st.split('.'); T.vs[k[0]][k[1]] = el.type==='checkbox' ? el.checked : el.value; T.refresh(); return;
  }
  const n = el.dataset && el.dataset.change; if(n && A[n]){ try{ A[n](el,e); }catch(err){ console.error(err); UI.toast('Something went wrong. Please try again.'); } }
});
document.addEventListener('submit',e=>{
  const f = e.target.closest('form[data-quickform]'); if(!f) return;
  e.preventDefault();
  const inp = f.querySelector('[data-quick]'), t = F.quickTask(inp.value,{due:f.dataset.due});
  if(!t){ const b = f.querySelector('.parsed'); if(b) b.innerHTML = '<span class="err">Type what you need to do first.</span>'; inp.focus(); return; }
  inp.value = '';
  UI.toast('Added "'+t.title+'"'+(t.due?' · '+D.dt(t.due,t.time):''),{undo:()=>S.del('tasks',t.id)});
  const n = $('page').querySelector('[data-quick]'); if(n) n.focus();
});
document.addEventListener('keydown',e=>{
  const k = e.key, tag = (e.target.tagName||'').toLowerCase();
  if((e.ctrlKey||e.metaKey) && k.toLowerCase()==='k'){ e.preventDefault(); if(T.Onb.el) return; const top = UI.top(); if(top && top.el.classList.contains('palette')) UI.close(top); else { UI.closeAll(); F.palette(); } return; }
  if(k==='Escape'){ if(UI.top()){ e.preventDefault(); UI.close(); } return; }
  if(k==='Tab' && UI.top()){ UI.trap(e); return; }
  if(k==='Enter' && e.target.closest && e.target.closest('.li') && tag==='input'){
    e.preventDefault(); const add = e.target.closest('.fld').querySelector('[data-act="list-add"]'); if(add) add.click(); return;
  }
  if(k==='n' && !e.ctrlKey && !e.metaKey && !e.altKey && !['input','textarea','select'].includes(tag) && !e.target.isContentEditable && !UI.top() && !T.Onb.el){ e.preventDefault(); F.task(); }
});

/* ---------- boot ---------- */
function boot(){
  S.load();
  buildChrome();
  S.on(()=>{ T.refresh(); UI.refresh(); });
  const h = location.hash.replace(/^#/,''); cur = h && V[parse(h).name] ? h : 'dashboard';
  render(true);
  if(!S.d.settings.onboarded) T.Onb.open(); else T.Notifier.scan();
  setInterval(()=>{ if(S.d.settings.onboarded) T.Notifier.scan(); },30000);
  setInterval(()=>{
    const a = document.activeElement, t = a && (a.tagName||'').toLowerCase();
    if(document.hidden || UI.top() || T.Onb.el || ['input','textarea','select'].includes(t)) return;
    T.refresh();
  },60000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden && S.d.settings.onboarded){ T.Notifier.scan(); T.refresh(); } });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();

</script>
</body></html>
